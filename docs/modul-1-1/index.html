:root { color-scheme:light; --hdr:rgba(246,246,251,.94); --bg:#F6F6FB; --card:#FFFFFF; --ink:#14123A; --muted:#62607E; --line:#DFDDEC; --accent:#7B3FE4; --accent-2:#F1EAFD; --teal:#1FA9B0; --grad:linear-gradient(90deg,#9B4DF0,#5B6EE6 55%,#22B3B0); --ok:#1F9D55; --ok-2:#EAF6EF; --err:#D93025; --err-2:#FDECEA; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Space Grotesk", system-ui, sans-serif; }
button { font-family:inherit; }
header { position:sticky; top:env(safe-area-inset-top, 0px); z-index:10; background:rgba(246,246,251,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.hbar { max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:16px; padding:12px 16px; }
.hlogo { height:26px; width:auto; flex:0 0 auto; }
.htitle { font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badges { display:flex; gap:6px; margin-left:auto; }
.bdg { width:30px; height:30px; border-radius:50%; border:2px solid var(--line); background:#fff; font-weight:700; font-size:13px; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:default; }
.bdg.cur { border-color:var(--accent); color:var(--accent); }
.bdg.done { background:var(--ok); border-color:var(--ok); color:#fff; cursor:pointer; }
.xp { font-weight:700; background:var(--ink); color:#fff; border-radius:16px; padding:6px 12px; font-size:14px; white-space:nowrap; }
.hlinks { max-width:1100px; margin:0 auto; display:flex; gap:8px; padding:0 16px 10px; flex-wrap:wrap; }
.hlinks a { font-size:13.5px; font-weight:700; color:var(--ink); text-decoration:none; border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:5px 12px; white-space:nowrap; }
.hlinks a:hover { border-color:var(--accent); color:var(--accent); }
.hlinks a.n8n { background:#EA4B71; border-color:#EA4B71; color:#fff; }
.prog { height:4px; background:#E4E2EE; } .prog i { display:block; height:100%; width:0; background:var(--grad); transition:width .4s; }
main { max-width:1100px; margin:0 auto; padding:24px 16px 120px; }
.screen { display:none; } .screen.active { display:block; animation:fade .35s ease; }
@keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.card { background:var(--card); border-radius:20px; box-shadow:0 18px 50px rgba(20,18,58,.08), 0 1px 3px rgba(20,18,58,.06); padding:28px; }
h1 { font-size:clamp(30px, 5vw, 52px); letter-spacing:-1px; margin:0 0 8px; line-height:1.05; }
h2 { font-size:clamp(24px, 3.4vw, 34px); margin:0 0 6px; letter-spacing:-.5px; }
.kicker { color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:13px; margin-bottom:8px; }
.muted { color:var(--muted); }
.hero { border-radius:20px; overflow:hidden; aspect-ratio:16/9; background:#eee center/cover; margin-bottom:22px; }
.hero.brand { aspect-ratio:auto; height:clamp(180px,32vw,320px); background:#fff center/contain no-repeat; background-size:auto 78%; box-shadow:0 1px 0 var(--line); }
.btn { appearance:none; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:17px; padding:14px 24px; border-radius:14px; cursor:pointer; }
.btn:disabled { background:#C9C6DD; cursor:not-allowed; }
.btn.sec { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
.btn.pulse { animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(123,63,228,.45); } 50% { box-shadow:0 0 0 12px rgba(123,63,228,0); } }
.navbar { position:fixed; left:0; right:0; bottom:0; background:rgba(246,246,251,.96); border-top:1px solid var(--line); z-index:10; }
.navin { max-width:1100px; margin:0 auto; padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display:flex; gap:12px; align-items:center; }
.navin .sp { flex:1; color:var(--muted); font-size:14px; }
input[type=text], textarea { width:100%; font:inherit; font-size:17px; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); }
textarea { min-height:70px; resize:vertical; }
.vidwrap { border-radius:18px; overflow:hidden; background:#000; aspect-ratio:16/9; }
.vidwrap video { width:100%; height:100%; display:block; }
.hint { display:inline-flex; gap:8px; align-items:center; background:var(--accent-2); color:#4B1FA0; border-radius:12px; padding:8px 14px; font-weight:500; margin:14px 0 0; }
.merk { border-left:6px solid var(--accent); background:#fff; border-radius:12px; padding:14px 18px; font-weight:700; font-size:19px; margin-top:16px; }
.fb { border-radius:14px; padding:14px 16px; margin-top:12px; font-weight:500; }
.fb.ok { background:var(--ok-2); color:#14532D; } .fb.bad { background:var(--err-2); color:#8A1F17; } .fb.neutral { background:var(--accent-2); color:#4B1FA0; }
.toast { position:fixed; left:50%; top:76px; transform:translateX(-50%) translateY(-20px); opacity:0; background:var(--ink); color:#fff; padding:10px 18px; border-radius:14px; font-weight:700; z-index:30; transition:all .3s; pointer-events:none; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
/* sliders */
.sl { margin:22px 0; } .sl label { font-weight:700; font-size:19px; display:block; margin-bottom:12px; }
.sl input[type=range] { width:100%; accent-color:var(--accent); height:28px; }
.sl .ends { display:flex; justify-content:space-between; color:var(--muted); font-size:14px; } .sl .val { color:var(--accent); font-weight:700; font-size:22px; }
/* flip */
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; margin-top:18px; }
.flip { perspective:1200px; min-height:230px; }
.flip .in { position:relative; width:100%; height:100%; min-height:230px; transition:transform .6s; transform-style:preserve-3d; }
.flip.turned .in { transform:rotateY(180deg); }
.flip .f, .flip .b { position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; padding:22px; display:flex; flex-direction:column; background:#fff; box-shadow:0 10px 30px rgba(20,18,58,.08); }
.flip .b { transform:rotateY(180deg); }
.flip .s { font-size:20px; font-weight:700; flex:1; }
.flip .ch { display:flex; gap:10px; } .flip .ch button { flex:1; }
.flip .verdict { font-weight:700; font-size:22px; margin-bottom:8px; } .flip .b.ok .verdict { color:var(--ok); } .flip .b.bad .verdict { color:var(--err); }
/* dnd */
.pool { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0; min-height:56px; }
.chip { background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; font-weight:500; cursor:grab; user-select:none; font-size:16px; }
.chip.sel { border-color:var(--accent); box-shadow:0 0 0 3px rgba(123,63,228,.25); }
.chip.placed { cursor:default; background:var(--ok-2); border-color:#BFE3CC; }
.chip.wrong { animation:shake .4s; border-color:var(--err); }
@keyframes shake { 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
.cats { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
.cat { border:2px dashed #C9C6DD; border-radius:16px; padding:14px; min-height:140px; background:rgba(255,255,255,.6); }
.cat.over { border-color:var(--accent); background:var(--accent-2); }
.cat h4 { margin:0 0 10px; font-size:18px; } .cat .chip { display:block; margin-top:8px; }
/* binary + quiz */
.q { font-size:22px; font-weight:700; margin:8px 0 18px; }
.opts { display:grid; gap:10px; } .opts.two { grid-template-columns:1fr 1fr; }
.opt { text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:16px 18px; font-size:18px; font-weight:500; cursor:pointer; color:var(--ink); }
.opt:hover:not(:disabled) { border-color:var(--accent); }
.opt.right { background:var(--ok-2); border-color:var(--ok); } .opt.wrongc { background:var(--err-2); border-color:var(--err); }
.opt:disabled { cursor:default; }
.counter { color:var(--muted); font-weight:500; }
/* rapid */
.rcard { text-align:center; padding:34px 22px; font-size:24px; font-weight:700; min-height:150px; display:flex; align-items:center; justify-content:center; }
.timer { height:8px; background:#E4E2EE; border-radius:4px; overflow:hidden; margin:16px 0; } .timer i { display:block; height:100%; background:var(--accent); width:100%; }
.yn { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .yn .btn { font-size:20px; padding:18px; }
.yn .no { background:var(--ink); }
/* errors */
.sb { margin-top:16px; }
.sbl { display:flex; gap:14px; padding:16px; border:1.5px solid var(--line); border-radius:14px; margin-bottom:10px; background:#fff; cursor:pointer; align-items:flex-start; }
.sbl b { width:110px; flex:none; } .sbl.found { border-color:var(--err); background:var(--err-2); cursor:default; } .sbl.okline { border-color:var(--ok); background:var(--ok-2); }
.sbl .exp { display:block; margin-top:8px; font-weight:500; font-size:15px; }
.own label { font-weight:700; display:block; margin:16px 0 6px; } .own small { color:var(--muted); font-weight:500; }
.row { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
/* summary */
.ml li { margin:10px 0; font-size:18px; font-weight:500; }
.score { font-size:46px; font-weight:700; color:var(--accent); }
.small { font-size:14px; margin-top:10px; }
.dash { padding:8px 14px; font-size:14px; border-radius:12px; }
.btn.warn { background:var(--err); color:#fff; border-color:var(--err); }
.copybox { position:fixed; left:16px; right:16px; bottom:90px; height:120px; z-index:40; font:inherit; font-size:14px; padding:10px; border:2px solid var(--accent); border-radius:12px; background:#fff; color:var(--ink); }
.nl { margin-top:18px; }
.nlform { display:grid; gap:12px; max-width:560px; margin-top:6px; }
.nlform label[for] { font-weight:700; }
.nlform input[type=email] { width:100%; font:inherit; font-size:17px; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); }
.nlform input:focus-visible, .btn:focus-visible, .opt:focus-visible { outline:3px solid rgba(123,63,228,.45); outline-offset:2px; }
.consent { display:flex; gap:12px; align-items:flex-start; font-size:15px; line-height:1.45; color:var(--ink); cursor:pointer; }
.consent input { width:22px; height:22px; flex:none; margin-top:1px; accent-color:var(--accent); }
.nlform .btn { justify-self:start; }
#dash { display:grid; gap:18px; }
#dash h3 { margin:0 0 12px; font-size:20px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:12px; margin-top:16px; }
.stats div { background:var(--bg); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; }
.stats b { font-size:32px; font-variant-numeric:tabular-nums; } .stats span { color:var(--muted); font-size:14px; }
.tbl { overflow-x:auto; }
.tbl table { width:100%; border-collapse:collapse; font-size:15px; min-width:640px; }

<script>
const CAP = { db: null, user: null, dl: null, uid: null, owner: false };
const DATA = {"title": "Automationen verstehen und planen", "subtitle": "Modul 1 · Teil 1 von 3 · ca. 30 Minuten", "intro": "Du verbringst jede Woche Stunden mit Kopieren, Abtippen und immer gleichen Mails. In 30 Minuten verstehst du, wie du genau diese Arbeit an eine Automation abgibst, ohne zu programmieren. Am Ende hast du deinen ersten Prozess so beschrieben, dass ihn eine KI in Teil 2 für dich baut.", "promise": [["Weniger Klickarbeit", "Gib Aufgaben ab, die jede Woche gleich laufen, und gewinn Zeit für die Arbeit, für die du eigentlich da bist."], ["Mehr Wert im Team", "Du wirst die Person, die weiß, wie man mit KI Abläufe schneller macht. Diese Fähigkeit ist in Unternehmen gerade sehr gefragt."], ["Mitreden statt nicken", "n8n, API, Webhook, MCP, Claude Code: Du verstehst, was dahintersteckt, und kannst mit der IT auf Augenhöhe sprechen."]], "levels": [{"id": 1, "title": "Der Kollege, der nie müde wird", "videos": ["INTRO", "V1"], "assist": "Frag deinen KI-Assistenten: Welche Aufgabe aus meinem Job eignet sich zum Automatisieren?", "merksatz": "Was du zweimal pro Woche gleich von Hand machst, ist ein Kandidat für eine Automation.", "kernpunkte": ["Viele verbringen jede Woche Stunden mit Arbeit, die immer gleich abläuft: Daten übertragen, Standardmails, Infos zusammensuchen.", "Eine Automation ist ein Ablauf nach festen Regeln: Wenn das passiert, dann mach das. Wie ein neuer Kollege, der nie müde wird, aber genau das tut, was du ihm sagst.", "Beispiel: Kontaktformular → Kontakt ins CRM → Bestätigungsmail → Vertrieb informieren. Von Hand jedes Mal Minuten, automatisch in Sekunden.", "15 Minuten am Tag sind bei 220 Arbeitstagen über 50 Stunden im Jahr, für eine einzige Aufgabe.", "Urteil bleibt beim Menschen: Verhandlungen, schwierige Gespräche, Feedback. Die Automation nimmt dir die Fleißarbeit ab."], "type": "sliders", "intro": "Bevor es losgeht: Wo geht bei dir heute Zeit verloren? Schieb die Regler, es gibt kein Richtig oder Falsch.", "sliders": [{"id": "hours", "q": "Wie viele Stunden pro Woche verbringst du mit Aufgaben, die sich ständig wiederholen?", "min": 0, "max": 15, "step": 1, "val": 4, "unit": " Std.", "maxlabel": "15+ Std."}, {"id": "tools", "q": "Mit wie vielen Programmen arbeitest du täglich (Mail, Kalender, CRM, Excel, Teams …)?", "min": 1, "max": 10, "step": 1, "val": 4, "unit": "", "maxlabel": "10+"}, {"id": "tech", "q": "Wie sicher fühlst du dich mit Technik?", "min": 1, "max": 5, "step": 1, "val": 3, "unit": "", "minlabel": "Ich bin froh, wenn der Drucker geht", "maxlabel": "Ich richte gern Tools ein"}], "xp": 50}, {"id": 2, "title": "Was ist n8n?", "videos": ["V2"], "merksatz": "n8n ist der Motor: Er führt deine Automationen aus, rund um die Uhr.", "kernpunkte": ["n8n ist eine Plattform für Automationen aus Berlin (gegründet 2019). Du verbindest damit Programme wie Outlook, Gmail, CRM, Excel oder Teams über Hunderte fertige Bausteine.", "Ein Workflow sieht aus wie Kästchen mit Linien: links startet er, rechts kommt das Ergebnis heraus. Jeden Schritt kannst du anklicken und die Daten sehen.", "n8n läuft in der Cloud von n8n oder auf eurem eigenen Server. Auf dem eigenen Server bleiben die Daten im Unternehmen.", "Warum n8n statt Make, Zapier oder Pabbly: Die Anbindung an KI-Agenten wie Claude Code klappt hier am besten. Ziel ist keine Insellösung, sondern alle Systeme zentral zusammenzubringen, damit KI-Agenten sie gemeinsam steuern können.", "Im Kurs bekommst du einen Schulungszugang (wir sind n8n-Partner). Nach dem Kurs kopierst du deine Automationen einfach in deine eigene n8n-Umgebung, auf eigenem Server oder mit n8n-Abo.", "n8n kann KI-Modelle einbauen, z. B. um Mails zusammenzufassen oder Anfragen einzuordnen."], "type": "flip", "intro": "Irrtum oder Fakt? Tippe deine Einschätzung, dann dreht sich die Karte um.", "cards": [{"s": "Was ich im Schulungszugang baue, ist nach dem Kurs weg.", "a": "irrtum", "r": "Du kannst deine Automationen duplizieren und in deine eigene n8n-Umgebung kopieren, auf eigenem Server oder mit n8n-Abo."}, {"s": "Für n8n muss ich programmieren können.", "a": "irrtum", "r": "n8n arbeitet mit fertigen Bausteinen. Und in diesem Kurs baut eine KI den Workflow nach deiner Beschreibung."}, {"s": "n8n kann auf dem eigenen Server der Firma laufen.", "a": "fakt", "r": "Dann bleiben die Daten im Haus. Wie das geht, lernst du in Teil 3."}, {"s": "In einen n8n-Workflow kann ich auch ein KI-Modell einbauen.", "a": "fakt", "r": "Zum Beispiel, um eine Mail zusammenzufassen oder eine Anfrage nach Dringlichkeit einzuordnen."}], "xp_each": 20}, {"id": 3, "title": "Die fünf Bausteine", "videos": ["V3"], "merksatz": "Ein Trigger startet den Workflow, Nodes erledigen die Arbeit, Credentials geben die Erlaubnis.", "kernpunkte": ["Trigger (Auslöser): startet den Ablauf, z. B. ein Formular, eine neue Mail oder „jeden Montag um 8 Uhr“. In der Küche: die Bestellung.", "Node (Knoten): eine Station mit genau einer Aufgabe, z. B. Kontakt anlegen oder Mail senden. In der Küche: schneiden, braten, anrichten.", "Workflow: der ganze Ablauf in der richtigen Reihenfolge. Zwischen den Nodes fließen Daten. In der Küche: das Rezept.", "Credential (Zugangsdaten): die Erlaubnis, z. B. in dein CRM zu schreiben. Credentials legst du immer selbst an, nie die KI.", "Execution (Ausführung): jeder einzelne Durchlauf. In n8n siehst du alle Executions in einer Liste, grün oder rot."], "type": "dnd", "intro": "Ordne jedes Beispiel dem richtigen Baustein zu. Ziehen oder antippen, dann die Kategorie antippen.", "cats": ["Trigger", "Node", "Credential", "Execution"], "items": [{"t": "Eine Kundin schickt das Kontaktformular ab", "c": "Trigger", "f": "Das Formular startet den Ablauf, es ist der Auslöser."}, {"t": "Jeden Montag um 8 Uhr", "c": "Trigger", "f": "Auch eine Uhrzeit kann einen Workflow starten."}, {"t": "Kontakt im CRM anlegen", "c": "Node", "f": "Eine Station mit genau einer Aufgabe ist ein Node."}, {"t": "Bestätigungsmail senden", "c": "Node", "f": "Eine einzelne Aufgabe im Ablauf ist ein Node."}, {"t": "Der API-Schlüssel für dein CRM", "c": "Credential", "f": "Zugangsdaten, mit denen n8n sich anmelden darf, sind Credentials."}, {"t": "Der Durchlauf von heute 14:03 Uhr, rot markiert", "c": "Execution", "f": "Jeder einzelne Durchlauf ist eine Execution. Rot heißt: Hier gab es einen Fehler."}], "xp_each": 10}, {"id": 4, "title": "API und Webhook", "videos": ["V4"], "merksatz": "API heißt: Du fragst nach. Webhook heißt: Du wirst benachrichtigt.", "kernpunkte": ["API (Programmierschnittstelle) ist wie der Kellner im Restaurant: Ein Programm bestellt, das andere liefert. Was geht, steht in der Doku, der „Speisekarte“.", "Ein API-Schlüssel ist wie eine Kundenkarte mit Passwort. Du hinterlegst ihn in n8n als Credential und gibst ihn nie weiter.", "Antworten kommen meist als JSON: eine ordentliche Liste aus Name und Wert. n8n zeigt sie dir als Tabelle.", "Webhook ist die Türklingel: Das andere Programm meldet sich von selbst, sobald etwas passiert. In n8n ist das ein Trigger mit eigener Adresse (URL).", "Regel: Soll sofort etwas passieren, wenn woanders etwas passiert → Webhook. Daten abholen oder etwas anlegen → API. Oft kombiniert."], "type": "binary", "intro": "Welcher Weg passt? Entscheide dich für eine der zwei Möglichkeiten.", "items": [{"q": "Dein Online-Shop soll n8n sofort melden, wenn eine Bestellung eingeht.", "o": ["Webhook", "API"], "a": 0, "r": "Der Shop klingelt bei n8n, sobald etwas passiert."}, {"q": "n8n soll jeden Morgen die offenen Rechnungen aus der Buchhaltung abholen.", "o": ["Webhook", "API"], "a": 1, "r": "n8n fragt aktiv nach und bekommt eine Antwort."}, {"q": "Eine Kundin bucht einen Termin, und der Workflow soll sofort starten.", "o": ["Webhook", "API"], "a": 0, "r": "Das Buchungstool benachrichtigt n8n von selbst."}, {"q": "n8n soll im CRM einen neuen Kontakt anlegen.", "o": ["API", "Webhook"], "a": 0, "r": "n8n schickt eine Anfrage an die Schnittstelle des CRM."}, {"q": "Wo hinterlegst du den API-Schlüssel deines CRM?", "o": ["In n8n als Credential", "Im Chat mit der KI"], "a": 0, "r": "Schlüssel gehören in die Credentials, nie in einen Chat oder eine Mail."}], "xp_each": 15}, {"id": 5, "title": "MCP und Claude Code", "videos": ["V5"], "merksatz": "MCP ist die Steckdose, Claude Code der Baumeister, n8n der Motor.", "kernpunkte": ["Ein KI-Chat kann erklären, wie ein Workflow aussehen müsste, ihn aber nicht in dein n8n eintragen. Ihm fehlt der Zugang.", "MCP (Model Context Protocol) ist ein offener Standard, den Anthropic Ende 2024 veröffentlicht hat. Heute nutzen ihn auch OpenAI, Google und viele andere. Wie eine Steckdose: Jede KI mit passendem Stecker kann die Werkzeuge dahinter benutzen.", "n8n hat eine MCP-Steckdose eingebaut. Du schaltest sie ein und bestimmst, welche Workflows die KI sehen darf.", "Claude Code ist ein KI-Assistent von Anthropic, der nicht nur redet, sondern arbeitet: Er baut, testet und repariert Workflows in n8n nach deiner Beschreibung.", "Sicherheit: Passwörter und Schlüssel trägst du selbst ein. Du entscheidest, was die KI sieht, und gibst frei, bevor etwas live geht."], "type": "dnd", "intro": "Wer macht was? Ordne jede Aussage der richtigen Rolle zu.", "cats": ["n8n (Motor)", "Claude Code (Baumeister)", "MCP (Steckdose)"], "items": [{"t": "Führt den Workflow jede Nacht um 2 Uhr aus", "c": "n8n (Motor)", "f": "n8n läuft rund um die Uhr, auch wenn niemand hinschaut."}, {"t": "Baut aus deinem Steckbrief einen Workflow", "c": "Claude Code (Baumeister)", "f": "Der Baumeister setzt deine Beschreibung um."}, {"t": "Erlaubt einer KI, Werkzeuge in n8n zu bedienen", "c": "MCP (Steckdose)", "f": "MCP ist die standardisierte Verbindung zwischen KI und Werkzeug."}, {"t": "Liest eine Fehlermeldung und schlägt eine Reparatur vor", "c": "Claude Code (Baumeister)", "f": "Testen und Reparieren gehört zum Baumeister."}, {"t": "Speichert jede Ausführung mit Status grün oder rot", "c": "n8n (Motor)", "f": "Die Executions-Liste ist Teil von n8n."}, {"t": "Offener Standard, den auch OpenAI und Google nutzen", "c": "MCP (Steckdose)", "f": "MCP ist nicht an einen Anbieter gebunden."}], "xp_each": 10}, {"id": 6, "title": "Welche KI-Modelle?", "videos": ["V6"], "assist": "Bereite mit deinem KI-Assistenten das Gespräch mit deiner Führungskraft vor: Nutzen, Datenschutz, Kosten, Einwände.", "merksatz": "Der Baumeister baut, der Baustein arbeitet mit. Für beides gibt es mehrere Anbieter, und du kannst sie austauschen.", "kernpunkte": ["KI kommt an zwei Stellen vor: als Baumeister, der den Workflow baut, und als Baustein im Workflow, der bei jedem Durchlauf mitarbeitet.", "Baumeister: Claude Code (im Claude-Pro-Abo), Codex von OpenAI (mit ChatGPT-Abo) oder Gemini CLI von Google (mit Google-Konto kostenlos zum Ausprobieren). Prinzip immer: beschreiben, bauen lassen, prüfen.", "Baustein im Workflow: In n8n lassen sich GPT, Claude, Gemini, Mistral oder ein lokales Modell auf dem eigenen Server einbauen. Abgerechnet wird per API-Schlüssel nach Nutzung.", "Abo = für dich als Mensch, fester Monatspreis. API = für Programme wie n8n, Bezahlung nach Nutzung.", "Lokal mit Ollama: Ein kostenloses Programm, mit dem ihr offene KI-Modelle (z. B. Llama, Qwen, Gemma, Mistral) auf dem eigenen Server betreibt. Laufen n8n und Ollama beide bei euch, verlässt kein Datensatz das Haus.", "Mit der IT klären: Grafikkarte mit genug Speicher (Faustregel: kleine Modelle ab etwa 8–16 GB), genug Arbeitsspeicher und Festplatte, wer Updates und Backups macht, und welche Aufgaben das Modell übernehmen soll.", "Bei Cloud-Modellen: Erlaubt unsere Firma den Anbieter? Wo werden die Daten verarbeitet? Werden sie zum Training genutzt? Datenschutzbeauftragten früh einbinden, am Anfang mit Testdaten arbeiten.", "Jede Automation spart nicht einmal Zeit, sondern jede Woche, für immer. Fass den Mut, geh mit einem kleinen ersten Schritt zu den Entscheidern und bereite das Gespräch mit dem KI-Assistenten vor."], "type": "binary", "intro": "Baumeister oder Baustein, Abo oder API? Ents   function start() { Q = shuffle(DATA.check).map(q => ({ ...q, opts: shuffle([q.a, ...q.d]) })); i = 0; score = 0; wrong = []; ask(); }
  function ask() {
    if (i >= Q.length) return done();
    const q = Q[i]; box.innerHTML = '<div class="counter">Frage ' + (i + 1) + ' von ' + Q.length + '</div><div class="q">' + esc(q.q) + '</div>';

    q.opts.forEach(t => { const b = el("button", "opt", esc(t)); o.appendChild(b);

        fb.innerHTML = '<div class="fb ' + (ok ? "ok" : "bad") + '">' + (ok ? "Richtig." : "Richtig wäre: " + esc(q.a) + " – schau dir noch einmal Level " + q.lv + " an.") + '</div>';

  }

    if (!S.check || score > S.check.best) { const gain = (score - (S.check ? S.check.best : 0)) * 10; if (gain > 0) addXP(gain, "Check"); }
    S.check = { best: Math.max(score, S.check ? S.check.best : 0), passed: passed || (S.check && S.check.passed) }; S.checkTries = (S.checkTries || 0) + 1; S.checkWrong = wrong.map(q => q.q); save(); badges();

const WEBHOOK = "https://n8n.hm-storage.de/webhook/kurs-lernstand";

const TID_KEY = "m11-teilnehmer-id";
CAP.dl = { save: async ({ filename, data }) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "text/plain;charset=utf-8" })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); } };

function teilnehmerId() {
  let id = null;
  try { id = localStorage.getItem(TID_KEY); } catch (e) {}
  if (!id) {
    const r = new Uint8Array(12); crypto.getRandomValues(r);
    id = "t_" + Array.from(r, b => b.toString(16).padStart(2, "0")).join("");
    try { localStorage.setItem(TID_KEY, id); } catch (e) {}
  }
  return id;
}

function schrittName(i) {
  const st = STEPS[i] || {}; if (st.k === "start") return "Start"; if (st.k === "check") return "Abschluss-Check"; if (st.k === "summary") return "Abschluss";
  if (st.k === "video") return st.lv > NLV ? "Abschlussvideo" : "Level " + st.lv + " · Video"; if (st.k === "task") return "Level " + st.lv + " · Aufgabe"; return String(i);

function payload(extra) {

    kurscode: S.kurscode || "", teilnehmer_id: teilnehmerId(), name: S.name || "", kurs: KURS,
    level_fertig: Object.keys(S.done).length, level_gesamt: NLV, check_gesamt: DATA.check.length, fortschritt_prozent: Math.round((S.maxStep || 0) / (STEPS.length - 1) * 100),

  }, extra || {});
}
function post(body) {
  return fetch(WEBHOOK, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), keepalive: true });
}
let syncTimer = null, lastSent = "";
function syncLater() {
  try { updMeta(); } catch (e) {}
  if (!S.name || !S.kurscode) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { const b = payload(); const k = JSON.stringify(b); if (k === lastSent) return; lastSent = k; post(b).catch(() => { lastSent = ""; }); }, 1500);
}
window.addEventListener("pagehide", () => { if (syncTimer) { clearTimeout(syncTimer); const b = payload(); if (JSON.stringify(b) !== lastSent && S.name && S.kurscode) post(b).catch(() => {}); } });

// ---------- Abschluss: Zusammenfassung per Mail, Ausblick ----------
function newsletterBox(sc) {
  const c = el("div", "card nl"); sc.appendChild(c);
  c.innerHTML = '<div class="kicker">Für deinen Rechner</div><h2>Zusammenfassung per E-Mail</h2><p class="muted">Wir schicken dir deinen Prozess-Steckbrief und die Merksätze als E-Mail. So hast du alles für Teil 2 griffbereit.</p>';
  const f = el("form", "nlform"); f.noValidate = true; c.appendChild(f);
  const lb = el("label", "", "E-Mail-Adresse"); lb.htmlFor = "tn-email";
  const inp = el("input"); inp.type = "email"; inp.id = "tn-email"; inp.autocomplete = "email"; inp.placeholder = "name@firma.de"; inp.value = S.email || "";
  const cb = el("label", "consent"); const box = el("input"); box.type = "checkbox"; box.id = "tn-consent"; cb.appendChild(box);
  cb.appendChild(el("span", "", "Ja, schickt mir meine Zusammenfassung an diese Adresse. Die Adresse wird nur dafür und für Infos zu diesem Kurs genutzt."));
  const btn = el("button", "btn", "Zusammenfassung senden"); btn.type = "submit";
  const msg = el("div"); f.append(lb, inp, cb, btn, msg);
  if (S.mailSentTo) msg.innerHTML = '<div class="fb ok">Zuletzt gesendet an <b>' + esc(S.mailSentTo) + '</b>. Du kannst sie jederzeit erneut anfordern.</div>';
  f.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const email = inp.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { msg.innerHTML = '<div class="fb bad">Bitte gib eine gültige E-Mail-Adresse ein, z. B. name@firma.de.</div>'; inp.focus(); return; }
    if (!box.checked) { msg.innerHTML = '<div class="fb bad">Bitte setz den Haken, damit wir dir die E-Mail schicken dürfen.</div>'; return; }
    if (!S.name || !S.kurscode) { msg.innerHTML = '<div class="fb bad">Name oder Kurscode fehlen. Trag beides auf der Startseite ein.</div>'; return; }
    btn.disabled = true; btn.textContent = "Wird gesendet …";
    try {
      const r = await post(payload({ email, mail_senden: true, merksaetze: DATA.levels.map(L => L.merksatz) }));
      if (!r.ok) throw new Error(r.status);
      S.email = email; S.mailSentTo = email; save();
      msg.innerHTML = '<div class="fb ok">Abgeschickt! Die E-Mail kommt in den nächsten Minuten. Schau auch im Spam-Ordner nach.</div>';
    } catch (e) { msg.innerHTML = '<div class="fb bad">Das hat gerade nicht geklappt. Prüf deine Internetverbindung und versuch es noch einmal.</div>'; }
    btn.disabled = false; btn.textContent = "Zusammenfassung senden";
  });

  const next = el("div", "card nl");
  next.innerHTML = '<div class="kicker">Wie es weitergeht</div><h2>Teil 2, Teil 3 und Hermes</h2>' +
    '<div class="outlook">' +
    '<div><b>Teil 2 · Automationen bauen lassen</b><span>Du verbindest n8n mit Claude Code und lässt aus deinem Steckbrief die erste Automation bauen. Kein Claude-Abo? Mit ChatGPT geht es auch.</span></div>' +
    '<div><b>Teil 3 · Dein eigener Server</b><span>n8n auf einem eigenen Server bei Hetzner, inklusive Umzug deiner Workflows.</span></div>' +
    '<div class="soon"><b>Bald · Modul Hermes</b><span>Dein eigener KI-Agent, der für dich mitarbeitet. Ein eigenes Modul ist in Vorbereitung.</span></div>' +
    '</div><p class="muted" style="margin-top:14px">Fragen zum Einrichten? Unten rechts hilft dir der Setup-Assistent, auch mit Screenshots.</p>';
  sc.appendChild(next);
}

// ---------- Video lädt nicht: Hinweis mit direktem Link ----------
document.addEventListener("error", (ev) => {
  let v = ev.target;
  if (v && v.tagName === "SOURCE") { if (v.nextElementSibling) return; v = v.parentElement; }
  if (!v || v.tagName !== "VIDEO" || v.dataset.errShown) return;
  v.dataset.errShown = "1";
  const box = el("div", "fb bad", "Das Video lädt hier gerade nicht. <a href=\"" + (v.querySelector("source") || v).getAttribute("src") + "\" target=\"_blank\" rel=\"noopener\">Video direkt öffnen</a> oder die Seite mit Chrome, Edge oder Safari neu laden.");
  v.closest(".vidwrap").after(box);
}, true);

// ---------- Setup-Assistent (n8n Chat) ----------
window.openAssistant = function () {
  const t = document.querySelector(".chat-window-toggle");
  const win = document.querySelector(".chat-window");
  if (t && !(win && win.offsetParent)) t.click();
  if (!t) toast("Der Assistent lädt noch, versuch es gleich noch einmal.");
};
(function loadChat() {
  const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "media/n8n-chat.css"; document.head.appendChild(css);
  const s = document.createElement("script"); s.type = "module";
  s.textContent = "import { createChat } from './media/n8n-chat.js';" +
    "createChat({ webhookUrl: 'https://n8n.hm-storage.de/webhook/55498f00-289d-43ca-899e-f23fbf4c0d69/chat', mode: 'window', showWelcomeScreen: false, loadPreviousSession: false, metadata: window.__chatMeta," +
    " allowFileUploads: true, allowedFilesMimeTypes: 'image/*', defaultLanguage: 'en'," +
    " initialMessages: ['Hallo! Ich bin dein Setup-Assistent.', 'Frag mich alles zum Einrichten: Claude Code, ChatGPT, die Verbindung zu n8n oder deinen eigenen Server. Du kannst mir auch Screenshots schicken.', 'Gut zu wissen: Deine Fragen und meine Antworten speichert die Kursleitung mit deinem Namen, um dich zu betreuen und den Kurs zu verbessern. Verarbeitet werden sie von einem KI-Dienst (OpenAI). Schick bitte keine Kundendaten, Passwörter oder Firmeninterna. Löschen kannst du alles jederzeit unter „Datenschutz im Kurs“ auf der Startseite.']," +
    " i18n: { en: { title: 'Setup-Assistent', subtitle: 'Hilfe beim Einrichten, Schritt für Schritt', footer: '', getStarted: 'Neues Gespräch', inputPlaceholder: 'Deine Frage …', closeButtonTooltip: 'Schließen' } } });";
  document.body.appendChild(s);
})();


// ---------- Datenschutz im Kurs: Übersicht, Daten ansehen, Daten löschen ----------
const DELETE_HOOK = "https://n8n.hm-storage.de/webhook/kurs-daten-loeschen";
function dzBox() {
  const dz = el("details", "dzbox");
  dz.innerHTML = '<summary>Datenschutz im Kurs: was gespeichert wird und wie du es löschst</summary>' +
    '<p class="small">Die Kursleitung speichert Daten zu deinem Kursfortschritt. Sie nutzt sie, um dich zu betreuen und den Kurs zu verbessern, zum Beispiel um zu sehen, an welchen Stellen viele hängen bleiben. Andere Teilnehmer sehen nichts davon.</p>' +
    '<table class="dztab"><tr><th>Was</th><th>Wo</th></tr>' +
    '<tr><td><b>Name, E-Mail-Adresse, Kurscode</b></td><td>Server der Kursleitung</td></tr>' +
    '<tr><td><b>Lernstand:</b> erledigte Level, aktueller Schritt, XP, Check-Ergebnis und falsch beantwortete Check-Fragen</td><td>Server der Kursleitung</td></tr>' +
    '<tr><td><b>Dein Prozess-Steckbrief</b></td><td>Server der Kursleitung</td></tr>' +
    '<tr><td><b>Deine Fragen an den Assistenten und seine Antworten</b>, mit deinem Namen</td><td>Server der Kursleitung. Verarbeitet werden sie von einem KI-Dienst (OpenAI).</td></tr>' +
    '<tr><td><b>Anfragen</b> für Zugang oder Angebot</td><td>Server der Kursleitung</td></tr>' +
    '<tr><td><b>Community</b>: Fragen, Antworten und Nachrichten an Dozenten (mit Vorname)</td><td>Server der Kursleitung</td></tr>' +
    '<tr><td><b>Fortschritt und Eingaben</b> zum Weitermachen</td><td>nur in deinem Browser</td></tr>' +
    '<tr><td><b>Seitenaufruf</b> (IP-Adresse)</td><td>GitHub Pages, liefert Seite und Videos aus</td></tr></table>' +
    '<p class="small"><b>Bitte beachte:</b> In den Übungen und im Chat nur Testdaten verwenden. Keine Kunden- oder Mitarbeiterdaten, keine Passwörter.</p>' +
    '<div class="dzbtns"></div><div class="dzmsg"></div>' +
    '<p class="small muted">Verantwortlich und weitere Infos: <a href="https://momentum-ki-akademie.de/datenschutz" target="_blank" rel="noopener">Datenschutzerklärung</a> · <a href="https://momentum-ki-akademie.de/impressum" target="_blank" rel="noopener">Impressum</a></p>';
  const btns = $(".dzbtns", dz), msg = $(".dzmsg", dz);
  const show = el("button", "btn sec", "Meine gespeicherten Daten anzeigen");
  show.onclick = () => {
    const b = payload();
    const rows = [["Teilnehmer-ID", b.teilnehmer_id], ["Name", b.name], ["E-Mail", b.email], ["Kurs", b.kurs], ["Gestartet", b.gestartet ? new Date(b.gestartet).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" }) : "–"],
      ["Aktueller Schritt", b.aktueller_schritt], ["Erledigte Level", b.levels_liste || "–"], ["XP", b.xp], ["Check: beste Wertung", b.check_best == null ? "–" : b.check_best],
      ["Check: Versuche", b.check_versuche], ["Check: falsch beantwortet", b.check_fehler || "–"], ["Steckbrief", (b.steckbrief || []).filter(x => x).join(" / ") || "–"]];
    msg.innerHTML = '<table class="dztab">' + rows.map(r => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(String(r[1] ?? "")) + '</td></tr>').join("") + '</table>' +
      '<p class="small muted">Dazu kommen deine Fragen an den Assistenten, falls du ihm etwas geschrieben hast.</p>';
  };
  const del = el("button", "btn sec", "Meine Kursdaten löschen");
  confirmBtn(del, async () => {
    del.disabled = true; del.textContent = "Wird gelöscht …";
    try {
      const r = await fetch(DELETE_HOOK, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ kurscode: S.kurscode || "", teilnehmer_id: teilnehmerId() }) });
      if (!r.ok) throw new Error(r.status);
      try { Object.keys(localStorage).filter(k => /^m1[12]-/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (e) {}
      msg.innerHTML = '<div class="fb ok">Erledigt. Deine Kursdaten auf dem Server der Kursleitung und in diesem Browser sind gelöscht. Die Seite startet gleich neu.</div>';
      setTimeout(() => location.reload(), 3500);
    } catch (e) { del.disabled = false; del.textContent = "Meine Kursdaten löschen"; msg.innerHTML = '<div class="fb bad">Das hat nicht geklappt. Versuch es noch einmal oder schreib der Kursleitung.</div>'; }
  });
  btns.append(show, del);
  return dz;
}
const _renderSummaryDz = renderSummary;
renderSummary = function (sc) { _renderSummaryDz(sc); const c = el("div", "card"); c.appendChild(dzBox()); sc.appendChild(c); };

$("#next").onclick = () => go(S.step + 1);
$("#back").onclick = () => go(S.step - 1);
if (S.step > 0 && !kurscodeOk(S.kurscode)) S.step = 0;
render();
</script>
