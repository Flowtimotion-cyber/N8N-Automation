:root { color-scheme:light; --hdr:rgba(246,246,251,.94); --bg:#F6F6FB; --card:#FFFFFF; --ink:#14123A; --muted:#62607E; --line:#DFDDEC; --accent:#7B3FE4; --accent-2:#F1EAFD; --teal:#1FA9B0; --grad:linear-gradient(90deg,#9B4DF0,#5B6EE6 55%,#22B3B0); --ok:#1F9D55; --ok-2:#EAF6EF; --err:#D93025; --err-2:#FDECEA; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Space Grotesk", system-ui, sans-serif; }
button { font-family:inherit; }
header { position:sticky; top:env(safe-area-inset-top, 0px); z-index:10; background:rgba(246,246,251,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.hbar { max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:16px; padding:12px 16px; }
.hlogo { height:26px; width:auto; flex:0 0 auto; }
.htitle { font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badges { display:flex; gap:6px; margin-left:auto; }
.bdg { width:30px; height:30px; border-radius:50%; border:2px solid var(--line); background:#fff; font-weight:700; font-size:13px; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:default; }
.bdg.cur { border-color:var(--accent); color:var(--accent); }
.bdg.done { background:var(--ok); border-color:var(--ok); color:#fff; cursor:pointer; }
.xp { font-weight:700; background:var(--ink); color:#fff; border-radius:16px; padding:6px 12px; font-size:14px; white-space:nowrap; }
.hlinks { max-width:1100px; margin:0 auto; display:flex; gap:8px; padding:0 16px 10px; flex-wrap:wrap; }
.hlinks a { font-size:13.5px; font-weight:700; color:var(--ink); text-decoration:none; border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:5px 12px; white-space:nowrap; }
.hlinks a:hover { border-color:var(--accent); color:var(--accent); }
.hlinks a.n8n { background:#EA4B71; border-color:#EA4B71; color:#fff; }
.prog { height:4px; background:#E4E2EE; } .prog i { display:block; height:100%; width:0; background:var(--grad); transition:width .4s; }
main { max-width:1100px; margin:0 auto; padding:24px 16px 120px; }
.screen { display:none; } .screen.active { display:block; animation:fade .35s ease; }
@keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.card { background:var(--card); border-radius:20px; box-shadow:0 18px 50px rgba(20,18,58,.08), 0 1px 3px rgba(20,18,58,.06); padding:28px; }
h1 { font-size:clamp(30px, 5vw, 52px); letter-spacing:-1px; margin:0 0 8px; line-height:1.05; }
h2 { font-size:clamp(24px, 3.4vw, 34px); margin:0 0 6px; letter-spacing:-.5px; }
.kicker { color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:13px; margin-bottom:8px; }
.muted { color:var(--muted); }
.hero { border-radius:20px; overflow:hidden; aspect-ratio:16/9; background:#eee center/cover; margin-bottom:22px; }
.hero.brand { aspect-ratio:auto; height:clamp(180px,32vw,320px); background:#fff center/contain no-repeat; background-size:auto 78%; box-shadow:0 1px 0 var(--line); }
.btn { appearance:none; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:17px; padding:14px 24px; border-radius:14px; cursor:pointer; }
.btn:disabled { background:#C9C6DD; cursor:not-allowed; }
.btn.sec { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
.btn.pulse { animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(123,63,228,.45); } 50% { box-shadow:0 0 0 12px rgba(123,63,228,0); } }
.navbar { position:fixed; left:0; right:0; bottom:0; background:rgba(246,246,251,.96); border-top:1px solid var(--line); z-index:10; }
.navin { max-width:1100px; margin:0 auto; padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display:flex; gap:12px; align-items:center; }
.navin .sp { flex:1; color:var(--muted); font-size:14px; }
input[type=text], textarea { width:100%; font:inherit; font-size:17px; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); }
textarea { min-height:70px; resize:vertical; }
.vidwrap { border-radius:18px; overflow:hidden; background:#000; aspect-ratio:16/9; }
.vidwrap video { width:100%; height:100%; display:block; }
.hint { display:inline-flex; gap:8px; align-items:center; background:var(--accent-2); color:#4B1FA0; border-radius:12px; padding:8px 14px; font-weight:500; margin:14px 0 0; }
.merk { border-left:6px solid var(--accent); background:#fff; border-radius:12px; padding:14px 18px; font-weight:700; font-size:19px; margin-top:16px; }
.fb { border-radius:14px; padding:14px 16px; margin-top:12px; font-weight:500; }
.fb.ok { background:var(--ok-2); color:#14532D; } .fb.bad { background:var(--err-2); color:#8A1F17; } .fb.neutral { background:var(--accent-2); color:#4B1FA0; }
.toast { position:fixed; left:50%; top:76px; transform:translateX(-50%) translateY(-20px); opacity:0; background:var(--ink); color:#fff; padding:10px 18px; border-radius:14px; font-weight:700; z-index:30; transition:all .3s; pointer-events:none; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
/* sliders */
.sl { margin:22px 0; } .sl label { font-weight:700; font-size:19px; display:block; margin-bottom:12px; }
.sl input[type=range] { width:100%; accent-color:var(--accent); height:28px; }
.sl .ends { display:flex; justify-content:space-between; color:var(--muted); font-size:14px; } .sl .val { color:var(--accent); font-weight:700; font-size:22px; }
/* flip */
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; margin-top:18px; }
.flip { perspective:1200px; min-height:230px; }
.flip .in { position:relative; width:100%; height:100%; min-height:230px; transition:transform .6s; transform-style:preserve-3d; }
.flip.turned .in { transform:rotateY(180deg); }
.flip .f, .flip .b { position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; padding:22px; display:flex; flex-direction:column; background:#fff; box-shadow:0 10px 30px rgba(20,18,58,.08); }
.flip .b { transform:rotateY(180deg); }
.flip .s { font-size:20px; font-weight:700; flex:1; }
.flip .ch { display:flex; gap:10px; } .flip .ch button { flex:1; }
.flip .verdict { font-weight:700; font-size:22px; margin-bottom:8px; } .flip .b.ok .verdict { color:var(--ok); } .flip .b.bad .verdict { color:var(--err); }
/* dnd */
.pool { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0; min-height:56px; }
.chip { background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; font-weight:500; cursor:grab; user-select:none; font-size:16px; }
.chip.sel { border-color:var(--accent); box-shadow:0 0 0 3px rgba(123,63,228,.25); }
.chip.placed { cursor:default; background:var(--ok-2); border-color:#BFE3CC; }
.chip.wrong { animation:shake .4s; border-color:var(--err); }
@keyframes shake { 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
.cats { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
.cat { border:2px dashed #C9C6DD; border-radius:16px; padding:14px; min-height:140px; background:rgba(255,255,255,.6); }
.cat.over { border-color:var(--accent); background:var(--accent-2); }
.cat h4 { margin:0 0 10px; font-size:18px; } .cat .chip { display:block; margin-top:8px; }
/* binary + quiz */
.q { font-size:22px; font-weight:700; margin:8px 0 18px; }
.opts { display:grid; gap:10px; } .opts.two { grid-template-columns:1fr 1fr; }
.opt { text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:16px 18px; font-size:18px; font-weight:500; cursor:pointer; color:var(--ink); }
.opt:hover:not(:disabled) { border-color:var(--accent); }
.opt.right { background:var(--ok-2); border-color:var(--ok); } .opt.wrongc { background:var(--err-2); border-color:var(--err); }
.opt:disabled { cursor:default; }
.counter { color:var(--muted); font-weight:500; }
/* rapid */
.rcard { text-align:center; padding:34px 22px; font-size:24px; font-weight:700; min-height:150px; display:flex; align-items:center; justify-content:center; }
.timer { height:8px; background:#E4E2EE; border-radius:4px; overflow:hidden; margin:16px 0; } .timer i { display:block; height:100%; background:var(--accent); width:100%; }
.yn { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .yn .btn { font-size:20px; padding:18px; }
.yn .no { background:var(--ink); }
/* errors */
.sb { margin-top:16px; }
.sbl { display:flex; gap:14px; padding:16px; border:1.5px solid var(--line); border-radius:14px; margin-bottom:10px; background:#fff; cursor:pointer; align-items:flex-start; }
.sbl b { width:110px; flex:none; } .sbl.found { border-color:var(--err); background:var(--err-2); cursor:default; } .sbl.okline { border-color:var(--ok); background:var(--ok-2); }
.sbl .exp { display:block; margin-top:8px; font-weight:500; font-size:15px; }
.own label { font-weight:700; display:block; margin:16px 0 6px; } .own small { color:var(--muted); font-weight:500; }
.row { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
/* summary */
.ml li { margin:10px 0; font-size:18px; font-weight:500; }
.score { font-size:46px; font-weight:700; color:var(--accent); }
.small { font-size:14px; margin-top:10px; }
.dash { padding:8px 14px; font-size:14px; border-radius:12px; }
.btn.warn { background:var(--err); color:#fff; border-color:var(--err); }
.copybox { position:fixed; left:16px; right:16px; bottom:90px; height:120px; z-index:40; font:inherit; font-size:14px; padding:10px; border:2px solid var(--accent); border-radius:12px; background:#fff; color:var(--ink); }
.nl { margin-top:18px; }
.nlform { display:grid; gap:12px; max-width:560px; margin-top:6px; }
.nlform label[for] { font-weight:700; }
.nlform input[type=email] { width:100%; font:inherit; font-size:17px; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); }
.nlform input:focus-visible, .btn:focus-visible, .opt:focus-visible { outline:3px solid rgba(123,63,228,.45); outline-offset:2px; }
.consent { display:flex; gap:12px; align-items:flex-start; font-size:15px; line-height:1.45; color:var(--ink); cursor:pointer; }
.consent input { width:22px; height:22px; flex:none; margin-top:1px; accent-color:var(--accent); }
.nlform .btn { justify-self:start; }
#dash { display:grid; gap:18px; }
#dash h3 { margin:0 0 12px; font-size:20px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:12px; margin-top:16px; }
.stats div { background:var(--bg); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; }
.stats b { font-size:32px; font-variant-numeric:tabular-nums; } .stats span { color:var(--muted); font-size:14px; }
.tbl { overflow-x:auto; }
.tbl table { width:100%; border-collapse:collapse; font-size:15px; min-width:640px; }

<script>
const CAP = { db: null, user: null, dl: null, uid: null, owner: false };
const DATA = {"title": "Automationen bauen lassen", "subtitle": "Modul 1 · Teil 2 von 3 · ca. 60 Minuten", "intro": "Heute läuft deine erste Automation. Du verbindest Claude Code über MCP mit unserer Kurs-Instanz von n8n, lässt dir einen Workflow bauen, testest ihn, verbindest dein Postfach und baust danach deinen eigenen Prozess aus Teil 1. Zu jedem Schritt gibt es ein kurzes Video und eine Anleitung mit Bildern zum Nachklicken.", "promise": [["Deine erste Automation läuft", "Ein Ideen-Briefkasten, der jeden Vorschlag speichert und dir Bescheid gibt."], ["Ohne eine Zeile Code", "Du beschreibst, Claude baut. Du prüfst und gibst frei."], ["Dein eigener Prozess", "Aus deinem Steckbrief wird eine echte Automation für deinen Job."]], "levels": [{"id": 1, "title": "Dein Zugang zur Kurs-Instanz", "videos": ["T2INTRO", "W1"], "merksatz": "Workflows, Credentials, Executions, Data tables: mehr Orientierung brauchst du nicht.", "kernpunkte": ["Die Kurs-Instanz ist deine eigene n8n-Umgebung für den Kurs, nichts kaufen, nichts installieren.", "Den Login bekommst du per Einladungsmail, nachdem du den Zugang angefordert hast.", "Workflows = Automationen, Credentials = Zugangsdaten, Executions = Protokoll, Data tables = Tabellen."], "assist": "Kommst du nicht rein oder kam keine Einladung? Frag den Assistenten unten rechts.", "type": "guide", "intro": "Fordere deinen Zugang an, nimm die Einladung an und schau dich einmal in n8n um.", "steps": [{"t": "Zugang anfordern", "d": "Trag hier deinen Namen und deine E-Mail-Adresse ein. Die Kursleitung schickt dir dann die Einladung zur Kurs-Instanz.", "widget": "zugang"}, {"t": "Einladung annehmen", "d": "Du bekommst eine Mail von n8n. Klick auf den Link, trag Vorname, Nachname und ein sicheres Passwort ein (mind. 8 Zeichen, eine Zahl, ein Großbuchstabe) und klick auf <b>Finish account setup</b>.", "img": "05_invite_signup.jpg"}, {"t": "Willkommen in n8n", "d": "So sieht deine Kurs-Instanz beim ersten Login aus. Links findest du die Leiste: oben <b>+</b> zum Anlegen, das Haus für die Übersicht, ganz unten das Zahnrad für die Einstellungen.", "img": "07_member_home.jpg"}, {"t": "Die vier Reiter", "d": "In der Übersicht findest du: <b>Workflows</b> (deine Automationen), <b>Credentials</b> (Zugangsdaten), <b>Executions</b> (Protokoll aller Durchläufe) und <b>Data tables</b> (einfache Tabellen). So sieht die Liste aus, sobald du Workflows hast.", "img": "08_workflows_list.jpg"}], "checks": ["Ich bin in der Kurs-Instanz eingeloggt."]}, {"id": 2, "title": "Claude Code einrichten", "videos": ["W2"], "merksatz": "Terminal öffnen, installieren, claude tippen, anmelden.", "kernpunkte": ["Claude Code ist im Claude-Pro-Abo enthalten, das kostenlose Konto reicht nicht.", "Installieren mit einem Befehl, prüfen mit claude --version.", "Beim ersten Start meldest du dich im Browser mit deinem Claude-Konto an."], "assist": "Fehlermeldung im Terminal? Mach einen Screenshot und schick ihn dem Assistenten.", "type": "guide", "intro": "Installiere Claude Code auf deinem Rechner und melde dich an. Rechne mit 10 Minuten.", "steps": [{"t": "Claude-Abo prüfen", "d": "Du brauchst Claude Pro, Max, Team oder Enterprise. Mit dem kostenlosen Konto geht Claude Code nicht. Aktuelle Preise: <a href='https://claude.com/pricing' target='_blank' rel='noopener'>claude.com/pricing</a>."}, {"t": "Terminal öffnen", "tabs": [{"label": "Mac", "d": "Drück <b>Cmd + Leertaste</b>, tippe <b>Terminal</b> und drück Enter."}, {"label": "Windows", "d": "Klick auf <b>Start</b>, tippe <b>PowerShell</b> und öffne <b>Windows PowerShell</b>. Die Zeile beginnt dann mit <code>PS C:\\</code>. Adminrechte brauchst du nicht."}]}, {"t": "Claude Code installieren", "d": "Kopiere den Befehl für dein System, füge ihn ins Terminal ein und drück Enter. Die Installation zeigt keinen Fortschritt, warte kurz.", "tabs": [{"label": "Mac / Linux", "code": "curl -fsSL https://claude.ai/install.sh | bash"}, {"label": "Windows PowerShell", "code": "irm https://claude.ai/install.ps1 | iex"}]}, {"t": "Installation prüfen", "d": "Öffne ein <b>neues</b> Terminalfenster und tippe:", "code": "claude --version", "term": ["2.1.296 (Claude Code)"], "note": "Erscheint „command not found“ bzw. „nicht erkannt“? Fenster schließen, neu öffnen und nochmal versuchen. Hilft das nicht, frag den Assistenten."}, {"t": "Ordner anlegen und starten", "d": "Leg einen Arbeitsordner an und starte Claude darin:", "tabs": [{"label": "Mac / Linux", "code": "mkdir ~/Automationen && cd ~/Automationen && claude"}, {"label": "Windows PowerShell", "code": "mkdir $HOME\\Automationen; cd $HOME\\Automationen; claude"}]}, {"t": "Anmelden", "d": "Beim ersten Start fragt Claude nach dem Farbschema und der Anmeldung. Wähle die Anmeldung mit deinem <b>Claude-Konto (Abo)</b>. Dein Browser öffnet sich: einloggen, <b>Autorisieren</b> klicken, zurück ins Terminal. Bestätige, dass du dem Ordner vertraust. Fertig, Claude begrüßt dich."}, {"t": "Alternative: ChatGPT / Codex", "d": "Arbeitest du lieber mit einem ChatGPT-Abo? Dann installiere Codex und melde dich mit deinem ChatGPT-Konto an. Dafür brauchst du Node.js (nodejs.org, Version „LTS“). Die n8n-Verbindung legst du später mit den beiden Befehlen unten an, statt mit claude mcp add. Der Rest des Kurses funktioniert genauso.", "code": "npm install -g @openai/codex\ncodex mcp add n8n --url https://momentumki.app.n8n.cloud/mcp-server/http\ncodex mcp login n8n", "optional": true}], "checks": ["claude --version zeigt eine Versionsnummer.", "Ich bin in Claude Code angemeldet."]}, {"id": 3, "title": "n8n mit Claude verbinden (MCP)", "videos": ["W3"], "merksatz": "Connect, Befehl kopieren, einfügen, /mcp, Allow access.", "kernpunkte": ["MCP ist in der Kurs-Instanz schon eingeschaltet, du steckst nur noch den Stecker ein.", "Den Befehl kopierst du aus n8n: Einstellungen → Instance-level MCP → Connect → Claude Code.", "Anmelden mit /mcp in Claude Code, dann im Browser Allow access."], "type": "guide", "intro": "Verbinde Claude Code mit deiner Kurs-Instanz. Danach kann Claude dort Workflows bauen.", "steps": [{"t": "MCP-Einstellungen öffnen", "d": "In n8n links unten auf das <b>Zahnrad</b> → <b>Instance-level MCP</b>. Der Status steht schon auf <b>Enabled</b>. Klick rechts auf <b>Connect</b>.", "img": "16_member_mcp.jpg"}, {"t": "Claude Code auswählen", "d": "Lass oben <b>OAuth (recommended)</b> ausgewählt. Wähle bei <b>Your client</b> den Eintrag <b>Claude Code</b>. Kopiere den Befehl unter „Add n8n to Claude Code“ mit dem Kopiersymbol.", "img": "14_claude_code_oauth.jpg"}, {"t": "Befehl im Terminal ausführen", "d": "Wichtig: in einem <b>normalen Terminalfenster</b>, nicht in einer laufenden Claude-Sitzung. Wenn Claude läuft, beende es mit <code>/exit</code>. Der Befehl sieht so aus:", "code": "claude mcp add --transport http n8n https://momentumki.app.n8n.cloud/mcp-server/http", "term": ["Added HTTP MCP server n8n with URL: https://momentumki.app.n8n.cloud/mcp-server/http to local config"]}, {"t": "Anmelden mit /mcp", "d": "Starte Claude (<code>claude</code>) und tippe <code>/mcp</code>. Wähle <b>n8n</b> und dann <b>Authenticate</b>. Dein Browser öffnet sich.", "code": "/mcp"}, {"t": "Zugriff erlauben", "d": "n8n fragt: „Claude Code wants access to your n8n instance“. Lass <b>All</b> ausgewählt, setz den Haken bei <b>I recognize and trust this URL</b> und klick auf <b>Allow access</b>. Zurück im Terminal steht bei n8n jetzt <b>connected</b>.", "img": "18_oauth_consent_ready.jpg"}, {"t": "Verbindung testen", "d": "Frag Claude:", "code": "Welche Workflows siehst du in n8n?", "term": ["● n8n - search_workflows (MCP)", "  Ich sehe aktuell noch keine Workflows in deiner n8n-Instanz.", "  Sollen wir den ersten zusammen bauen?"], "note": "Antwortet Claude so oder ähnlich, steht die Verbindung. Zugriff entziehen kannst du jederzeit unter Instance-level MCP → Connected clients."}], "checks": ["/mcp zeigt n8n als connected.", "Claude hat meine Testfrage beantwortet."]}, {"id": 4, "title": "Deine erste Automation", "videos": ["W4"], "merksatz": "Beschreiben, bauen lassen, prüfen, veröffentlichen, testen.", "kernpunkte": ["Du gibst Claude einen klaren Auftrag, Claude baut Tabelle und Workflow über MCP.", "Erst nach Publish ist der Workflow live.", "Executions und Data tables zeigen dir, dass es wirklich funktioniert."], "type": "guide", "intro": "Lass Claude die Übung bauen: ein Ideen-Briefkasten, Formular → Tabelle. Das Formular fragt bewusst keinen Namen ab. Was du nicht speicherst, musst du nicht schützen.", "steps": [{"t": "Auftrag an Claude geben", "d": "Kopiere den Auftrag und füge ihn in Claude Code ein:", "prompt": "Du arbeitest in meiner n8n-Instanz über MCP.\n\nBaue mir bitte diese Übung, einen Ideen-Briefkasten:\n1. Erstelle eine Datentabelle „Ideen“ mit den Spalten idee (Text), bereich (Text) und minuten_pro_woche (Zahl).\n2. Erstelle einen Workflow „Ideen-Briefkasten“:\n   - Auslöser: ein n8n-Formular „Ideen-Briefkasten“ mit den Feldern „Deine Idee“ (Pflicht, mehrzeilig), „Bereich“ (Pflicht, Auswahl: Vertrieb, Verwaltung, Einkauf, Produktion, IT, Sonstiges) und „Zeitersparnis pro Woche (Minuten)“ (Zahl).\n   - Das Formular fragt bewusst keinen Namen und keine E-Mail-Adresse ab.\n   - Danach: jede Idee als neue Zeile in die Tabelle „Ideen“ schreiben.\n   - Nach dem Absenden soll das Formular „Danke für deine Idee!“ anzeigen.\n3. Prüfe den Workflow, bevor du fertig bist, und sag mir, wie ich ihn teste.\nLege keine Zugangsdaten an. Veröffentlichen mache ich selbst."}, {"t": "Claude bei der Arbeit zusehen", "d": "Claude nutzt jetzt die Werkzeuge von n8n. Fragt Claude um Erlaubnis, lies kurz und bestätige mit Enter. So ähnlich sieht das aus:", "term": ["● n8n - search_nodes (MCP)  form trigger, data table", "● n8n - create_data_table (MCP)  Ideen", "● n8n - create_workflow_from_code (MCP)  Ideen-Briefkasten", "● n8n - validate_workflow (MCP)", "  ✓ Workflow ist gültig. Zum Testen: veröffentlichen und das Formular öffnen."]}, {"t": "Workflow ansehen", "d": "In n8n const LS_KEY = "m12-automationen-v1";

function fresh() { return { step: 0, xp: 0, done: {}, task: {}, name: "", own: ["", "", "", "", ""], check: null, maxStep: 0 }; }
function load() { try { const v = localStorage.getItem(LS_KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function save() { try { S.prozent = Math.round((S.maxStep || 0) / (STEPS.length - 1) * 100); S.titel = DATA.title; } catch (e) {} try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} if (typeof syncLater === "function") syncLater(); }
const $ = (s, r) => (r || document).querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800); }
function addXP(n, msg) { S.xp += n; $("#xp").textContent = S.xp + " XP"; save(); if (n > 0) toast("+" + n + " XP" + (msg ? " · " + msg : "")); }
function shuffle(a, seed) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// steps
const STEPS = [{ k: "start" }];
DATA.levels.forEach(L => { L.videos.forEach(v => STEPS.push({ k: "video", lv: L.id, v })); STEPS.push({ k: "task", lv: L.id }); });
STEPS.push({ k: "check" }); STEPS.push({ k: "video", lv: NLV + 1, v: "T2END" }); STEPS.push({ k: "summary" });
const LV = id => DATA.levels.find(l => l.id === id);
const taskDone = lv => !!S.done[lv];

function badges() {
  const b = $("#badges"); b.innerHTML = "";
  const cur = STEPS[S.step].lv;
  DATA.levels.forEach(L => {
    const d = el("div", "bdg" + (S.done[L.id] ? " done" : "") + (cur === L.id ? " cur" : ""), S.done[L.id] ? "✓" : L.id);
    d.title = "Level " + L.id + ": " + L.title;
    if (S.done[L.id]) d.onclick = () => go(STEPS.findIndex(s => s.lv === L.id));
    b.appendChild(d);
  });
  const c = el("div", "bdg" + (S.check && S.check.passed ? " done" : "") + (STEPS[S.step].k === "check" ? " cur" : ""), "✓"); c.title = "Abschluss-Check"; b.appendChild(c);
}

// Kurscode: für alle gleich, ohne richtigen Code geht es nicht weiter
function kurscodeOk(v) { const t = String(v || "").toUpperCase().replace(/\s+/g, ""); let x = 5381; for (const c of t) x = (Math.imul(x, 33) ^ c.charCodeAt(0)) >>> 0; return x === 3219844137; }
function go(i) {
  if (i > 0 && !kurscodeOk(S.kurscode)) { S.step = 0; toast("Bitte zuerst deinen Namen, den richtigen Kurscode und deine E-Mail eintragen."); if (STEPS[S.step]) render(); return; }
  document.querySelectorAll("video").forEach(v => { try { v.pause(); } catch (e) {} });

}

  const sc = el("section", "screen active"); sc.id = "s-" + st.k; m.appendChild(sc);

}

function renderCheck(sc) {
  const c = el("div", "card"); sc.appendChild(c);
  c.innerHTML = '<div class="kicker">Abschluss-Check</div><h2>' + DATA.check.length + ' Fragen zum Modul</h2><p class="muted">Bestanden ab ' + DATA.pass + ' von ' + DATA.check.length + '. Du kannst den Check so oft wiederholen, wie du willst.</p>';
  const box = el("div"); c.appendChild(box);
  let Q, i, score, wrong;
  function start() { Q = shuffle(DATA.check).map(q => ({ ...q, opts: shuffle([q.a, ...q.d]) })); i = 0; score = 0; wrong = []; ask(); }
  function ask() {
    if (i >= Q.length) return done();
    const q = Q[i]; box.innerHTML = '<div class="counter">Frage ' + (i + 1) + ' von ' + Q.length + '</div><div class="q">' + esc(q.q) + '</div>';
    const o = el("div", "opts"); box.appendChild(o); const fb = el("div"); box.appendChild(fb);
    q.opts.forEach(t => { const b = el("button", "opt", esc(t)); o.appendChild(b);
      b.onclick = () => { o.querySelectorAll("button").forEach(x => { x.disabled = true; if (x.textContent === q.a) x.classList.add("right"); });
        const ok = t === q.a; if (ok) score++; else { b.classList.add("wrongc"); wrong.push(q); }
        fb.innerHTML = '<div class="fb ' + (ok ? "ok" : "bad") + '">' + (ok ? "Richtig." : "Richtig wäre: " + esc(q.a) + " – schau dir noch einmal Level " + q.lv + " an.") + '</div>';
        const nx = el("button", "btn", i + 1 < Q.length ? "Nächste Frage" : "Auswertung"); nx.style.marginTop = "12px"; nx.onclick = () => { i++; ask(); }; fb.appendChild(nx); }; });
  }
  function done() {
    const passed = score >= DATA.pass; const first = !S.check;
    if (!S.check || score > S.check.best) { const gain = (score - (S.check ? S.check.best : 0)) * 10; if (gain > 0) addXP(gain, "Check"); }
    S.check = { best: Math.max(score, S.check ? S.check.best : 0), passed: passed || (S.check && S.check.passed) }; S.checkTries = (S.checkTries || 0) + 1; S.checkWrong = wrong.map(q => q.q); save(); badges();
    const lv = [...new Set(wrong.map(q => q.lv))].sort();
    box.innerHTML = '<div class="score">' + score + ' / ' + Q.length + '</div><div class="fb ' + (passed ? "ok" : "bad") + '">' + (passed ? "Bestanden! " + (S.name ? esc(S.name) + ", d" : "D") + "u hast die Grundlagen sicher drauf." : "Noch nicht bestanden – du brauchst " + DATA.pass + " richtige Antworten.") +
      (lv.length ? "<br>Wiederholen lohnt sich bei: " + lv.map(l => "Level " + l + " (" + esc(LV(l).title) + ")").join(", ") : "") + '</div>';
    const r = el("button", "btn sec", "Check wiederholen"); r.style.marginTop = "12px"; r.onclick = start; box.appendChild(r);
    setNext(!!S.check.passed, "Weiter", !!S.check.passed);
  }
  if (S.check && S.check.passed) { box.innerHTML = '<div class="fb ok">Du hast den Check bereits bestanden (beste Wertung: ' + S.check.best + ' / ' + DATA.check.length + ').</div>'; const r = el("button", "btn sec", "Nochmal machen"); r.style.marginTop = "12px"; r.onclick = start; box.appendChild(r); setNext(true, "Weiter"); }

}

function teilnehmerId() {
  let id = null;

  if (!id) {
    const r = new Uint8Array(12); crypto.getRandomValues(r);
    id = "t_" + Array.from(r, b => b.toString(16).padStart(2, "0")).join("");

  const st = STEPS[i] || {}; if (st.k === "start") return "Start"; if (st.k === "check") return "Abschluss-Check"; if (st.k === "summary") return "Abschluss";
  if (st.k === "video") return st.lv > NLV ? "Abschlussvideo" : "Level " + st.lv + " · Video"; if (st.k === "task") return "Level " + st.lv + " · Aufgabe"; return String(i);
}
if (!S.started) { S.started = new Date().toISOString(); try { save(); } catch (e) {} }
window.__chatMeta = window.__chatMeta || {};
setTimeout(() => { try { updMeta(); } catch (e) {} }, 0);
function updMeta() { const m = window.__chatMeta; m.teilnehmer_id = teilnehmerId(); m.name = S.name || ""; m.kurs = KURS; m.schritt = schrittName(S.step || 0); }
function payload(extra) {
  return Object.assign({
    kurscode: S.kurscode || "", teilnehmer_id: teilnehmerId(), name: S.name || "", kurs: KURS,
    level_fertig: Object.keys(S.done).length, level_gesamt: NLV, check_gesamt: DATA.check.length, fortschritt_prozent: Math.round((S.maxStep || 0) / (STEPS.length - 1) * 100),
    xp: S.xp, check_best: S.check ? S.check.best : null, check_bestanden: !!(S.check && S.check.passed), steckbrief: S.own2 || S.own,
    email: S.email || "", gestartet: S.started || "", aktueller_schritt: schrittName(S.maxStep || 0),
    levels_liste: Object.keys(S.done).sort((x, y) => x - y).join(","), check_versuche: S.checkTries || 0, check_fehler: (S.checkWrong || []).join(" | ")
  }, extra || {});
}
function post(body) {
  return fetch(WEBHOOK, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), keepalive: true });
}
let syncTimer = null, lastSent = "";
function syncLater() {
  try { updMeta(); } catch (e) {}
  if (!S.name || !S.kurscode) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { const b = payload(); const k = JSON.stringify(b); if (k === lastSent) return; lastSent = k; post(b).catch(() => { lastSent = ""; }); }, 1500);
}
window.addEventListener("pagehide", () => { if (syncTimer) { clearTimeout(syncTimer); const b = payload(); if (JSON.stringify(b) !== lastSent && S.name && S.kurscode) post(b).catch(() => {}); } });

// ---------- Video lädt nicht: Hinweis mit direktem Link ----------
document.addEventListener("error", (ev) => {
  let v = ev.target;
  if (v && v.tagName === "SOURCE") { if (v.nextElementSibling) return; v = v.parentElement; }
  if (!v || v.tagName !== "VIDEO" || v.dataset.errShown) return;
  v.dataset.errShown = "1";
  const box = el("div", "fb bad", "Das Video lädt hier gerade nicht. <a href=\"" + (v.querySelector("source") || v).getAttribute("src") + "\" target=\"_blank\" rel=\"noopener\">Video direkt öffnen</a> oder die Seite mit Chrome, Edge oder Safari neu laden.");
  v.closest(".vidwrap").after(box);
}, true);

function tGuide(c, L, T, finish) {
  T.checks = T.checks || {};

  L.steps.forEach((s, i) => {
    const li = el("li", "gstep" + (s.optional ? " opt" : ""));
    li.appendChild(el("h3", "", esc(s.t) + (s.optional ? ' <span class="tag">optional</span>' : "")));
    const body = el("div", "gbody"); li.appendChild(body);
    if (s.tabs) {
      if (s.d) body.appendChild(el("p", "", s.d));
      const bar = el("div", "gtabs"); const pane = el("div", "gpane"); body.append(bar, pane);
      const pick = k => { bar.querySelectorAll("button").forEach((b, j) => b.classList.toggle("on", j === k)); pane.innerHTML = ""; stepBody(Object.assign({}, s.tabs[k], { t: "" }), pane); try { localStorage.setItem("m12-tab-" + L.id + "-" + i, k); } catch (e) {} };
      s.tabs.forEach((t, k) => { const b = el("button", "", esc(t.label)); b.type = "button"; b.onclick = () => pick(k); bar.appendChild(b); });
      let k0 = 0; try { k0 = +(localStorage.getItem("m12-tab-" + L.id + "-" + i) || (navigator.platform.indexOf("Win") > -1 && s.tabs.length > 1 && /Windows/.test(s.tabs[1].label) ? 1 : 0)); } catch (e) {}
      pick(Math.min(k0, s.tabs.length - 1));
    } else stepBody(s, body);
    if (s.widget === "zugang") body.appendChild(widgetZugang());
    if (s.widget === "angebot") body.appendChild(widgetAngebot());
    if (s.widget === "prompt") body.appendChild(widgetPrompt());
    list.appendChild(li);
  });
  const ck = el("div", "gchecks"); ck.appendChild(el("h3", "", "Hat alles geklappt?")); c.appendChild(ck);
  const update = () => { const all = L.checks.every((_, k) => T.checks[k]); if (all) finish(); };
  L.checks.forEach((t, k) => {
    const lab = el("label", "gcheck"); const cb = el("input"); cb.type = "checkbox"; cb.checked = !!T.checks[k];
    cb.onchange = () => { T.checks[k] = cb.checked; save(); update(); };

  });

    b.disabled = true; b.textContent = "Wird gesendet …";
    try { await sendAnfrage({ typ: "zugang", name: name.value.trim(), email: mail.value.trim(), firma: firma.value.trim() });
      S.email = mail.value.trim(); S.firma = firma.value.trim(); S.zugangAngefordert = S.email; save();
      box.innerHTML = '<div class="fb ok">Danke! Deine Anfrage ist bei der Kursleitung. Die Einladung kommt per Mail von n8n, meist innerhalb eines Werktags.</div>';
    } catch (e) { msg.innerHTML = '<div class="fb bad">Das hat nicht geklappt. Prüf deine Verbindung und versuch es nochmal.</div>'; b.disabled = false; b.textContent = "Zugang anfordern"; }
  };
  box.append(w1, w2, w3, cons, b, msg); return box;
}

function widgetAngebot() {
  const box = el("div", "gwidget");
  if (S.angebotGesendet) { box.innerHTML = '<div class="fb ok">Deine Angebotsanfrage ist angekommen. Wir melden uns persönlich bei dir.</div>'; return box; }
  box.appendChild(el("h3", "", "Persönliches Angebot: eigener Server"));
  const [a, firma] = field("Firma", "text", S.firma, "", true);
  const [b1, name] = field("Ansprechpartner", "text", S.name, "", true);
  const [c1, mail] = field("E-Mail", "email", S.email, "name@firma.de", true);
  const [d1, tel] = field("Telefon", "tel", "", "", false);
  const [e1, groesse] = choice("Wie viele Mitarbeitende hat euer Unternehmen?", ["1–9", "10–49", "50–249", "250+"]);
  const [f1, server] = choice("Wie ist der aktuelle Stand beim Server?", ["Wir haben einen Server, der passt", "Server vorhanden, unklar ob er passt", "Wir möchten einen Server mieten", "Weiß ich nicht"]);
  const [g1, ki] = choice("Soll auch ein KI-Modell lokal laufen (Ollama, Datenschutz)?", ["Ja", "Vielleicht", "Nein"]);
  const [h1, betreuung] = choice("Wer soll den Server danach betreuen?", ["Unsere IT", "Ihr als Dienstleister", "Noch offen"]);
  const [i1, zeit] = choice("Wann soll es losgehen?", ["Sofort", "In 1–3 Monaten", "Später"]);
  const [j1, nachricht] = field("Was ist euch sonst noch wichtig?", "textarea", "", "z. B. bestimmte Programme, Datenschutzvorgaben, Budget", false);
  const cons = el("label", "consent"); const cb = el("input"); cb.type = "checkbox"; cons.append(cb, el("span", "", "Ja, kontaktiert mich zu diesem Angebot. Meine Angaben werden nur dafür genutzt. Mehr in der " + "<a href=\"https://momentum-ki-akademie.de/datenschutz\" target=\"_blank\" rel=\"noopener\">Datenschutzerklärung</a>" + "."));
  const msg = el("div"); const btn = el("button", "btn", "Angebot anfragen");
  btn.onclick = async () => {
    if (!firma.value.trim() || !name.value.trim() || !mailOk(mail.value.trim())) return msg.innerHTML = '<div class="fb bad">Bitte Firma, Ansprechpartner und eine gültige E-Mail angeben.</div>';
    if (!server()) return msg.innerHTML = '<div class="fb bad">Bitte wähle den aktuellen Stand beim Server.</div>';
    if (!cb.checked) return msg.innerHTML = '<div class="fb bad">Bitte setz den Haken, damit wir dich kontaktieren dürfen.</div>';
    btn.disabled = true; btn.textContent = "Wird gesendet …";
    try { await sendAnfrage({ typ: "angebot", firma: firma.value.trim(), name: name.value.trim(), email: mail.value.trim(), telefon: tel.value.trim(), mitarbeitende: groesse(), server: server(), lokale_ki: ki(), betreuung: betreuung(), zeitrahmen: zeit(), nachricht: nachricht.value.trim() });
      S.angebotGesendet = true; S.firma = firma.value.trim(); S.email = mail.value.trim(); save();
      box.innerHTML = '<div class="fb ok">Danke! Deine Anfrage ist angekommen. Wir melden uns persönlich mit einem passenden Angebot.</div>';
    } catch (e) { msg.innerHTML = '<div class="fb bad">Das hat nicht geklappt. Bitte versuch es nochmal.</div>'; btn.disabled = false; btn.textContent = "Angebot anfragen"; }
  };
  box.append(a, b1, c1, d1, e1, f1, g1, h1, i1, j1, cons, btn, msg); return box;
}

function widgetPrompt() {
  const box = el("div", "gwidget");
  let own = S.own2;
  if (!own) { own = ["", "", "", "", ""]; try { const t1 = JSON.parse(localStorage.getItem("m11-automationen-v2") || "null"); if (t1 && t1.own && t1.own.some(x => x)) { own = t1.own.slice(0, 5); box.appendChild(el("div", "fb ok", "Dein Steckbrief aus Teil 1 ist eingetragen.")); } } catch (e) {} S.own2 = own; }
  const names = ["Auslöser", "Schritte", "Tools", "Ergebnis", "Fehlerfall"];
  const ph = ["z. B. Jemand schickt das Kontaktformular auf unserer Website ab", "z. B. 1. Kontakt im CRM anlegen 2. Bestätigungs-Mail senden 3. Vertrieb informieren", "z. B. Formular, CRM, Outlook, Teams", "z. B. Kontakt steht im CRM, Kundin hat eine Mail", "z. B. Wenn die Mail nicht rausgeht, bekommt das Team eine Nachricht"];
  const out = el("div");
  const build = () => "Ich möchte folgenden Prozess in meiner n8n-Instanz automatisieren (über MCP).\n\n" +
    names.map((n, k) => n + ": " + (own[k] || "…")).join("\n") +
    "\n\nBitte:\n1. Stell mir zuerst Fragen, wenn etwas unklar ist.\n2. Zeig mir deinen Plan (Bausteine und welche Zugangsdaten nötig sind), bevor du baust.\n3. Lege keine Zugangsdaten an. Sag mir, welche ich selbst anlegen muss.\n4. Baue den Workflow, prüfe ihn und erkläre mir, wie ich ihn mit Testdaten teste.\nVeröffentlichen mache ich selbst.";
  const refresh = () => { out.innerHTML = ""; out.appendChild(codeBox(build(), "Dein Auftrag an Claude")); };
  names.forEach((n, k) => { const [w, i] = field(n, "textarea", own[k], ph[k], true); i.rows = 2; i.oninput = () => { own[k] = i.value; S.own2 = own; save(); refresh(); }; box.appendChild(w); });
  box.appendChild(out); refresh(); return box;
}

// ---------- Teil 2: Anpassungen ----------
function merkText() {
  return [DATA.title, "", "Die " + NLV + " Merksätze:", ...DATA.levels.map((L, i) => (i + 1) + ". " + L.merksatz), "",
    "Deine Aufträge an Claude:", "", ...DATA.prompts.map(p => p[0] + ":\n" + p[1].replace("MEINE-ADRESSE", S.email || "deine.adresse@beispiel.de") + "\n"),
    "XP: " + S.xp + (S.check ? " · Abschluss-Check: " + S.check.best + " / " + DATA.check.length : "")].join("\n");
}
function renderSummary(sc) {
  const hero = el("div", "hero brand noprint"); hero.style.backgroundImage = "url(" + MEDIA.LOGO_FULL + ")"; sc.appendChild(hero);
  const c = el("div", "card"); sc.appendChild(c);
  c.innerHTML = '<div class="kicker">Merkblatt</div><h1>' + (S.name ? esc(S.name) + ", du" : "Du") + ' hast Teil 2 geschafft</h1>' +
    '<p class="muted">' + esc(DATA.title) + ' · ' + S.xp + ' XP' + (S.check ? ' · Abschluss-Check: ' + S.check.best + ' / ' + DATA.check.length : '') + '</p>' +
    '<h2 style="margin-top:20px">Die ' + NLV + ' Merksätze</h2><ol class="ml">' + DATA.levels.map(L => '<li>' + esc(L.merksatz) + '</li>').join("") + '</ol>' +
    '<h2 style="margin-top:20px">Deine Aufträge an Claude</h2>';
  DATA.prompts.forEach(p => c.appendChild(codeBox(p[1].replace("MEINE-ADRESSE", S.email || "deine.adresse@beispiel.de"), p[0])));
  const row = el("div", "row noprint"); const p = el("button", "btn", "Merkblatt kopieren"); p.onclick = () => copyText(merkText());
  const dl = el("button", "btn sec", "Merkblatt speichern"); dl.onclick = () => saveFile("Merkblatt_Teil2.txt", merkText());
  const rs = el("button", "btn sec", "Fortschritt zurücksetzen"); confirmBtn(rs, () => { S = fresh(); save(); go(0); });
  row.append(p, dl, rs); c.appendChild(row);
  newsletterBox(sc);
  setNext(false, "Ende");
}

$("#next").onclick = () => go(S.step + 1);
$("#back").onclick = () => go(S.step - 1);
if (S.step > 0 && !kurscodeOk(S.kurscode)) S.step = 0;
render();
</script>
