:root { color-scheme:light; --hdr:rgba(246,246,251,.94); --bg:#F6F6FB; --card:#FFFFFF; --ink:#14123A; --muted:#62607E; --line:#DFDDEC; --accent:#7B3FE4; --accent-2:#F1EAFD; --teal:#1FA9B0; --grad:linear-gradient(90deg,#9B4DF0,#5B6EE6 55%,#22B3B0); --ok:#1F9D55; --ok-2:#EAF6EF; --err:#D93025; --err-2:#FDECEA; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Space Grotesk", system-ui, sans-serif; }
button { font-family:inherit; }
header { position:sticky; top:env(safe-area-inset-top, 0px); z-index:10; background:rgba(246,246,251,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.hbar { max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:16px; padding:12px 16px; }
.hlogo { height:26px; width:auto; flex:0 0 auto; }
.htitle { font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badges { display:flex; gap:6px; margin-left:auto; }
.bdg { width:30px; height:30px; border-radius:50%; border:2px solid var(--line); background:#fff; font-weight:700; font-size:13px; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:default; }
.bdg.cur { border-color:var(--accent); color:var(--accent); }
.bdg.done { background:var(--ok); border-color:var(--ok); color:#fff; cursor:pointer; }
.xp { font-weight:700; background:var(--ink); color:#fff; border-radius:16px; padding:6px 12px; font-size:14px; white-space:nowrap; }
.hlinks { max-width:1100px; margin:0 auto; display:flex; gap:8px; padding:0 16px 10px; flex-wrap:wrap; }
.hlinks a { font-size:13.5px; font-weight:700; color:var(--ink); text-decoration:none; border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:5px 12px; white-space:nowrap; }
.hlinks a:hover { border-color:var(--accent); color:var(--accent); }
.hlinks a.n8n { background:#EA4B71; border-color:#EA4B71; color:#fff; }
.prog { height:4px; background:#E4E2EE; } .prog i { display:block; height:100%; width:0; background:var(--grad); transition:width .4s; }
main { max-width:1100px; margin:0 auto; padding:24px 16px 120px; }
.screen { display:none; } .screen.active { display:block; animation:fade .35s ease; }
@keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.card { background:var(--card); border-radius:20px; box-shadow:0 18px 50px rgba(20,18,58,.08), 0 1px 3px rgba(20,18,58,.06); padding:28px; }
h1 { font-size:clamp(30px, 5vw, 52px); letter-spacing:-1px; margin:0 0 8px; line-height:1.05; }
h2 { font-size:clamp(24px, 3.4vw, 34px); margin:0 0 6px; letter-spacing:-.5px; }
.kicker { color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:13px; margin-bottom:8px; }
.muted { color:var(--muted); }
.hero { border-radius:20px; overflow:hidden; aspect-ratio:16/9; background:#eee center/cover; margin-bottom:22px; }
.hero.brand { aspect-ratio:auto; height:clamp(180px,32vw,320px); background:#fff center/contain no-repeat; background-size:auto 78%; box-shadow:0 1px 0 var(--line); }
.btn { appearance:none; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:17px; padding:14px 24px; border-radius:14px; cursor:pointer; }
.btn:disabled { background:#C9C6DD; cursor:not-allowed; }
.btn.sec { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
.btn.pulse { animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(123,63,228,.45); } 50% { box-shadow:0 0 0 12px rgba(123,63,228,0); } }
.navbar { position:fixed; left:0; right:0; bottom:0; background:rgba(246,246,251,.96); border-top:1px solid var(--line); z-index:10; }
.navin { max-width:1100px; margin:0 auto; padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display:flex; gap:12px; align-items:center; }
.navin .sp { flex:1; color:var(--muted); font-size:14px; }
input[type=text], textarea { width:100%; font:inherit; font-size:17px; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); }
textarea { min-height:70px; resize:vertical; }
.vidwrap { border-radius:18px; overflow:hidden; background:#000; aspect-ratio:16/9; }
.vidwrap video { width:100%; height:100%; display:block; }
.hint { display:inline-flex; gap:8px; align-items:center; background:var(--accent-2); color:#4B1FA0; border-radius:12px; padding:8px 14px; font-weight:500; margin:14px 0 0; }
.merk { border-left:6px solid var(--accent); background:#fff; border-radius:12px; padding:14px 18px; font-weight:700; font-size:19px; margin-top:16px; }
.fb { border-radius:14px; padding:14px 16px; margin-top:12px; font-weight:500; }
.fb.ok { background:var(--ok-2); color:#14532D; } .fb.bad { background:var(--err-2); color:#8A1F17; } .fb.neutral { background:var(--accent-2); color:#4B1FA0; }
.toast { position:fixed; left:50%; top:76px; transform:translateX(-50%) translateY(-20px); opacity:0; background:var(--ink); color:#fff; padding:10px 18px; border-radius:14px; font-weight:700; z-index:30; transition:all .3s; pointer-events:none; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
/* sliders */
.sl { margin:22px 0; } .sl label { font-weight:700; font-size:19px; display:block; margin-bottom:12px; }
.sl input[type=range] { width:100%; accent-color:var(--accent); height:28px; }
.sl .ends { display:flex; justify-content:space-between; color:var(--muted); font-size:14px; } .sl .val { color:var(--accent); font-weight:700; font-size:22px; }
/* flip */
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; margin-top:18px; }
.flip { perspective:1200px; min-height:230px; }
.flip .in { position:relative; width:100%; height:100%; min-height:230px; transition:transform .6s; transform-style:preserve-3d; }
.flip.turned .in { transform:rotateY(180deg); }
.flip .f, .flip .b { position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; padding:22px; display:flex; flex-direction:column; background:#fff; box-shadow:0 10px 30px rgba(20,18,58,.08); }
.flip .b { transform:rotateY(180deg); }
.flip .s { font-size:20px; font-weight:700; flex:1; }
.flip .ch { display:flex; gap:10px; } .flip .ch button { flex:1; }
.flip .verdict { font-weight:700; font-size:22px; margin-bottom:8px; } .flip .b.ok .verdict { color:var(--ok); } .flip .b.bad .verdict { color:var(--err); }
/* dnd */
.pool { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0; min-height:56px; }
.chip { background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; font-weight:500; cursor:grab; user-select:none; font-size:16px; }
.chip.sel { border-color:var(--accent); box-shadow:0 0 0 3px rgba(123,63,228,.25); }
.chip.placed { cursor:default; background:var(--ok-2); border-color:#BFE3CC; }
.chip.wrong { animation:shake .4s; border-color:var(--err); }
@keyframes shake { 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
.cats { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
.cat { border:2px dashed #C9C6DD; border-radius:16px; padding:14px; min-height:140px; background:rgba(255,255,255,.6); }
.cat.over { border-color:var(--accent); background:var(--accent-2); }
.cat h4 { margin:0 0 10px; font-size:18px; } .cat .chip { display:block; margin-top:8px; }
/* binary + quiz */
.q { font-size:22px; font-weight:700; margin:8px 0 18px; }
.opts { display:grid; gap:10px; } .opts.two { grid-template-columns:1fr 1fr; }
.opt { text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:16px 18px; font-size:18px; font-weight:500; cursor:pointer; color:var(--ink); }
.opt:hover:not(:disabled) { border-color:var(--accent); }
.opt.right { background:var(--ok-2); border-color:var(--ok); } .opt.wrongc { background:var(--err-2); border-color:var(--err); }
.opt:disabled { cursor:default; }
.counter { color:var(--muted); font-weight:500; }
/* rapid */
.rcard { text-align:center; padding:34px 22px; font-size:24px; font-weight:700; min-height:150px; display:flex; align-items:center; justify-content:center; }
.timer { height:8px; background:#E4E2EE; border-radius:4px; overflow:hidden; margin:16px 0; } .timer i { display:block; height:100%; background:var(--accent); width:100%; }
.yn { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .yn .btn { font-size:20px; padding:18px; }
.yn .no { background:var(--ink); }
/* errors */
.sb { margin-top:16px; }
.sbl { display:flex; gap:14px; padding:16px; border:1.5px solid var(--line); border-radius:14px; margin-bottom:10px; background:#fff; cursor:pointer; align-items:flex-start; }
.sbl b { width:110px; flex:none; } .sbl.found { border-color:var(--err); background:var(--err-2); cursor:default; } .sbl.okline { border-color:var(--ok); background:var(--ok-2); }
.sbl .exp { display:block; margin-top:8px; font-weight:500; font-size:15px; }
.own label { font-weight:700; display:block; margin:16px 0 6px; } .own small { color:var(--muted); font-weight:500; }
.row { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
/* summary */
.ml li { margin:10px 0; font-size:18px; font-weight:500; }
.score { font-size:46px; font-weight:700; color:var(--accent); }
.small { font-size:14px; margin-top:10px; }
.dash { padding:8px 14px; font-size:14px; border-radius:12px; }
.btn.warn { background:var(--err); color:#fff; border-color:var(--err); }
.copybox { position:fixed; left:16px; right:16px; bottom:90px; height:120px; z-index:40; font:inherit; font-size:14px; padding:10px; border:2px solid var(--accent); border-radius:12px; background:#fff; color:var(--ink); }
.nl { margin-top:18px; }
.nlform { display:grid; gap:12px; max-width:560px; margin-top:6px; }
.nlform label[for] { font-weight:700; }
.nlform input[type=email] { width:100%; font:inherit; font-size:17px; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); }
.nlform input:focus-visible, .btn:focus-visible, .opt:focus-visible { outline:3px solid rgba(123,63,228,.45); outline-offset:2px; }
.consent { display:flex; gap:12px; align-items:flex-start; font-size:15px; line-height:1.45; color:var(--ink); cursor:pointer; }
.consent input { width:22px; height:22px; flex:none; margin-top:1px; accent-color:var(--accent); }
.nlform .btn { justify-self:start; }
#dash { display:grid; gap:18px; }
#dash h3 { margin:0 0 12px; font-size:20px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:12px; margin-top:16px; }
.stats div { background:var(--bg); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; }
.stats b { font-size:32px; font-variant-numeric:tabular-nums; } .stats span { color:var(--muted); font-size:14px; }
.tbl { overflow-x:auto; }
.tbl table { width:100%; border-collapse:collapse; font-size:15px; min-width:640px; }

<script>
const CAP = { db: null, user: null, dl: null, uid: null, owner: false };
const DATA = {"title": "Dein eigener Server", "subtitle": "Modul 1 · Teil 3 von 3 · ca. 45 Minuten, als Pilot mit eigenem Server ca. 90", "intro": "In Teil 2 lief deine erste Automation in unserer Kurs-Instanz, mit Testdaten. Für echte Kundendaten braucht sie ein Zuhause, über das dein Betrieb bestimmt. Heute bekommt dein n8n einen eigenen Server in Deutschland: mieten, einrichten, Workflows umziehen, warten. Du kannst mitbauen (ab etwa 7 Euro im Monat, monatlich kündbar, Stand November 2026; rechne mit 90 Minuten) oder zuschauen (45 Minuten) und am Ende einen fertigen Vorschlag für Chef oder IT in der Hand haben.", "promise": [["Deine Daten bleiben bei dir", "n8n läuft unter der Adresse deiner Firma auf einem Server in Deutschland, den du jederzeit kündigen kannst."], ["Keine Abo-Stufen, keine Überraschung", "Ein kleiner Server kostet ab etwa 7 Euro im Monat (Stand November 2026), die Software selbst kostet nichts."], ["Du weißt, was zu tun ist, wenn etwas klemmt", "Update, Backup, Fehler lesen: drei Handgriffe, die du am Ende kennst."]], "levels": [{"id": 1, "title": "Der Hangar: Warum ein eigener Server?", "videos": ["T3INTRO", "X1"], "merksatz": "Was im Haus bleiben muss, läuft im Haus.", "kernpunkte": ["Bis jetzt lief deine Automation in der Kurs-Instanz: n8n Cloud, von uns gemietet, nur für Testdaten. Für echte Kundendaten entscheidet ihr, wo n8n läuft.", "Ein Server ist ein gemieteter Rechner im Rechenzentrum, der rund um die Uhr läuft. Ihr habt den Schlüssel; der Anbieter stellt Strom, Netz und Hardware.", "Die Ampel aus Teil 1 entscheidet: Grün darf in jede Cloud, Gelb in eine Cloud mit Vertrag (AVV), Rot gehört auf euren eigenen Server oder bleibt ganz im Haus."], "assist": "Unsicher, welche Farbe dein Prozess hat? Beschreib ihn dem Assistenten unten rechts, ohne echte Namen.", "type": "guide", "intro": "Erst verstehen, dann mieten. Lies die fünf Punkte und wähl am Ende deinen Weg.", "steps": [{"t": "Wo laufen eure Automationen heute?", "d": "In der <b>Kurs-Instanz</b>: n8n Cloud, von der Akademie gemietet, nur für Testdaten. Das bleibt so bis Kursende. Danach brauchen deine Workflows ein neues Zuhause: n8n Cloud mit eigenem Abo oder dein eigener Server.", "note": "So machen wir es selbst: Der Lernstand, den du gerade erzeugst, und die Zusammenfassungs-Mails laufen über n8n auf unserem Server in Deutschland. Die Kursseite selbst liefert GitHub aus."}, {"t": "Die Ampel anwenden", "d": "<b>Grün</b> (öffentlich, intern ohne Personenbezug): jede Cloud. <b>Gelb</b> (gewöhnliche Kunden- und Mitarbeiterdaten wie Namen, Adressen, Termine): Cloud nur mit Auftragsverarbeitungsvertrag und EU-Rechenzentrum, oder eigener Server. <b>Rot</b> (Gesundheitsdaten, Gehälter, Verträge, alles mit Schweigepflicht): eigener Server, kein Cloud-KI-Modell ohne Prüfung.", "d2": "Ordne drei Fälle ein, dann weißt du, wie es geht:", "widget": "ampel"}, {"t": "Was ein Server ist, in einem Bild", "d": "Der Hangar. Stell dir deine Automation als Auto vor. In Teil 2 ist es in unserer Werkstatt gefahren. Jetzt bekommt es einen eigenen Hangar bei dir: gemietet, in Deutschland, mit Schloss (Firewall), Adresse (Domain) und Wartungsplan. Du musst ihn nicht bauen, nur mieten und einrichten."}, {"t": "Die Rechnung (Stand November 2026)", "d": "<b>n8n Cloud:</b> Starter 20 € im Monat bei Jahreszahlung, 2.500 Ausführungen; Pro 50 € für 10.000. <b>Eigener Server:</b> kleinster Server in Deutschland etwa 7 bis 10 € brutto im Monat, Backups etwa 1,50 € dazu, Software 0 €. Dazu kommt deine Zeit: etwa eine Stunde Einrichtung, danach rund 15 Minuten im Monat.", "d2": "Was die Cloud dir abnimmt: Updates, Backups, Ausfallsicherheit. Was der eigene Server dir gibt: Daten im Haus, keine Grenze bei Ausführungen, keine Abo-Stufen.", "note": "Ehrlich: n8n selbst empfiehlt den eigenen Server nur, wenn jemand im Haus Server kennt. Genau das lernst du in diesem Teil. Preise ändern sich, die Zahlen sind vom 03.11.2026."}, {"t": "Wähl deinen Weg", "d": "<b>Pilot:</b> Du mietest in Level 2 selbst einen Server (Firmen- oder Privatkonto, Chef vorher fragen). <b>Beobachter:</b> Du schaust bei Level 2 bis 6 zu, füllst in Level 6 den Server-Steckbrief aus und hast damit einen fertigen Vorschlag. Beide Wege machen den Abschluss-Check.", "widget": "weg", "note": "Wer n8n nicht selbst betreiben will, kann das Betreiben an uns übergeben. Den Knopf dafür findest du in Level 6. Nicht in der Rechnung oben: eine eigene Internetadresse (Domain), falls dein Betrieb noch keine hat, meist unter 15 € im Jahr."}], "checks": ["Ich weiß, welche Ampelfarbe mein Prozess aus Teil 1 hat.", "Ich habe meinen Weg gewählt: Pilot oder Beobachter."]}, {"id": 2, "title": "Server mieten in 15 Minuten", "videos": ["X2"], "merksatz": "Deutschland als Standort, Firewall an, AVV abgeschlossen.", "kernpunkte": ["Wir zeigen Hetzner (Nürnberg oder Falkenstein), weil unser eigener n8n-Server dort läuft und n8n eine eigene Hetzner-Anleitung hat. Plan B: Netcup, Standort Nürnberg, fast gleiche Schritte.", "Ein kleiner Server mit 2 Kernen und 4 GB Arbeitsspeicher reicht für n8n mit ein paar Dutzend Workflows. Vergrößern geht später mit zwei Klicks.", "Der AVV mit dem Server-Anbieter ist Pflicht, sobald Personendaten verarbeitet werden. Bei Hetzner schließt du ihn im Kundenkonto ab, zwei Minuten."], "assist": "Steht bei Hetzner „nicht bestellbar“ oder sieht die Seite anders aus? Schick dem Assistenten einen Screenshot.", "type": "guide", "intro": "Pilot: Leg los, rechne mit 15 Minuten. Beobachter: Lies mit und merk dir die drei Pflichtpunkte Standort, Firewall, AVV.", "steps": [{"t": "Konto anlegen", "d": "Geh auf <b>console.hetzner.cloud</b>, registriere dich, bestätige die E-Mail und hinterlege eine Zahlungsmethode. Zahlt der Betrieb, nimm ein Firmenkonto mit Firmenadresse.", "link": {"href": "https://console.hetzner.cloud", "label": "Hetzner Cloud öffnen ↗"}}, {"t": "Projekt anlegen", "d": "Ein Projekt ist eine Schublade für Server, Firewall und Backups. Name zum Beispiel <b>n8n-Firma</b>."}, {"t": "Server hinzufügen", "d": "Standort <b>Falkenstein</b> oder <b>Nürnberg</b> (nicht Helsinki). Image <b>Ubuntu 24.04</b> (das Betriebssystem). Typ: der kleinste mit 2 Kernen und 4 GB Arbeitsspeicher, bei Hetzner <b>CX23</b> (7,13 € im Monat, Stand 03.11.2026). Den Haken bei <b>öffentliche IPv4</b> anlassen, das ist die Nummer deines Servers im Internet (etwa 0,60 € im Monat extra). Rest Standard. Alle Preise hier mit Mehrwertsteuer.", "note": "Steht dort „aktuell nicht bestellbar“: nimm den nächstgrößeren Typ oder Plan B Netcup. Die Schritte danach bleiben gleich."}, {"t": "Zugang: Passwort oder SSH-Schlüssel", "d": "Einsteiger: den Punkt SSH-Schlüssel überspringen, Hetzner schickt dir das Passwort für <b>root</b> per Mail. Root heißt: der Hauptbenutzer mit allen Rechten. Beim ersten Login musst du das Passwort ändern. Das neue gehört in einen <b>Passwort-Manager</b> (ein Passwort-Tresor wie Bitwarden oder der eurer IT), nie in einen Chat oder eine Mail.", "note": "Ein SSH-Schlüssel ist ein Schlüssel statt eines Passworts und sicherer. Wer einen hat, trägt ihn hier ein; wer nicht, macht das später mit der IT."}, {"t": "Firewall anlegen", "d": "Im Projekt <b>Firewalls → Firewall erstellen</b>. Eingehend erlauben nur <b>22</b> (Verwaltung per Terminal), <b>80</b> (für das Zertifikat) und <b>443</b> (verschlüsselte n8n-Oberfläche). Auf den Server anwenden. Alles andere bleibt zu."}, {"t": "Backups einschalten", "d": "Server → <b>Backups</b> → aktivieren. Etwa 20 % Aufschlag auf den Serverpreis (ab 1,43 € im Monat, Stand 03.11.2026), sieben Sicherungen rollierend, täglich automatisch. Das ist dein Sicherheitsnetz für Level 6."}, {"t": "AVV abschließen und IP notieren", "d": "Kundenkonto → <b>AV-Vertrag</b> (Data Processing Agreement) → akzeptieren, PDF ablegen. Dann in der Serverliste die <b>IP-Adresse</b> deines Servers notieren, die brauchst du in Level 3.", "link": {"href": "https://accounts.hetzner.com/account/dpa", "label": "AV-Vertrag bei Hetzner ↗"}}], "checks": ["Pilot: Mein Server läuft, die IP ist notiert. Beobachter: Ich kann sagen, welche Türen die Firewall offen lässt und wozu.", "Ich weiß, wo der AVV abgeschlossen wird."]}, {"id": 3, "title": "Adresse und Werkzeugkasten", "videos": ["X3"], "merksatz": "Die Adresse zeigt auf deinen Server, Docker verpackt die Programme.", "kernpunkte": ["Eine Unteradresse wie n8n.deinefirma.de genügt. Du legst sie dort an, wo eure Firmen-Domain liegt. Ein Eintrag vom Typ A zeigt auf die IP des Servers.", "Docker ist der Werkzeugkasten: Programme laufen darin als fertige Pakete (Container), ohne dass du etwas von Hand installierst. n8n zeigt in seiner Doku genau diesen Weg.", "Alles in diesem Level ist Kopieren und Einfügen. Sieht eine Meldung anders aus als in der Box, frag den Setup-Assistenten."], "assist": "Terminal zeigt rot? Screenshot an den Assistenten, er liest die Meldung mit dir.", "type": "guide", "intro": "Zwei Dinge: eine Adresse, die auf den Server zeigt, und Docker auf dem Server. Rechne mit 15 Minuten plus Wartezeit für die Adresse.", "steps": [{"t": "Unteradresse anlegen", "d": "Beim Anbieter eurer Domain (IONOS, Strato, All-Inkl, Hetzner DNS …): <b>DNS → neuer Eintrag</b> → Typ <b>A</b>, Name <b>n8n</b>, Wert = IP deines Servers, Rest Standard. Es dauert bis zu einer Stunde, bis die Adresse überall bekannt ist.", "note": "Keine Firmen-Domain zur Hand? Für den Kurs geht auch eine günstige Übungs-Domain. Für den Betrieb später die echte."}, {"t": "Mit dem Server verbinden", "d": "Weg A, ohne Installation: In der Hetzner-Konsole beim Server auf <b>Konsole</b> (Symbol <b>&gt;_</b>), anmelden mit <b>root</b> und dem Passwort aus der Mail.", "tabs": [{"label": "Weg A: Hetzner-Konsole", "d": "Klick beim Server auf das Konsolen-Symbol. Es öffnet sich ein schwarzes Fenster im Browser. Tipp <b>root</b>, Enter, dann das Passwort aus der Mail (es wird beim Tippen nicht angezeigt), Enter."}, {"label": "Weg B: Terminal am eigenen Rechner", "d": "Terminal öffnen wie in Teil 2, Level 2, und eingeben:", "code": "ssh root@DEINE-IP", "d2": "Beim ersten Mal fragt der Rechner, ob er dem Server vertrauen soll: <b>yes</b> tippen, Enter. Dann das Passwort."}]}, {"t": "Passwort ändern", "d": "Der Server verlangt das beim ersten Login von selbst: altes Passwort, dann zweimal das neue. Lang, nur im Passwort-Manager."}, {"t": "System aktualisieren", "d": "Kopieren, einfügen, Enter. Dauert ein bis drei Minuten.", "code": "apt update && apt upgrade -y", "term": ["Reading package lists... Done", "Building dependency tree... Done", "…", "0 upgraded, 0 newly installed, 0 to remove"]}, {"t": "Docker installieren", "d": "Docker liefert ein Programm mit, das alles selbst einrichtet (die erste Zeile). Danach prüfst du mit den beiden anderen Zeilen, ob Docker und Docker Compose da sind.", "code": "curl -fsSL https://get.docker.com | sh\ndocker --version\ndocker compose version", "term": ["Docker version 28.x.x, build …", "Docker Compose version v2.x.x"]}, {"t": "Ordner für n8n anlegen", "d": "Alles, was zu n8n gehört, liegt ab jetzt in einem Ordner. Das macht Backups einfach.", "code": "mkdir -p /opt/n8n && cd /opt/n8n"}], "checks": ["Pilot: docker compose version zeigt eine Versionsnummer. Beobachter: Ich kann in einem Satz sagen, was Docker auf dem Server macht.", "Ich weiß, wo die Unteradresse angelegt wird."]}, {"id": 4, "title": "n8n starten: drei Dateien, ein Befehl", "videos": ["X4"], "merksatz": "Erster Besucher wird Chef, der Schlüssel liegt zweimal.", "kernpunkte": ["Drei Dateien reichen: .env (deine Einstellungen), docker-compose.yml (welche Programme laufen: n8n, Datenbank, Türsteher), Caddyfile (eine Zeile für den Türsteher Caddy, der das Schloss-Symbol im Browser selbst besorgt).", "Die Datenbank heißt Postgres. Sie ist das Regal, in dem n8n Workflows und Zugangsdaten ablegt. n8n empfiehlt sie für den Dauerbetrieb statt der eingebauten Datei-Datenbank, und ein späterer Wechsel wäre mühsam.", "Der Verschlüsselungsschlüssel schützt alle Zugangsdaten in n8n. Verlierst du ihn, sind alle Credentials unlesbar. Er gehört an zwei Orte: in die .env und in euren Passwort-Manager."], "assist": "Seite lädt nicht oder zeigt eine Zertifikatswarnung? Warte zwei Minuten, dann Screenshot an den Assistenten.", "type": "guide", "intro": "Die Dateien liegen fertig zum Kopieren vor. Du änderst nur deine Adresse, den Schlüssel und das Datenbank-Passwort. Rechne mit 20 Minuten.", "steps": [{"t": "Datei 1: deine Einstellungen (.env)", "d": "Öffne den Editor mit <b>nano .env</b>, füge den Inhalt ein und ersetze die drei Platzhalter in Großbuchstaben. Speichern: Strg+O, Enter, schließen: Strg+X.", "code": "N8N_HOST=n8n.DEINEFIRMA.de\nN8N_PROTOCOL=https\nN8N_WEBHOOK_URL=https://n8n.DEINEFIRMA.de/\nN8N_PROXY_HOPS=1\nGENERIC_TIMEZONE=Europe/Berlin\nTZ=Europe/Berlin\nN8N_ENCRYPTION_KEY=HIER-DEN-LANGEN-ZUFALLSWERT\nPOSTGRES_USER=n8n\nPOSTGRES_PASSWORD=HIER-EIN-LANGES-PASSWORT\nPOSTGRES_DB=n8n\nEXECUTIONS_DATA_PRUNE=true\nEXECUTIONS_DATA_MAX_AGE=336\nN8N_PUBLIC_API_DISABLED=true", "note": "Den Zufallswert für den Schlüssel erzeugst du mit <b>openssl rand -hex 32</b>. Kopiere ihn sofort auch in den Passwort-Manager (Level 2, Schritt 4)."}, {"t": "Datei 2: die Programme (docker-compose.yml)", "d": "<b>nano docker-compose.yml</b>, Inhalt aus der Box einfügen, nichts ändern. Drei Dienste: <b>postgres</b> (Datenbank, spricht nur intern mit n8n), <b>n8n</b> (der Motor, feste Versionsnummer), <b>caddy</b> (Türsteher auf Port 80 und 443).", "code": "services:\n  postgres:\n    image: postgres:16\n    restart: unless-stopped\n    environment:\n      POSTGRES_USER: ${POSTGRES_USER}\n      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}\n      POSTGRES_DB: ${POSTGRES_DB}\n    volumes:\n      - pg_data:/var/lib/postgresql/data\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\n  n8n:\n    image: docker.n8n.io/n8nio/n8n:2.46.4\n    restart: unless-stopped\n    env_file: .env\n    environment:\n      DB_TYPE: postgresdb\n      DB_POSTGRESDB_HOST: postgres\n      DB_POSTGRESDB_PORT: 5432\n      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}\n      DB_POSTGRESDB_USER: ${POSTGRES_USER}\n      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}\n      N8N_PORT: 5678\n    volumes:\n      - n8n_data:/home/node/.n8n\n    depends_on:\n      postgres:\n        condition: service_healthy\n\n  caddy:\n    image: caddy:2\n    restart: unless-stopped\n    ports:\n      - \"80:80\"\n      - \"443:443\"\n    volumes:\n      - ./Caddyfile:/etc/caddy/Caddyfile\n      - caddy_data:/data\n      - caddy_config:/config\n    depends_on:\n      - n8n\n\nvolumes:\n  pg_data:\n  n8n_data:\n  caddy_data:\n  caddy_config:", "note": "Die Versionsnummer 2.46.4 ist die stabile Version vom 03.11.2026. n8n 3.0 (erschienen Ende Oktober 2026) kann alte Workflows brechen; wechsle erst, wenn du die Änderungsliste des Herstellers (Release-Notes) gelesen hast."}, {"t": "Datei 3: der Türsteher (Caddyfile)", "d": "<b>nano Caddyfile</b>, eine Regel, deine Adresse einsetzen. Caddy besorgt das Zertifikat (den Ausweis für das Schloss-Symbol im Browser) automatisch und kostenlos bei Let's Encrypt. Deshalb mussten die Türen 80 und 443 offen sein.", "code": "n8n.DEINEFIRMA.de {\n    reverse_proxy n8n:5678\n}"}, {"t": "Starten", "d": "Ein Befehl. Danach prüfen, ob alle drei laufen. In der ersten Minute holt Caddy das Zertifikat.", "code": "docker compose up -d\ndocker compose ps", "term": [" ✔ Container n8n-postgres-1  Started", " ✔ Container n8n-n8n-1       Started", " ✔ Container n8n-caddy-1     Started"]}, {"t": "Owner-Konto anlegen", "d": "Im Browser <b>https://n8n.DEINEFIRMA.de</b> öffnen. Die erste Person, die diese Seite öffnet, wird <b>Owner</b>, also Chef der Instanz. Deshalb sofort: Vorname, Nachname, E-Mail, starkes Passwort.", "note": "Schloss-Symbol in der Adresszeile = Verschlüsselung läuft. Fehlt es nach fünf Minuten, prüf den A-Eintrag aus Level 3 und die Firewall aus Level 2."}, {"t": "Gratis-Funktionen freischalten", "d": "<b>Settings → Usage and plan → Unlock</b>: n8n schickt einen kostenlosen Registrierungsschlüssel per Mail. Er schaltet Ordner, Debugging im Editor und eigene Ausführungsdaten frei."}, {"t": "Vergleich mit der Kurs-Instanz", "d": "Gleiche Oberfläche, gleiche vier Reiter wie in Teil 2, Level 1. Unterschied: Du bist Owner, du legst Nutzer an, und es gibt keine Grenze bei Ausführungen.", "d2": "Was in der kostenlosen Version fehlt (Stand November 2026): Projekte als Ordner für Teams · Teilen von Workflows und Zugangsdaten zwischen Nutzern · zentrale Variablen · Anmeldung über den Firmen-Login. Für ein bis drei Nutzer reicht sie, und die Lizenz erlaubt die Nutzung im eigenen Betrieb kostenlos."}], "checks": ["Pilot: Owner-Konto angelegt, Schloss-Symbol gesehen, Schlüssel liegt im Passwort-Manager. Beobachter: Ich kann sagen, was passiert, wenn der Verschlüsselungsschlüssel verloren geht.", "Ich weiß, welche drei Dateien n8n braucht."]}, {"id": 5, "title": "Umzug: deine Workflows ziehen ein", "videos": ["X5"], "merksatz": "Export, Import, Zugangsdaten neu, testen, erst dann abschalten.", "kernpunkte": ["Ein Workflow ist eine JSON-Datei. Export in der Kurs-Instanz (Teil 2, Level 8), Import auf deinem Server: zwei Klicks.", "Zugangsdaten (Credentials) kommen nie mit. Das ist Absicht und gut so: Du legst Gmail oder Outlook auf dem neuen Server neu an, wie in Teil 2, Level 5.", "Alles, was eine Adresse hat (Formulare, Webhooks), bekommt auf dem neuen Server eine neue Adresse. Wer den Link irgendwo eingetragen hat, tauscht ihn."], "assist": "Roter Knoten nach dem Import? Das ist fast immer eine fehlende Zugangsdaten-Auswahl. Screenshot an den Assistenten.", "type": "guide", "intro": "Zieh den Ideen-Briefkasten und deinen eigenen Prozess aus Teil 2 um. Rechne mit 20 Minuten.", "steps": [{"t": "Exportieren in der Kurs-Instanz", "d": "Workflow öffnen → Menü <b>…</b> → <b>Download</b> (das ist der Export als JSON aus Teil 2, Level 8). Für jeden Workflow eine Datei. Du brauchst den Ideen-Briefkasten und deinen eigenen Prozess.", "img": "35_menu_export.jpg", "link": {"href": "https://momentumki.app.n8n.cloud/home/workflows", "label": "Kurs-Instanz öffnen ↗"}}, {"t": "Importieren auf deinem Server", "d": "Auf deiner Instanz: neuer Workflow → Menü <b>…</b> → <b>Import from File</b> → Datei wählen → Speichern."}, {"t": "Zugangsdaten neu anlegen", "d": "Rote Knoten zeigen, wo Zugangsdaten fehlen. <b>Credentials → neu</b> → Gmail oder Outlook, wie in Teil 2. Dann im Knoten auswählen.", "note": "Dass Zugangsdaten nicht mitreisen, schützt dich: Eine Export-Datei kann man weitergeben, ohne ein Passwort zu verraten."}, {"t": "Datentabelle mitnehmen", "d": "Die Tabelle <b>Ideen</b> aus Teil 2 kommt nicht mit dem Export, ihre Zeilen auch nicht. In der Kurs-Instanz: <b>Data tables → Ideen → Download CSV</b>. Auf deinem Server: Data tables → neue Tabelle → CSV importieren. Danach im Workflow die Tabelle neu auswählen.", "d2": "Alternative, wenn Claude Code schon an deinem Server hängt (Level 6, Schritt 5): gib ihm den Auftrag aus der Box.", "widget": "prompt", "optional": true}, {"t": "Adressen tauschen", "d": "Formular-Knoten öffnen → neue Produktions-Adresse kopieren → überall ersetzen, wo der alte Link stand. Webhook-Knoten genauso."}, {"t": "Testen wie ein Nutzer", "d": "Formular ausfüllen, Lauf in den Executions grün, Zeile in der Tabelle, Mail angekommen. Genau wie in Teil 2, Level 6.", "img": "25_form_done.jpg"}, {"t": "Alte Version abschalten", "d": "In der Kurs-Instanz den Workflow <b>deaktivieren</b>, nicht löschen. Am besten erst, wenn der neue eine Woche sauber läuft; trag dir den Termin ein.", "note": "Die Kurs-Instanz bleibt bis Kursende dein Übungsraum, nur mit Testdaten."}], "checks": ["Pilot: Mein Workflow läuft auf meinem Server; die alte Version ist aus oder der Termin dafür steht. Beobachter: Ich kann die Schritte des Umzugs in der richtigen Reihenfolge nennen.", "Ich weiß, was beim Export nicht mitkommt."]}, {"id": 6, "title": "Wartung: der Hangar bleibt sauber", "videos": ["X6"], "merksatz": "Update, Backup, Fehler lesen, Schloss davor.", "kernpunkte": ["Auch dein Auto braucht Service, sonst bleibt es stehen. Dein Server genauso. Drei Handgriffe: Update, Backup, Fehler lesen. Dazu ein Schloss: die Zwei-Faktor-Anmeldung.", "Das wichtigste Backup ist der Verschlüsselungsschlüssel. Ohne ihn sind die Zugangsdaten in jeder Sicherung unlesbar.", "Verantwortung braucht einen Namen. Der Server-Steckbrief hält fest: wo, wer, wie oft, was im Notfall."], "assist": "Update schiefgegangen? Nicht löschen. Screenshot der Fehlermeldung an den Setup-Assistenten, meist reicht ein Neustart.", "type": "guide", "intro": "Drei Handgriffe, ein Schloss und ein Steckbrief. Der Steckbrief ist deine Abschlussaufgabe, für Pilot und Beobachter.", "steps": [{"t": "Update (monatlich, 2 Minuten)", "d": "Erst in der docker-compose.yml die Versionsnummer auf die aktuelle stabile Version setzen (nachsehen unter docs.n8n.io/release-notes, der Änderungsliste des Herstellers). Dann:", "code": "cd /opt/n8n && docker compose pull && docker compose down && docker compose up -d", "note": "Nicht am Freitagnachmittag. Nicht auf eine brandneue Hauptversion wie 3.0, ohne die Änderungen gelesen zu haben."}, {"t": "Backup (Server täglich automatisch, Datenbank per Zeitplan)", "d": "Zwei Ebenen. <b>Erstens</b> das Hetzner-Backup des ganzen Servers aus Level 2, das läuft von selbst. <b>Zweitens</b> die Datenbank als Datei. Einmal von Hand, damit du siehst, dass es geht:", "code": "mkdir -p /opt/n8n/backups\ndocker compose exec -T postgres pg_dump -U n8n n8n > /opt/n8n/backups/n8n_$(date +%F).sql", "d2": "Dann der Zeitplan, jede Nacht um 3 Uhr, alte Dateien nach 14 Tagen weg (eine Zeile in eine neue Datei, speichern, fertig):", "term": ["nano /etc/cron.d/n8n-backup", "0 3 * * * root cd /opt/n8n && docker compose exec -T postgres pg_dump -U n8n n8n > /opt/n8n/backups/n8n_$(date +\\%F).sql && find /opt/n8n/backups -name \"*.sql\" -mtime +14 -delete"], "note": "Einmal zurückspielen üben, sonst ist es kein Backup, sondern eine Hoffnung. Den Befehl dafür gibt dir der Setup-Assistent, wenn du ihm sagst, dass du eine Sicherung testen willst. Und die .env mit dem Schlüssel liegt im Passwort-Manager (Level 4)."}, {"t": "Das Schloss: Zugriff schützen", "d": "Owner-Konto mit Zwei-Faktor-Anmeldung: <b>Settings → Personal → Two-factor authentication</b>. Weitere Nutzer nur einladen, nie das Owner-Passwort teilen. Die Firewall bleibt wie in Level 2."}, {"t": "Fehler lesen", "d": "<b>Executions</b> → rote Einträge, wie in Teil 2, Level 6. Dazu auf dem Server das Fehlerprotokoll, die letzten 50 Zeilen:", "code": "docker compose logs n8n --tail 50", "d2": "Ausführungsdaten werden nach 14 Tagen automatisch gelöscht (Einstellung aus Level 4)."}, {"t": "Claude Code an deinen Server anschließen", "d": "<b>Settings → Instance-level MCP → Enable MCP access</b> (nur Owner oder Admin), dann je Workflow <b>Available in MCP</b> setzen. Im Terminal, wie in Teil 2, Level 3, nur mit deiner Adresse und einem eigenen Namen, damit die Verbindung zur Kurs-Instanz bleibt:", "code": "claude mcp add --transport http n8n-server https://n8n.DEINEFIRMA.de/mcp-server/http", "d2": "Danach in Claude Code <b>/mcp</b> → n8n-server → anmelden. Ab jetzt baut Claude auf deinem Server statt in der Kurs-Instanz.", "note": "Wer MCP nicht will, schaltet es komplett ab: N8N_DISABLED_MODULES=mcp in der .env."}, {"t": "Wer ist verantwortlich? Dein Server-Steckbrief", "d": "Fünf Zeilen, die in deine Zusammenfassung wandern. Beobachter füllen das als Vorschlag für Chef oder IT aus.", "widget": "serversteckbrief"}, {"t": "Wenn du das nicht selbst willst", "d": "Ehrlich: Für manche Betriebe ist n8n Cloud mit Vertrag der bessere Weg (Starter 20 € im Monat bei Jahreszahlung, Stand 03.11.2026), für andere ein Partner, der den Server betreibt. Beides ist in Ordnung. Wichtig ist nur, dass es jemand bewusst entscheidet.", "widget": "angebot", "optional": true}], "checks": ["Mein Server-Steckbrief hat fünf ausgefüllte Zeilen.", "Ich kenne die drei Handgriffe (Update, Backup, Fehler lesen) und weiß, wo das Schloss ist.", "Pilot: Ich habe ein Backup einmal zurückgespielt oder mir den Termin dafür notiert. Beobachter: Ich habe das in den Steckbrief geschrieben."]}], "check": [{"q": "Eure Workflows verarbeiten Arztbriefe. Wo gehören sie hin?", "a": "Auf den eigenen Server, denn das ist Rot", "d": ["In jede Cloud, denn das ist Grün", "In eine Cloud ohne Vertrag", "Egal, solange die Verbindung verschlüsselt ist"], "lv": 1}, {"q": "Was ist ein AVV?", "a": "Ein Vertrag, mit dem der Anbieter in eurem Auftrag Daten verarbeitet", "d": ["Ein Plan, wann der Server gesichert wird", "Ein Paket aus Server und Speicherplatz", "Eine Regel, welche Türen die Firewall öffnet"], "lv": 2}, {"q": "Was gehört zu einem Backup, auf das du dich verlassen kannst?", "a": "Einmal zurückspielen üben und den Schlüssel sichern", "d": ["Nur die Hetzner-Sicherung einschalten", "Die Datenbank einmal im Jahr als Datei speichern", "Den Schlüssel in den Team-Chat legen, damit ihn alle haben"], "lv": 6}, {"q": "Was trägst du beim Domain-Anbieter ein, damit n8n.deinefirma.de auf deinen Server zeigt?", "a": "Einen A-Eintrag mit der IP-Adresse deines Servers", "d": ["Einen Eintrag mit der Adresse der Kurs-Instanz", "Die E-Mail-Adresse des Owners als Kontakt", "Den Verschlüsselungsschlüssel aus der .env"], "lv": 3}, {"q": "Wozu dient Docker auf dem Server?", "a": "Programme laufen darin als fertige Pakete, die Container heißen", "d": ["Es verschlüsselt die Verbindung zwischen Browser und Server", "Es mietet den Server beim Anbieter und zahlt ihn", "Es ersetzt n8n durch eine eigene Oberfläche"], "lv": 3}, {"q": "Was passiert, wenn der Verschlüsselungsschlüssel verloren geht?", "a": "Die gespeicherten Zugangsdaten sind unlesbar, neu anlegen", "d": ["Nichts, n8n erzeugt beim nächsten Start einen neuen", "Die Workflows sind weg, die Zugangsdaten bleiben", "Die Datenbank wird gelöscht und neu angelegt"], "lv": 4}, {"q": "Wer wird Owner einer neuen n8n-Instanz?", "a": "Die erste Person, die die Seite öffnet und sich registriert", "d": ["Der Server-Anbieter, bis du ihn änderst", "Die Person, die den AVV abschließt", "Immer die IT-Abteilung des Betriebs"], "lv": 4}, {"q": "Was kommt beim Workflow-Export NICHT mit?", "a": "Die Zugangsdaten, also die Credentials", "d": ["Die Kästchen, also die Knoten", "Die Linien zwischen den Kästchen", "Der Name und die Beschreibung des Workflows"], "lv": 5}, {"q": "Die richtige Reihenfolge beim Umzug?", "a": "Export, Import, Zugangsdaten neu, testen, alte Version aus", "d": ["Alte Version aus, Export, Import, Zugangsdaten neu, testen", "Export, Import, testen, Zugangsdaten neu, alte Version aus", "Export, Zugangsdaten neu, Import, alte Version aus, testen"], "lv": 5}, {"q": "Was machst du beim monatlichen Update als Erstes?", "a": "Die Versionsnummer in der docker-compose.yml auf die aktuelle stabile setzen", "d": ["Den Server beim Anbieter löschen und neu bestellen", "Alle Workflows exportieren und neu importieren", "Den Verschlüsselungsschlüssel neu erzeugen"], "lv": 6}], "pass": 8, "prompts": [["Datentabelle Ideen neu anlegen", "Du arbeitest in meiner eigenen n8n-Instanz über MCP.\n\nLege die Datentabelle „Ideen“ mit den Spalten idee (Text), name (Text) und eingegangen (Datum) an. Verbinde sie mit dem importierten Workflow „Ideen-Briefkasten“, sodass jede Formular-Eingabe als neue Zeile gespeichert wird. Ändere sonst nichts am Workflow. Sag mir am Ende, was du geändert hast, und veröffentliche noch nicht."]], "steck": {"own": ["Anbieter und Standort", "Adresse", "Verantwortlich", "Backup", "Notfall"], "hint": ["z. B. Hetzner, Nürnberg, CX23, AVV abgeschlossen", "z. B. n8n.deinefirma.de", "Name oder Rolle, dazu die Vertretung", "wie, wie oft, wo liegt der Schlüssel", "wer wird angerufen, was ist der erste Schritt"]}, "ampel": [   function ask() {

    S.check = { best: Math.max(score, S.check ? S.check.best : 0), passed: passed || (S.check && S.check.passed) }; S.checkTries = (S.checkTries || 0) + 1; S.checkWrong = wrong.map(q => q.q); save(); badges();

const WEBHOOK = "https://n8n.hm-storage.de/webhook/kurs-lernstand";

const TID_KEY = "m11-teilnehmer-id";
CAP.dl = { save: async ({ filename, data }) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "text/plain;charset=utf-8" })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); } };

function teilnehmerId() {
  let id = null;
  try { id = localStorage.getItem(TID_KEY); } catch (e) {}

    const r = new Uint8Array(12); crypto.getRandomValues(r);
    id = "t_" + Array.from(r, b => b.toString(16).padStart(2, "0")).join("");

}

  if (st.k === "video") return st.lv > NLV ? "Abschlussvideo" : "Level " + st.lv + " · Video"; if (st.k === "task") return "Level " + st.lv + " · Aufgabe"; return String(i);

function payload(extra) {
  return Object.assign({
    kurscode: S.kurscode || "", teilnehmer_id: teilnehmerId(), name: S.name || "", kurs: KURS,
    level_fertig: Object.keys(S.done).length, level_gesamt: NLV, check_gesamt: DATA.check.length, fortschritt_prozent: Math.round((S.maxStep || 0) / (STEPS.length - 1) * 100),

  }, extra || {});

function post(body) {

}
let syncTimer = null, lastSent = "";
function syncLater() {
  try { updMeta(); } catch (e) {}

  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { const b = payload(); const k = JSON.stringify(b); if (k === lastSent) return; lastSent = k; post(b).catch(() => { lastSent = ""; }); }, 1500);
}
window.addEventListener("pagehide", () => { if (syncTimer) { clearTimeout(syncTimer); const b = payload(); if (JSON.stringify(b) !== lastSent && S.name && S.kurscode) post(b).catch(() => {}); } });

      let k0 = 0; try { k0 = +(localStorage.getItem("m13-tab-" + L.id + "-" + i) || (navigator.platform.indexOf("Win") > -1 && s.tabs.length > 1 && /Windows/.test(s.tabs[1].label) ? 1 : 0)); } catch (e) {}

  let o = document.getElementById("verbBox");
  if (!o) { o = document.createElement("div"); o.id = "verbBox"; document.body.appendChild(o); }
  o.setAttribute("style", "position:fixed;inset:0;z-index:200;background:rgba(20,18,58,.45);display:flex;align-items:center;justify-content:center;padding:16px");
  const wo = KURS + " · " + schrittName(S.step || 0);
  o.innerHTML = '<div class="card" role="dialog" aria-modal="true" aria-labelledby="verbT" style="max-width:520px;width:100%;margin:0;max-height:92vh;overflow:auto">' +
    '<h2 id="verbT" style="margin:0 0 6px">💡 Verbesserung vorschlagen</h2>' +
    '<p class="muted" style="margin:0 0 12px">Du hast einen Fehler entdeckt, etwas war unklar oder du hast eine Idee? Schreib es uns, wir verbessern den Kurs laufend. Die Stelle, an der du gerade bist, schicken wir automatisch mit: <b>' + esc(wo) + '</b>.</p>' +
    '<div class="opts two" id="verbArt" style="margin-bottom:10px"><button type="button" class="opt" data-a="fehler">🐞 Fehler gefunden</button><button type="button" class="opt" data-a="idee">✨ Idee / unklar</button></div>' +
    '<textarea id="verbText" maxlength="4000" rows="5" style="width:100%;box-sizing:border-box" placeholder="Was ist dir aufgefallen? Zum Beispiel: Der Knopf … reagiert nicht, im Text steht …, ich hätte mir hier ein Beispiel gewünscht …"></textarea>' +
    '<p class="small muted" style="margin:8px 0 0">Bitte keine Passwörter oder Schlüssel. Du kannst Fehler und Ideen auch einfach dem Kurs-Assistenten (Chat unten rechts) schreiben, er gibt sie an uns weiter.</p>' +
    '<div class="row" style="justify-content:flex-end;gap:10px;margin-top:14px"><button class="btn sec" id="verbAbbr" type="button">Abbrechen</button><button class="btn" id="verbSend" type="button">Senden</button></div></div>';
  let art = "idee";
  const knoepfe = o.querySelectorAll("#verbArt [data-a]");
  const setArt = a => { art = a; knoepfe.forEach(b => { const on = b.dataset.a === a; b.style.borderColor = on ? "var(--accent)" : ""; b.style.background = on ? "#F4F1FD" : ""; b.setAttribute("aria-pressed", on ? "true" : "false"); }); };
  knoepfe.forEach(b => b.onclick = () => setArt(b.dataset.a));
  setArt("idee");
  o.onclick = e => { if (e.target === o) o.remove(); };
  document.getElementById("verbAbbr").onclick = () => o.remove();
  document.getElementById("verbText").focus();
  document.getElementById("verbSend").onclick = async ev => {
    const t = document.getElementById("verbText").value.trim();
    if (t.length < 5) { toast("Bitte schreib kurz, was dir aufgefallen ist."); return; }
    if (!S.name || !kurscodeOk(S.kurscode)) { toast("Bitte trag zuerst auf der Startseite deinen Namen und den Kurscode ein."); return; }
    ev.target.disabled = true;
    try {
      const r = await fetch(VERB_HOOK, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ aktion: "verbesserung", art, text: t, modul: KURS, schritt: schrittName(S.step || 0), seite: location.pathname, teilnehmer_id: teilnehmerId(), name: S.name || "", kurscode: S.kurscode || "" }) });
      const j = await r.json().catch(() => ({ ok: false }));
      if (!j.ok) throw new Error(j.fehler || "Das hat leider nicht geklappt. Bitte versuch es später noch einmal.");
      o.remove(); toast("Danke! Dein Hinweis ist beim Momentum-Team angekommen.");
    } catch (e) { toast(e.message); ev.target.disabled = false; }
  };
}

// ---------- Teil 3: Weg wählen, Ampel, Server-Steckbrief, Merkblatt ----------
function widgetWeg() {
  const box = el("div", "gwidget"); box.appendChild(el("label", "", "Dein Weg durch Teil 3"));
  const g = el("div", "gchoice");
  [["pilot", "Pilot: Ich miete selbst und baue mit"], ["beobachter", "Beobachter: Ich schaue zu und schreibe den Vorschlag"]].forEach(([v, t]) => {
    const b = el("button", "chip", esc(t)); b.type = "button"; if (S.weg === v) b.classList.add("sel");
    b.onclick = () => { const first = !S.weg; S.weg = v; save(); g.querySelectorAll("button").forEach(x => x.classList.toggle("sel", x === b)); if (first) addXP(20, "Weg gewählt"); msg.innerHTML = '<div class="fb ok">' + (v === "pilot" ? "Pilot. Ab Level 2 brauchst du eine Zahlungsmethode für den Server (ab etwa 7 € im Monat, Stand November 2026). Frag vorher deinen Chef, wenn der Betrieb zahlt." : "Beobachter. Du machst alle Level mit, ohne etwas zu mieten. In Level 6 schreibst du den Server-Steckbrief als Vorschlag für Chef oder IT.") + '</div>'; };
    g.appendChild(b);
  });
  const msg = el("div"); box.append(g, msg); return box;
}
function widgetAmpel() {
  const box = el("div", "gwidget"); T3 = S.ampel = S.ampel || {};
  const farben = [["gruen", "Grün"], ["gelb", "Gelb"], ["rot", "Rot"]];
  DATA.ampel.forEach((it, i) => {
    const row = el("div", "gf"); row.appendChild(el("label", "", esc(it.t))); const g = el("div", "gchoice"); const fb = el("div");
    farben.forEach(([v, t]) => { const b = el("button", "chip amp-" + v, t); b.type = "button"; if (S.ampel[i] === v) b.classList.add("sel");
      b.onclick = () => { g.querySelectorAll("button").forEach(x => x.classList.toggle("sel", x === b)); const ok = v === it.a; fb.innerHTML = '<div class="fb ' + (ok ? "ok" : "bad") + '">' + (ok ? "Richtig. " : "Nicht ganz: " + farben.find(f => f[0] === it.a)[1] + ". ") + esc(it.r) + '</div>'; if (ok && S.ampel[i] !== v) { S.ampel[i] = v; save(); addXP(10, "Ampel"); } };
      g.appendChild(b); });
    row.append(g, fb); box.appendChild(row);
  });
  return box;
}
let T3 = null;
function widgetServersteckbrief() {
  const box = el("div", "gwidget"); const names = DATA.steck.own, hints = DATA.steck.hint;
  if (!Array.isArray(S.own) || S.own.length < 5) S.own = ["", "", "", "", ""];
  const state = el("div");
  const upd = () => { const n = S.own.filter(x => (x || "").trim().length > 2).length; state.innerHTML = n >= 5 ? '<div class="fb ok">Dein Server-Steckbrief ist vollständig. Er wandert in deine Zusammenfassung.</div>' : '<p class="muted small">' + n + ' von 5 Zeilen ausgefüllt. Ein Satz pro Zeile reicht.</p>'; if (n >= 5 && !S.steckXP) { S.steckXP = true; save(); addXP(60, "Server-Steckbrief"); } };
  names.forEach((n, k) => { const [w, i] = field(n, "textarea", S.own[k], hints[k], true); i.rows = 2; i.oninput = () => { S.own[k] = i.value; save(); upd(); syncLater(); }; box.appendChild(w); });
  box.appendChild(state); upd(); return box;
}
const _tGuide3 = tGuide;
tGuide = function (c, L, T, finish) {
  _tGuide3(c, L, T, finish);
  c.querySelectorAll("li.gstep").forEach((li, i) => { const s = L.steps[i]; if (!s) return; const body = li.querySelector(".gbody");
    if (s.widget === "weg") body.appendChild(widgetWeg());
    if (s.widget === "ampel") body.appendChild(widgetAmpel());
    if (s.widget === "serversteckbrief") body.appendChild(widgetServersteckbrief()); });
};
function widgetPrompt() { const box = el("div", "gwidget"); DATA.prompts.forEach(p => box.appendChild(codeBox(p[1], p[0]))); return box; }
const HANDGRIFFE = [["Update (monatlich)", "Versionsnummer in docker-compose.yml setzen, dann: cd /opt/n8n && docker compose pull && docker compose down && docker compose up -d"],
  ["Backup (täglich)", "Hetzner-Backup an; Datenbank per Zeitplan: docker compose exec -T postgres pg_dump -U n8n n8n > /opt/n8n/backups/n8n_$(date +%F).sql; Schlüssel im Passwort-Manager"],
  ["Fehler lesen", "Executions (rote Einträge) und docker compose logs n8n --tail 50"]];
function merkText() {
  return [DATA.title, "", "Die " + NLV + " Merksätze:", ...DATA.levels.map((L, i) => (i + 1) + ". " + L.merksatz), "",
    "Mein Server-Steckbrief:", ...DATA.steck.own.map((n, k) => n + ": " + ((S.own || [])[k] || "–")), "",
    "Die drei Handgriffe:", ...HANDGRIFFE.map(h => h[0] + ": " + h[1]), "",
    "XP: " + S.xp + (S.check ? " · Abschluss-Check: " + S.check.best + " / " + DATA.check.length : "")].join("\n");
}
function renderSummary(sc) {
  const hero = el("div", "hero brand noprint"); hero.style.backgroundImage = "url(" + MEDIA.LOGO_FULL + ")"; sc.appendChild(hero);
  const c = el("div", "card"); sc.appendChild(c);
  c.innerHTML = '<div class="kicker">Merkblatt</div><h1>' + (S.name ? esc(S.name) + ", du" : "Du") + ' hast Teil 3 geschafft</h1>' +
    '<p class="muted">' + esc(DATA.title) + ' · ' + S.xp + ' XP' + (S.check ? ' · Abschluss-Check: ' + S.check.best + ' / ' + DATA.check.length : '') + (S.weg ? ' · Weg: ' + (S.weg === "pilot" ? "Pilot" : "Beobachter") : '') + '</p>' +
    '<h2 style="margin-top:20px">Die ' + NLV + ' Merksätze</h2><ol class="ml">' + DATA.levels.map(L => '<li>' + esc(L.merksatz) + '</li>').join("") + '</ol>' +
    '<h2 style="margin-top:20px">Dein Server-Steckbrief</h2><div>' + DATA.steck.own.map((n, k) => '<p><b>' + esc(n) + ':</b> ' + (esc((S.own || [])[k] || "") || '<span class="muted">– noch leer –</span>') + '</p>').join("") + '</div>' +
    '<h2 style="margin-top:20px">Die drei Handgriffe</h2>';
  HANDGRIFFE.forEach(hg => c.appendChild(codeBox(hg[1], hg[0])));
  const row = el("div", "row noprint"); const p = el("button", "btn", "Merkblatt kopieren"); p.onclick = () => copyText(merkText());
  const dl = el("button", "btn sec", "Merkblatt speichern"); dl.onclick = () => saveFile("Merkblatt_Teil3.txt", merkText());
  const rs = el("button", "btn sec", "Fortschritt zurücksetzen"); confirmBtn(rs, () => { S = fresh(); save(); go(0); });
  row.append(p, dl, rs); c.appendChild(row);
  newsletterBox(sc);
  const c2 = el("div", "card"); c2.appendChild(dzBox()); sc.appendChild(c2);
  setNext(true, "Fertig – zu meinen Kursen", true);
}

$("#verb").onclick = e => { e.preventDefault(); verbesserungOeffnen(); };
$("#pause").onclick = e => { e.preventDefault(); fuerHeuteBeenden(false); };
$("#next").onclick = () => { if (STEPS[S.step] && STEPS[S.step].k === "summary") { fortschrittJetztSenden(); location.href = "../modul-1-3/"; return; } go(S.step + 1); };
$("#back").onclick = () => go(S.step - 1);
if (S.step > 0 && !kurscodeOk(S.kurscode)) S.step = 0;
render();

</script>
