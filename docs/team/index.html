	// Team-Übersicht: Soll und Ist je Person, Überstundenkonto, Verlauf der letzten 6 Monate (Admin und freigeschaltete Personen, nur lesen)
	function vTeamStunden(kopf) {
		const admin = istAdmin();
		const T = admin ? { mitglieder: D.mitglieder || [], zeiten: D.zeiten || [], abrechnung: D.abrechnung || [] } : (D.team_stunden || { mitglieder: [], zeiten: [], abrechnung: [] });
		const ym = ymPlus(ymJetzt(), moOff), laufend = moOff === 0;
		const verlauf = []; for (let i = 5; i >= 0; i--) verlauf.push(ymPlus(ym, -i));
		const L = T.mitglieder.filter(m => m.typ !== 'agent' && m.status !== 'gesperrt').map(m => {
			const imMonat = T.zeiten.filter(z => z.mitglied_id === m.mitglied_id && String(z.datum).slice(0, 7) === ym);
			const offen = imMonat.filter(z => z.status !== 'freigegeben').length;
			if (!hatVertrag(m)) return { m, vertrag: false, ist: minSumme(imMonat), offen, spark: verlauf.map(v => ({ v, ist: minSumme(T.zeiten.filter(z => z.mitglied_id === m.mitglied_id && String(z.datum).slice(0, 7) === v)), soll: 0 })) };
			const rr = zeitkontoRechnen(m, T.zeiten, T.abrechnung, ym);
			const mo = rr.monate.find(x => x.monat === ym);
			const ist = mo ? mo.gearbeitet : minSumme(imMonat);
			const konto = mo ? (laufend && !mo.abgeschlossen ? mo.konto_vorher + Math.max(0, mo.gearbeitet - rr.soll) : mo.konto_nachher) : rr.start;
			const spark = verlauf.map(v => { const x = rr.monate.find(y => y.monat === v); return { v, ist: x ? x.gearbeitet : minSumme(T.zeiten.filter(z => z.mitglied_id === m.mitglied_id && String(z.datum).slice(0, 7) === v)), soll: x ? x.soll : 0 }; });
			return { m, vertrag: true, soll: rr.soll, ist, konto, offen, abgeschlossen: !!(mo && mo.abgeschlossen), vorAb: !mo, spark };
		}).sort((a, b) => (b.vertrag - a.vertrag) || a.m.name.localeCompare(b.m.name));
		const mitV = L.filter(x => x.vertrag);
		const sSoll = mitV.reduce((s, x) => s + x.soll, 0), sIst = L.reduce((s, x) => s + x.ist, 0), sKonto = mitV.reduce((s, x) => s + x.konto, 0), sOffen = L.reduce((s, x) => s + x.offen, 0);
		const skala = Math.max(1, ...L.map(x => Math.max(x.ist, x.soll || 0))) * 1.08;
		const kMax = Math.max(60, ...mitV.map(x => Math.abs(x.konto)));
		const sMax = Math.max(60, ...L.flatMap(x => x.spark.map(y => Math.max(y.ist, y.soll))));
		const MK = MONATE.map(n => n.slice(0, 3));
		const zeile = x => {
			const m = x.m, pct = v => Math.round(v / skala * 1000) / 10;
			const balken = x.vertrag
				? '<div class="sib" title="Ist ' + std(x.ist) + ' von Soll ' + std(x.soll) + '"><i style="width:' + pct(Math.min(x.ist, x.soll)) + '%"></i>' + (x.ist > x.soll ? '<i class="ue" style="left:' + pct(x.soll) + '%;width:' + pct(x.ist - x.soll) + '%;border-radius:0 7px 7px 0"></i>' : '') + '<em style="left:calc(' + pct(x.soll) + '% - 1px)"></em></div>' +
					'<div class="sil"><span><b style="color:var(--ink)">' + stdZ(x.ist) + '</b> von ' + stdZ(x.soll) + ' Std' + (x.vorAb ? ' · vor Abrechnungsbeginn' : '') + '</span><span>' + (x.ist >= x.soll ? '<b style="color:var(--green)">' + stdPM(x.ist - x.soll) + '</b>' : 'noch ' + std(x.soll - x.ist)) + '</span></div>'
				: '<div class="sib"><i style="width:' + pct(x.ist) + '%;background:var(--mut);opacity:.45"></i></div><div class="sil"><span><b style="color:var(--ink)">' + std(x.ist) + '</b> gearbeitet</span><span>kein Vertrag eingetragen</span></div>';
			const kw = x.vertrag ? Math.round(Math.abs(x.konto) / kMax * 50 * 10) / 10 : 0;
			const kto = x.vertrag
				? '<div class="kto ' + (x.konto > 0 ? 'plus' : x.konto < 0 ? 'minus' : '') + '">' + stdPM(x.konto) + '</div><div class="kbar"><em></em><i style="' + (x.konto >= 0 ? 'left:50%;background:var(--green)' : 'right:50%;background:var(--red)') + ';width:' + kw + '%"></i></div><div class="small muted" style="margin-top:4px">Überstundenkonto' + (laufend ? ' heute' : ' Monatsende') + '</div>'
				: '<div class="kto muted">–</div><div class="small muted">kein Konto</div>';
			const spark = '<div class="spark" title="Ist je Monat, gestrichelt: Soll">' + x.spark.map(y => '<span class="' + (!y.ist ? 'leer' : y.soll && y.ist > y.soll ? 'ue' : '') + '" style="height:' + Math.max(4, Math.round(y.ist / sMax * 100)) + '%" title="' + monatName(y.v) + ': ' + std(y.ist) + (y.soll ? ' von ' + std(y.soll) : '') + '"></span>').join('') +
				(x.vertrag ? '<hr style="bottom:' + Math.round(x.soll / sMax * 100) + '%">' : '') + '</div><div class="sparkl">' + x.spark.map(y => '<span>' + MK[Number(y.v.slice(5)) - 1] + '</span>').join('') + '</div>';
			return '<div class="tst' + (admin ? ' click" data-tp="' + esc(m.mitglied_id) + '"' : '"') + '><div class="nm">' + av(m.mitglied_id) + ' <b style="display:inline">' + esc(m.name) + '</b><span style="display:block">' + (x.vertrag ? stdZ(x.soll) + ' Std/Monat laut Vertrag' : 'ohne Vertragsstunden') +
				(x.offen ? ' · <span style="color:var(--orange)">' + x.offen + ' nicht freigegeben</span>' : x.abgeschlossen ? ' · abgeschlossen' : '') + '</span></div><div class="sibw">' + balken + '</div><div>' + kto + '</div><div>' + spark + '</div></div>';
		};
		let html = kopf + '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px"><div class="weeknav"><button class="btn sec" id="mop" aria-label="Voriger Monat">‹</button><b>Team · ' + monatName(ym) + '</b><button class="btn sec" id="mon" aria-label="Nächster Monat"' + (moOff >= 0 ? ' disabled' : '') + '>›</button>' + (moOff ? '<button class="btn ghost" id="moh">Dieser Monat</button>' : '') + '</div>' +
			(admin ? '' : '<span class="small muted">Nur Ansicht. Freigaben macht Timo.</span>') + '</div>' +
			'<div class="mstat"><div><b>' + stdZ(sIst) + ' Std</b><span>Ist im Team' + (sSoll ? ' · Soll ' + stdZ(sSoll) + ' Std' : '') + '</span></div>' +
			'<div><b style="color:' + (sKonto > 0 ? 'var(--green)' : sKonto < 0 ? 'var(--red)' : 'var(--ink)') + '">' + stdPM(sKonto) + '</b><span>Überstundenkonten zusammen</span></div>' +
			'<div><b style="color:' + (sOffen ? 'var(--orange)' : 'var(--ink)') + '">' + sOffen + '</b><span>Einträge noch nicht freigegeben</span></div></div>' +
			'<div class="leg"><span><i style="background:var(--acc)"></i>Ist bis Soll</span><span><i style="background:var(--green)"></i>Über Soll</span><span><i style="background:var(--ink);width:2px"></i>Soll laut Vertrag</span><span>Rechts: Ist der letzten 6 Monate, gestrichelt das Soll</span></div>' +
			(L.length ? L.map(zeile).join('') : '<p class="empty">Keine Personen gefunden.</p>') +
			(laufend ? '<p class="small muted" style="margin-top:10px">Im laufenden Monat zählen Überstunden sofort aufs Konto. Fehlende Stunden werden erst am Monatsende abgezogen.</p>' : '') + '</div>';
		$('#main').innerHTML = html;
		$('#mop').onclick = () => { moOff--; vZeit(); };
		$('#mon').onclick = () => { if (moOff < 0) { moOff++; vZeit(); } };
		const h = $('#moh'); if (h) h.onclick = () => { moOff = 0; vZeit(); };
		document.querySelectorAll('[data-tp]').forEach(r => r.onclick = () => { zPerson = r.dataset.tp; zAns = 'monat'; ls.set('mt-zans', zAns); vZeit(); window.scrollTo(0, 0); });
	}

	// Monatsübersicht und Monatsnachweis
	function vMonat(kopf) {
		const admin = istAdmin();
		if (!zPerson || !admin) zPerson = D.ich.mitglied_id;
		const p = mitglied(zPerson);
		const ym = ymPlus(ymJetzt(), moOff), laufend = moOff === 0;
		const E = (D.zeiten || []).filter(z => z.mitglied_id === zPerson && String(z.datum).slice(0, 7) === ym).sort((a, b) => (a.datum + a.von).localeCompare(b.datum + b.von));

		const mo = rr.monate.find(x => x.monat === ym);
		const vorAb = E.filter(z => z.datum < rr.ab);
		const wochen = []; E.forEach(z => { let w = wochen.find(x => x.kw === z.kw); if (!w) wochen.push(w = { kw: z.kw, E: [] }); w.E.push(z); });
		const menschen = (D.mitglieder || []).filter(m => m.typ !== 'agent' && m.status !== 'gesperrt');
		let html = kopf + '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px"><div class="weeknav"><button class="btn sec" id="mop" aria-label="Voriger Monat">‹</button><b>' + monatName(ym) + '</b><button class="btn sec" id="mon" aria-label="Nächster Monat"' + (moOff >= 0 ? ' disabled' : '') + '>›</button>' + (moOff ? '<button class="btn ghost" id="moh">Dieser Monat</button>' : '') + '</div>' +

		if (hatVertrag(p) && mo) {
			const diff = mo.gearbeitet - mo.ausgezahlt;
			html += '<div class="mstat"><div><b>' + stdZ(mo.gearbeitet) + ' von ' + stdZ(mo.soll) + ' Std</b><span>gearbeitet' + (vorAb.length ? ' ab ' + fmtD(rr.ab) + ' · dazu ' + std(minSumme(vorAb)) + ' davor, die schon aufs Konto zählen' : '') + '</span></div>' +
				'<div><b>' + std(mo.ausgezahlt) + '</b><span>' + (mo.abgeschlossen ? 'ausgezahlt' : laufend ? 'Auszahlung, Stand heute' : 'auszuzahlen') + '</span></div>' +
				'<div><b>' + stdPM(diff) + '</b><span>' + (diff >= 0 ? 'aufs Überstundenkonto' : 'vom Überstundenkonto') + '</span></div>' +
				'<div><b>' + stdPM(mo.konto_vorher) + ' → ' + stdPM(mo.konto_nachher) + '</b><span>Überstundenkonto Monatsanfang → Monatsende</span></div></div>' +
				(mo.gearbeitet + mo.konto_vorher < mo.soll && !laufend ? '<div class="note warn" style="margin-bottom:10px">Gearbeitete Stunden und Guthaben reichen nicht für ' + std(mo.soll) + '. Ausgezahlt werden ' + std(mo.ausgezahlt) + '.</div>' : '');
		} else if (hatVertrag(p) && !mo) {

		} else {
			html += '<div class="mstat"><div><b>' + std(W) + '</b><span>gearbeitet in ' + monatName(ym) + '</span></div></div>' + (p.mitglied_id === D.ich.mitglied_id || admin ? '' : '');
		}
		const offen = E.filter(z => z.status !== 'freigegeben').length;
		html += (mo && mo.abgeschlossen ? '<div class="note" style="margin-bottom:10px">Monat abgeschlossen am ' + fmtD(String(mo.abschluss.erstellt || '').slice(0, 10)) + '. Der Monatsnachweis ist fertig für das Lohnbüro.</div>' :
			offen && !laufend ? '<div class="note warn" style="margin-bottom:10px">' + offen + ' Eintrag/Einträge noch nicht von Timo freigegeben. Der Monatsnachweis ist bis dahin vorläufig.</div>' : '') +
			'<div class="dlgbtns" style="justify-content:flex-start;margin:0 0 6px"><button class="btn sec" id="mpdf">Monatsnachweis als PDF</button>' +
			(admin && hatVertrag(p) && !laufend && mo && !mo.abgeschlossen ? '<button class="btn" id="mabs"' + (offen ? ' disabled title="Erst alle Einträge freigeben"' : '') + '>Monat abschließen</button>' : '') +
			(admin && mo && mo.abgeschlossen ? '<button class="btn danger" id="mauf">Abschluss aufheben</button>' : '') + '</div>';
		html += wochen.length ? wochen.map(w => '<div class="wkhead"><span>KW ' + esc(w.kw.slice(-2)) + '</span><span>' + std(minSumme(w.E)) + '</span></div>' + w.E.map(z => zeitRow(z)).join('')).join('') +
			'<div class="wkhead" style="border-bottom:0;color:var(--ink);font-size:15px"><span>Summe ' + monatName(ym) + '</span><span>' + std(W) + '</span></div>' : '<p class="empty">Keine Einträge in diesem Monat.</p>';

		$('#main').innerHTML = html;

	}

	// PDF: Arbeitszeitnachweis für das Lohnbüro
	let jspdfP = null;
	const ladeJsPdf = () => jspdfP || (jspdfP = new Promise((ok, no) => {
		const s = document.createElement('script'); s.src = KONFIG.adressen.jspdf;
		s.onload = () => window.jspdf ? ok(window.jspdf.jsPDF) : no(new Error('PDF-Werkzeug fehlt.'));
		s.onerror = () => { jspdfP = null; no(new Error('Das PDF-Werkzeug konnte nicht geladen werden. Bitte gleich noch einmal versuchen.')); };
		document.head.appendChild(s);
	}));
	async function monatsPdf(mid, ym) {
		const JsPDF = await ladeJsPdf();
		const p = mitglied(mid);
		const E = (D.zeiten || []).filter(z => z.mitglied_id === mid && String(z.datum).slice(0, 7) === ym).sort((a, b) => (a.datum + a.von).localeCompare(b.datum + b.von));
		const W = minSumme(E);
		const rr = zeitkontoRechnen(p, D.zeiten, D.abrechnung, ym);
		const mo = rr.monate.find(x => x.monat === ym);
		const offen = E.filter(z => z.status !== 'freigegeben').length;
		const doc = new JsPDF({ unit: 'mm', format: 'a4' });
		const L = 15, R = 195;
		const kopf = () => {
			doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(110);
			[[L, 'Datum'], [37, 'Beginn'], [51, 'Ende'], [64, 'Pause'], [78, 'Stunden'], [96, 'Tätigkeit / Projekt'], [R, 'Status']].forEach(([x, t]) => doc.text(t, x, y, x === R ? { align: 'right' } : undefined));
			y += 2; doc.setDrawColor(200); doc.line(L, y, R, y); y += 5; doc.setFont('helvetica', 'normal'); doc.setTextColor(20);
		};
		let y = 18;
		doc.setFont('helvetica', 'bold'); doc.setFontSize(17); doc.setTextColor(20, 18, 58);
		doc.text('Arbeitszeitnachweis ' + monatName(ym), L, y); y += 7;
		doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(60);
		doc.text('Momentum KI Akademie', L, y); doc.text('Erstellt am ' + fmtD(ymd(new Date())), R, y, { align: 'right' }); y += 5;
		doc.text('Mitarbeiter/in: ' + p.name, L, y); if (hatVertrag(p)) doc.text('Vertrag: ' + std(Math.round(Number(p.vertrag_std) * 60)) + ' pro Monat', R, y, { align: 'right' }); y += 9;
		kopf();
		doc.setFontSize(9.5);
		E.forEach(z => {
			const t = doc.splitTextToSize(String(z.taetigkeit || '') + (z.projekt ? ' (' + z.projekt + ')' : ''), 76).slice(0, 3);
			const hoehe = Math.max(1, t.length) * 4.3 + 2;
			if (y + hoehe > 275) { doc.addPage(); y = 18; kopf(); doc.setFontSize(9.5); }
			const d = dDate(z.datum);
			doc.text(d ? d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' }) : '', L, y);
			doc.text(String(z.von || ''), 37, y); doc.text(String(z.bis || ''), 51, y); doc.text(z.pause_min ? z.pause_min + ' min' : '–', 64, y);

	// Auftrag im KI Office anlegen (Agent medien-cutter, Projekt „Social Media“). Startfreigabe-Regeln greifen wie überall.
	async function cutterAuftrag(u) {
		if (!u) throw new Error('Upload nicht gefunden.');
		const r = await officeApi('auftrag_starten', { agent_id: 'medien-cutter', projekt: 'Social Media', auftrag: cutterText(u), idempotenzschluessel: 'upload-' + u.upload_id,
			eingabe: { upload_id: u.upload_id, bucket: u.bucket || 'medien-roh', pfad: u.pfad || null, dateiname: u.dateiname, mime: u.mime || null, thema: u.thema, kanal: u.kanal, kontext: u.kontext || '', stil: 'momentum' } });
		await socialApi('upload_status', { upload_id: u.upload_id, status: 'beauftragt', run_id: r.run_id });
		return r.status === 'wartet_freigabe' ? 'Auftrag angelegt, wartet auf Timos Freigabe im KI Office.' : 'Auftrag an den Medien-Cutter angelegt.';
	}
	// Datei mit der signierten Adresse direkt in den Bucket laden (PUT, mit Fortschritt). Kein Supabase-Schlüssel im Browser.
	function dateiHochladen(url, datei, mime, fortschritt) {
		return new Promise((ok, nein) => {
			const x = new XMLHttpRequest();
			x.open('PUT', url, true);
			x.setRequestHeader('Content-Type', mime || datei.type || 'application/octet-stream');
			x.setRequestHeader('x-upsert', 'false');
			x.upload.onprogress = ev => { if (ev.lengthComputable && fortschritt) fortschritt(ev.loaded / ev.total); };
			x.onload = () => x.status >= 200 && x.status < 300 ? ok() : nein(new Error('Upload abgelehnt (' + x.status + ').' + (x.status === 400 || x.status === 403 ? ' Die Upload-Adresse ist abgelaufen oder die Datei passt nicht. Bitte noch einmal versuchen.' : '')));
			x.onerror = () => nein(new Error('Upload abgebrochen (Netz). Bitte noch einmal versuchen.'));
			x.send(datei);
		});
	}

	function bars(list, color) {

	}

			(k.namen_sichtbar ? '<div class="card"><h2>Teilnehmende</h2><div class="tablewrap"><table><tr><th>Name</th><th>Modul</th><th>Fortschritt</th><th>Schritt</th><th>Check</th><th>Zuletzt aktiv</th></tr>' +
				((k.liste || []).map(t => '<tr><td><b>' + esc(t.name) + '</b>' + (t.code_falsch ? ' <span class="chip" style="background:#FFF4E5" title="Falscher Kurscode eingegeben">Kurscode „' + esc(t.kurscode) + '“</span>' : '') + '<br><span class="small muted">' + esc(t.email || '') + '</span></td><td>' + esc(t.kurs) + '</td><td><div class="prog"><i style="width:' + (Number(t.fortschritt) || 0) + '%"></i></div>' + esc(t.fortschritt) + ' %</td><td>' + esc(t.schritt || '–') + '</td><td>' + esc(t.check) + '</td><td>' + fmtDT(t.zuletzt) + '</td></tr>').join('') || '<tr><td colspan="6" class="muted">Noch keine Teilnehmenden.</td></tr>') + '</table></div></div>' +

	// ---------- Teilnehmer-Register (nur Timo und Dozenten): eine Zeile je Teilnehmer, eine Spalte je Punkt ----------
	let TN = null;

	const TN_WERT = { '': 'offen', ja: 'erledigt', entfaellt: 'entfällt' };
	const tnNaechster = w => w === 'ja' ? 'entfaellt' : w === 'entfaellt' ? '' : 'ja';
	const tnDatumDe = d => /^\d{4}-\d{2}-\d{2}$/.test(String(d || '')) ? d.split('-').reverse().join('.') : '';
	function tnLaden() { return api('teilnehmer', {}).then(r => { TN = r; return r; }); }
	function tnZeigen() {

			box.innerHTML = '<div class="card"><h2>Teilnehmer-Register</h2><p class="small muted">Wird geladen …</p></div>';
			tnLaden().then(tnZeigen).catch(e => { if ($('#tnBox')) $('#tnBox').innerHTML = '<div class="card"><h2>Teilnehmer-Register</h2><p class="small muted">' + esc(e.message) + '</p></div>'; });

		}
		const SP = (TN.spalten || []).filter(x => x.aktiv);

			(!such || [t.name, t.massnahme, t.email].join(' ').toLowerCase().includes(such)));

			const titel = x.titel + ': ' + TN_WERT[w] + (h.d ? ' am ' + tnDatumDe(h.d) : '') + (h.von ? ' (' + (mitglied(h.von).name || h.von) + ')' : '') + '. Klicken: ' + TN_WERT[tnNaechster(w)];

		};

		box.innerHTML = '<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start"><div><h2 style="margin:0">Teilnehmer-Register</h2>' +
			'<p class="small muted" style="margin:4px 0 0">Klick in ein Feld: offen → ✓ erledigt (mit Datum) → – entfällt → offen. Nur für Timo und die Dozenten sichtbar.</p></div>' +
			'<span style="display:flex;gap:8px;flex-wrap:wrap">' + (istAdmin() ? '<button class="btn sec" id="tn_sp">Spalten verwalten</button>' : '') + '<button class="btn" id="tn_neu">+ Teilnehmer</button></span></div>' +
			'<div class="tools" style="margin:12px 0 8px;display:flex;gap:8px;flex-wrap:wrap"><input id="tn_such" type="search" placeholder="Name, Maßnahme oder E-Mail suchen" value="' + esc(tnF.such) + '" style="flex:1;min-width:180px">' +
			'<select id="tn_st" aria-label="Status">' + [['laufend', 'Interessenten und aktive'], ['alle', 'Alle'], ['interessent', 'Interessenten'], ['aktiv', 'Aktive'], ['abgeschlossen', 'Abgeschlossene'], ['abgebrochen', 'Abgebrochene']].map(([v, l]) => '<option value="' + v + '"' + (v === tnF.status ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>' +
			(L.length ? '<div class="tablewrap"><table class="tntab"><tr><th>Teilnehmer</th>' + SP.map(x => '<th style="text-align:center">' + esc(x.titel) + '</th>').join('') + '<th>Stand</th><th></th></tr>' +
				L.map(t => '<tr><td><b>' + esc(t.name) + '</b><br><span class="small muted">' + esc([t.massnahme, TN_STATUS[t.status] || t.status, t.start ? 'ab ' + tnDatumDe(t.start) : ''].filter(Boolean).join(' · ')) + '</span>' + (t.notiz ? ' <span title="' + esc(t.notiz) + '">📝</span>' : '') + '</td>' +
					SP.map(x => zelle(t, x)).join('') + '<td class="small">' + fertig(t) + '/' + SP.length + '</td><td><button class="btn ghost" data-tned="' + esc(t.tn_id) + '">Bearbeiten</button></td></tr>').join('') + '</table></div>'
				: '<p class="muted">' + ((TN.teilnehmer || []).length ? 'Keine Teilnehmer passen zum Filter.' : 'Noch keine Teilnehmer eingetragen. Mit „+ Teilnehmer“ legst du den ersten an.') + '</p>') + '</div>';

		$('#tn_st').onchange = ev => { tnF.status = ev.target.value; ls.set('mt-tnstatus', tnF.status); tnZeigen(); };

		box.querySelectorAll('[data-tned]').forEach(b => b.onclick = () => tnDialog(TN.teilnehmer.find(t => t.tn_id === b.dataset.tned)));

		});

	// ---------- Tresor: vertrauliche Texte mit Schlüssel ver- und entschlüsseln, nur im Browser ----------
	// Verfahren: AES-256-GCM, Schlüssel per PBKDF2-SHA-256 (600.000 Runden, 16 Byte Salz) aus dem Schlüsselwort. Format: MKT1.<base64url(Salz | IV | Geheimtext)>.
	// Nichts wird gesendet oder gespeichert. Kurts FracEncoder kann als zweites Verfahren dazukommen, sobald es eine Kommandozeilen-Version gibt.
	const TRESOR = { kopf: 'MKT1.', runden: 600000, minLaenge: 10, leerenNach: 5 * 60 * 1000 };
	const b64uAn = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
	const b64uAb = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
	async function tresorSchluessel(wort, salz) {
		const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(wort), 'PBKDF2', false, ['deriveKey']);
		return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: salz, iterations: TRESOR.runden }, basis, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
	}
	async function tresorVer(text, wort) {
		const salz = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
		const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await tresorSchluessel(wort, salz), new TextEncoder().encode(text)));
		const alles = new Uint8Array(28 + ct.length); alles.set(salz, 0); alles.set(iv, 16); alles.set(ct, 28);
		return TRESOR.kopf + b64uAn(alles);
	}
	async function tresorEnt(paket, wort) {
		const s = String(paket || '').replace(/\s+/g, '');
		if (!s.startsWith(TRESOR.kopf)) throw new Error('Das ist kein Tresor-Text. Er beginnt immer mit ' + TRESOR.kopf);
		let u = null; try { u = b64uAb(s.slice(TRESOR.kopf.length)); } catch (e) { u = null; }
		if (!u || u.length < 28 + 16) throw new Error('Der Tresor-Text ist unvollständig. Bitte komplett kopieren.');
		try { return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.subarray(16, 28) }, await tresorSchluessel(wort, u.subarray(0, 16)), u.subarray(28))); }
		catch (e) { throw new Error('Entschlüsseln hat nicht geklappt: Schlüssel falsch oder Text verändert.'); }
	}
	function vTresor() {
		clearTimeout(vTresor.t);
		const ok = !!(window.crypto && crypto.subtle);
		$('#main').innerHTML = '<h1>Tresor</h1><p class="sub">Passwörter und andere vertrauliche Texte verschlüsselt austauschen. Alles passiert in deinem Browser: Text und Schlüssel verlassen dieses Gerät nicht und werden nirgends gespeichert.</p>' +
			(ok ? '' : '<div class="note warn">Dein Browser kann hier nicht verschlüsseln. Bitte das Portal über https öffnen oder einen aktuellen Browser nehmen.</div>') +
			'<div class="card"><div class="f"><label for="tr_ein">Eingabe</label><textarea id="tr_ein" rows="5" maxlength="60000" spellcheck="false" autocomplete="off" placeholder="Zum Verschlüsseln: Passwort oder Text. Zum Entschlüsseln: den Tresor-Text (beginnt mit ' + TRESOR.kopf + ')"></textarea></div>' +
			'<div class="f"><label for="tr_key">Schlüssel</label><div style="display:flex;gap:6px"><input id="tr_key" type="password" autocomplete="off" spellcheck="false" placeholder="Vorher abgesprochen, mindestens ' + TRESOR.minLaenge + ' Zeichen"><button class="btn sec" id="tr_zeigen" type="button" aria-pressed="false">Anzeigen</button></div></div>' +
			'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="btn" id="tr_enc"' + (ok ? '' : ' disabled') + '>Verschlüsseln</button><button class="btn sec" id="tr_dec"' + (ok ? '' : ' disabled') + '>Entschlüsseln</button></div>' +
			'<div class="f"><label for="tr_aus">Ausgabe</label><textarea id="tr_aus" rows="5" readonly spellcheck="false"></textarea></div>' +
			'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn sec" id="tr_kopie">Ausgabe kopieren</button><button class="btn ghost" id="tr_leer">Alles leeren</button><span class="small muted" id="tr_msg" role="status" aria-live="polite"></span></div></div>' +
			'<div class="card"><h2>So tauschst du ein Passwort sicher aus</h2><ol class="small" style="margin:0;padding-left:20px;line-height:1.6">' +
			'<li>Den Schlüssel vorher auf einem <b>anderen Weg</b> absprechen, z. B. am Telefon oder persönlich. Nie im selben Kanal schicken wie den verschlüsselten Text.</li>' +
			'<li>Passwort oben eingeben, Schlüssel eintragen, <b>Verschlüsseln</b>. Den Tresor-Text (beginnt mit ' + TRESOR.kopf + ') per Mail, Messenger oder Portal-Kommentar schicken.</li>' +
			'<li>Die andere Person fügt ihn hier ein, gibt denselben Schlüssel ein und klickt <b>Entschlüsseln</b>.</li></ol>' +
			'<p class="small muted" style="margin:10px 0 0">Gut sind vier zufällige Wörter oder mindestens ' + TRESOR.minLaenge + ' Zeichen. Die Felder leeren sich nach 5 Minuten ohne Eingabe von selbst. Ein kopierter Text bleibt in der Zwischenablage, bis du etwas anderes kopierst. Verfahren: AES-256-GCM, Schlüssel per PBKDF2 mit 600.000 Runden.</p></div>' +
			'<div class="card"><h2>FracEncoder</h2><p class="small muted" style="margin:0">Kurts FracEncoder lässt sich bisher nur über seine Bedienoberfläche nutzen. Sobald es eine Kommandozeilen-Version gibt, kann er hier als zweites Verfahren dazukommen, über ein kleines Hilfsprogramm auf dem jeweiligen Rechner.</p></div>';
		const ein = $('#tr_ein'), key = $('#tr_key'), aus = $('#tr_aus'), knoepfe = [$('#tr_enc'), $('#tr_dec')];
		const msg = t => { $('#tr_msg').textContent = t; };
		const leeren = () => { ein.value = ''; key.value = ''; aus.value = ''; };
		const wecker = () => { clearTimeout(vTresor.t); vTresor.t = setTimeout(() => { if ($('#tr_ein') === ein) { leeren(); msg('Felder nach 5 Minuten geleert.'); } }, TRESOR.leerenNach); };
		[ein, key].forEach(e => e.addEventListener('input', wecker));
		$('#tr_zeigen').onclick = ev => { const an = key.type === 'password'; key.type = an ? 'text' : 'password'; ev.currentTarget.textContent = an ? 'Verbergen' : 'Anzeigen'; ev.currentTarget.setAttribute('aria-pressed', String(an)); };
		const lauf = async (warte, fn) => { knoepfe.forEach(b => b.disabled = true); msg(warte); try { await fn(); } finally { knoepfe.forEach(b => b.disabled = false); wecker(); } };
		$('#tr_enc').onclick = () => {
			if (!ein.value) return msg('Bitte erst den Text eingeben, der verschlüsselt werden soll.');
			if (ein.value.trim().startsWith(TRESOR.kopf)) return msg('Das ist schon ein Tresor-Text. Zum Lesen auf „Entschlüsseln“ klicken.');
			if (key.value.length < TRESOR.minLaenge) return msg('Der Schlüssel braucht mindestens ' + TRESOR.minLaenge + ' Zeichen.');
			lauf('Verschlüssele …', async () => { aus.value = await tresorVer(ein.value, key.value); msg('Fertig. Ausgabe kopieren und verschicken, den Schlüssel auf anderem Weg.'); });
		};
		$('#tr_dec').onclick = () => {
			if (!ein.value.trim()) return msg('Bitte erst den Tresor-Text einfügen.');
			if (!key.value) return msg('Bitte den Schlüssel eingeben.');
			lauf('Entschlüssele …', async () => { try { aus.value = await tresorEnt(ein.value, key.value); msg('Entschlüsselt.'); } catch (e) { aus.value = ''; msg(e.message); } });
		};
		$('#tr_kopie').onclick = async () => {
			if (!aus.value) return msg('Die Ausgabe ist noch leer.');
			try { await navigator.clipboard.writeText(aus.value); toast('Ausgabe kopiert'); }
			catch (e) { aus.focus(); aus.select(); msg('Kopieren ging nicht automatisch. Der Text ist markiert, bitte mit Strg+C kopieren.'); }
		};
		$('#tr_leer').onclick = () => { leeren(); clearTimeout(vTresor.t); msg('Alles geleert.'); };
	}

	// ---------- KI Office (eigene Seite unter ../office/, gleicher Token) ----------
	const OFFICE = KONFIG.adressen.office;
	// Das eingebettete Office meldet seine Höhe (gleiche Herkunft; andere Absender werden ignoriert)
	window.addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.typ !== 'ko-hoehe') return; document.querySelectorAll('iframe.offFrame').forEach(f => { if (f.contentWindow === e.source) f.style.height = Math.min(Math.max(Number(e.data.hoehe) || 0, 320), 4000) + 'px'; }); });
	const OFFICE_API = WH.office.url;
	// ---------- Office-API aus dem Portal (gleicher Token) ----------
	// Freigaben, Abnahmen und Rückfragen erscheinen gesammelt in der Box „Für dich“ (fuerDichKarte, fdPruefen).
	function officeApi(aktion, daten) {
		return fetch(OFFICE_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ token: TOKEN, aktion, daten: daten || {} }) })
			.then(r => r.json().then(j => { if (!j || j.ok === false) throw new Error((j && j.fehler) || 'Keine Antwort'); return j; }));
	}
	// Office-Daten einmal je Aufbau der Übersicht laden und zwischen den Karten teilen (Supabase-Datenverkehr sparen).
	let officeCache = null;
	function officeLaden() { if (!officeCache) officeCache = officeApi('laden').catch(e => { officeCache = null; throw e; }); return officeCache; }

	// ---------- „Für dich“ auf der Übersicht ----------
	// Alles, worauf das System bei der angemeldeten Person wartet, an einer Stelle. „Freigabe“ umfasst vier Fälle:
	//   formal  – Freigaben im KI Office (externe Aktionen, Start von Aufträgen; entscheiden darf nur der Admin)
	//   run     – Agenten-Ergebnisse ohne fachliche Abnahme (eigene Aufträge; Admin zusätzlich die von Agenten selbst angelegten)
	//   test    – Portal-Aufgaben im Status „Wird getestet“, die man selbst angelegt hat (Admin: alles, was Agenten bearbeitet haben)
	//   agent   – offene Portal-Aufgaben, die ein Agent einem zugewiesen hat (z. B. „SEO-Beitrag prüfen“, Wächter-Freigaben)
	// Dazu: Rückfragen von Agenten, Erwähnungen (@Vorname, @alle, @team), neu zugewiesene Aufgaben, Änderungen seit „Alles gesehen“.
	// „Zuletzt gesehen“ liegt nur im Browser (localStorage); ohne Eintrag gelten die letzten 3 Tage als neu.
	const FD_FENSTER_TAGE = 14, FD_NEU_TAGE = 3, FD_MAX = 3;
	const fdAufgeklappt = new Set();
	const fdSeit = () => { const s = ls.get('mt-fd-gesehen'); const d = s ? new Date(s) : null; return d && !isNaN(d) ? d : new Date(Date.now() - FD_NEU_TAGE * 864e5); };
	const fdZeit = s => { const d = new Date(s || 0); return isNaN(d) ? 0 : d.getTime(); };
	const fdMensch = id => { const m = (D.mitglieder || []).find(x => x.mitglied_id === id); return !!m && m.typ !== 'agent'; };
	const fdKurz = t => klartext(t).replace(/\[run:[^\]]*\]/g, '').replace(/\s+/g, ' ').trim().slice(0, 160);
	// Gleiche Regeln wie bei den Nachrichten (@Vorname, bei gleichem Vornamen @Vorname Nachname), dazu @alle und @team
	function fdErwaehnt(text, ich) {
	const t = String(text || '');
	return /(^|[^\p{L}\p{N}_])@(alle|team)(?![\p{L}\p{N}_])/iu.test(t) || MsgsList_Global.markierte(t).includes(ich);
	}
	const fdIstBericht = t => /tagesbericht|wochenbericht|lagebericht|monatsbericht/i.test(String(t || '')) && !/frage|freigeb|entscheid/i.test(String(t || ''));
	function fuerDichPunkte(off) {
		const ich = D.ich.mitglied_id, admin = istAdmin(), seit = fdSeit().getTime(), grenze = Date.now() - FD_FENSTER_TAGE * 864e5;
		const A = D.aufgaben || [], V = D.verlauf || [], N = D.notizen || [];
		const aufgabe = id => A.find(a => a.aufgabe_id === id);
		const P = { freigabe: [], frage: [], erwaehnt: [], neu: [], bericht: [], abnahme: [], geaendert: [] };
		const inFreigabe = new Set(), gesehen = new Set();
		// 1) Freigaben aus dem Portal
		for (const a of A) {
			if (a.status === 'Wird getestet' && (a.erstellt_von === ich || (admin && !bearbeiterVon(a).some(fdMensch)))) {
				inFreigabe.add(a.aufgabe_id);
				P.freigabe.push({ typ: 'test', zeit: a.geaendert, titel: a.titel, text: bearbeiterNamen(a) + ' meldet „Wird getestet“', aufgabe: a });
			} else if (a.status !== 'Erledigt' && istBearbeiter(a, ich) && a.erstellt_von && !fdMensch(a.erstellt_von) && (D.mitglieder || []).some(m => m.mitglied_id === a.erstellt_von)) {
				inFreigabe.add(a.aufgabe_id);
				const hatLink = /https?:\/\//.test(String(a.beschreibung || ''));
				// Reine Berichte („Tagesbericht“, „Wochenbericht“ … ohne Frage oder Freigabe im Titel) nur zur Kenntnis, nicht als Freigabe
				if (fdIstBericht(a.titel)) P.bericht.push({ typ: 'bericht', zeit: a.erstellt, titel: a.titel, text: 'von ' + mitglied(a.erstellt_von).name + ' · zur Kenntnis', aufgabe: a });
				else P.freigabe.push({ typ: 'agent', zeit: a.erstellt, titel: a.titel, text: 'von ' + mitglied(a.erstellt_von).name + (hatLink ? ' · mit Vorschau-Link' : ''), aufgabe: a, wichtig: /prüfen|freigeb|frage|entscheid/i.test(a.titel) });
			}
		}
		// 2) Freigaben und Rückfragen aus dem KI Office
		if (off) {
			const reg = id => (off.agenten || []).find(g => g.agent_id === id) || {};
			const runVon = id => (off.runs || []).find(r => r.run_id === id) || {};
			for (const f of (off.freigaben || [])) {
				if (f.status !== 'offen') continue;
				const r = runVon(f.run_id);
				if (!admin && r.auftraggeber !== ich) continue;
				const start = f.aktion === 'auftrag_start', ext = (off.externe_aktionen || {})[f.aktion] || { text: f.aktion };
				P.freigabe.push({ typ: 'formal', zeit: f.angefordert_am, titel: (start ? 'Auftrag starten: ' : ext.text + ': ') + (reg(r.agent_id).name || r.agent_id || '–'), text: 'von ' + mitglied(f.angefordert_von).name + ' · ' + fdKurz(f.inhalt_vorschau || r.auftrag), freigabe: f, run: r });
			}
			for (const r of (off.runs || [])) {
				const meins = r.auftraggeber === ich || (admin && !fdMensch(r.auftraggeber));
				if (!meins) continue;
				if (r.status === 'wartet_rueckmeldung') {
					const f = (off.ereignisse || []).filter(e => e.run_id === r.run_id && e.art === 'rueckfrage').pop();
					P.frage.push({ typ: 'frage', zeit: f ? f.zeit : (r.lebenszeichen || r.erstellt), titel: (reg(r.agent_id).name || r.agent_id) + ' fragt', text: f ? f.titel : fdKurz(r.auftrag), run: r, frage: f ? f.titel : '' });
				}
				// Teilaufträge eines Teams werden über den Eltern-Run abgenommen, nicht einzeln
				if (r.status === 'abgeschlossen' && r.abgenommen == null && !r.eltern_run_id && fdZeit(r.beendet || r.erstellt) >= grenze)
					P.abnahme.push({ typ: 'run', zeit: r.beendet || r.erstellt, titel: (reg(r.agent_id).name || r.agent_id) + ': ' + fdKurz(r.auftrag).slice(0, 80), text: 'Ergebnis abnehmen · ' + (fdKurz(r.zusammenfassung || '') || 'Ergebnis liegt vor'), run: r });
			}
		}
		// 3) Erwähnungen (ohne Aufgaben, die schon unter Freigabe stehen)
		for (const v of V) {
			if (v.art === 'status' || v.autor === ich || fdZeit(v.erstellt) < grenze || inFreigabe.has(v.aufgabe_id) || !fdErwaehnt(v.text, ich)) continue;
			const a = aufgabe(v.aufgabe_id); if (!a) continue;
			gesehen.add(v.aufgabe_id + '|' + v.erstellt);
			P.erwaehnt.push({ typ: 'aufgabe', zeit: v.erstellt, titel: a.titel, text: mitglied(v.autor).name + ': ' + fdKurz(v.text), aufgabe: a });
		}
		for (const a of A) if (!inFreigabe.has(a.aufgabe_id) && a.erstellt_von !== ich && a.status !== 'Erledigt' && fdZeit(a.geaendert) >= grenze && fdErwaehnt(a.beschreibung, ich))
			P.erwaehnt.push({ typ: 'aufgabe', zeit: a.geaendert, titel: a.titel, text: 'in der Beschreibung (' + mitglied(a.erstellt_von).name + ')', aufgabe: a });
		for (const n of N) if ((n.geaendert_von || n.autor) !== ich && fdZeit(n.geaendert) >= grenze && fdErwaehnt(n.inhalt, ich))
			P.erwaehnt.push({ typ: 'notiz', zeit: n.geaendert, titel: n.titel, text: 'Notiz von ' + mitglied(n.geaendert_von || n.autor).name, notiz: n });
		// 4) Neu zugewiesen
		for (const a of A) if (!inFreigabe.has(a.aufgabe_id) && istBearbeiter(a, ich) && a.erstellt_von !== ich && a.status !== 'Erledigt' && fdZeit(a.erstellt) >= seit)
			P.neu.push({ typ: 'aufgabe', zeit: a.erstellt, titel: a.titel, text: 'von ' + mitglied(a.erstellt_von).name + (a.deadline ? ', bis ' + fmtD(a.deadline) : ''), aufgabe: a });
		// 5) Änderungen an eigenen Aufgaben seit dem letzten Besuch (je Aufgabe zusammengefasst)
		const proA = {};
		for (const v of V) {
			if (v.autor === ich || fdZeit(v.erstellt) < seit || inFreigabe.has(v.aufgabe_id) || gesehen.has(v.aufgabe_id + '|' + v.erstellt)) continue;
			const a = aufgabe(v.aufgabe_id); if (!a || (!istBearbeiter(a, ich) && a.erstellt_von !== ich)) continue;
			const x = proA[a.aufgabe_id] || (proA[a.aufgabe_id] = { zeit: v.erstellt, n: 0, letzt: v, a });
			x.n++; if (fdZeit(v.erstellt) >= fdZeit(x.zeit)) { x.zeit = v.erstellt; x.letzt = v; }
		}
		for (const x of Object.values(proA)) P.geaendert.push({ typ: 'aufgabe', zeit: x.zeit, titel: x.a.titel, text: (x.n > 1 ? x.n + ' neue Einträge, zuletzt ' : '') + mitglied(x.letzt.autor).name + ': ' + fdKurz(x.letzt.text), aufgabe: x.a });
		for (const k of Object.keys(P)) { P[k].sort((x, y) => fdZeit(y.zeit) - fdZeit(x.zeit)); P[k].forEach(p => { p.neu = fdZeit(p.zeit) >= seit; }); }
		// Freigaben: formelle Office-Freigaben und Agenten-Aufgaben mit „prüfen/freigeben/Frage“ zuerst, „Wird getestet“ danach
		const rang = p => p.typ === 'formal' ? 0 : (p.typ === 'agent' && p.wichtig) ? 1 : p.typ === 'agent' ? 2 : 3;
		P.freigabe.sort((x, y) => rang(x) - rang(y) || fdZeit(y.zeit) - fdZeit(x.zeit));
		return P;
	}
	function fuerDichKarte() {
		const el = $('#fuerDich'); if (!el || !D || !D.ich || D.ich.rolle === 'agent') return;
		let punkte = {};
		const zeigen = off => {
			if (!$('#fuerDich')) return;
			const P = fuerDichPunkte(off);
			const T = [['freigabe', '✅ Wartet auf deine Freigabe'], ['frage', '🤖 Agenten fragen dich'], ['erwaehnt', '💬 Du wurdest erwähnt'], ['neu', '📥 Neu für dich'], ['bericht', '📋 Berichte zur Kenntnis'], ['abnahme', '📄 Agenten-Ergebnisse abnehmen'], ['geaendert', '✏️ Geändert seit deinem letzten Besuch']];
			// Die Zahl oben zählt, was wirklich auf dich wartet: Freigaben, Rückfragen und Neues. Berichte und Ergebnis-Abnahmen stehen darunter, ohne die Zahl aufzublähen.
			const offenAnz = P.freigabe.length + P.frage.length + [...P.erwaehnt, ...P.neu, ...P.geaendert].filter(p => p.neu).length;
			punkte = {};
			let nr = 0;
			const zeile = (p, k) => { const id = 'p' + (nr++); punkte[id] = p; return '<button class="fd-z" data-fd="' + id + '"><span class="fd-t">' + (p.neu && ['erwaehnt', 'neu', 'geaendert'].includes(k) ? '<span class="chip fd-neu">neu</span> ' : '') + esc(p.titel) + '</span><span class="small muted">' + esc(p.text) + ' · ' + fmtDT(p.zeit) + '</span></button>'; };
			const teile = T.filter(([k]) => P[k].length).map(([k, l]) => { const alle = fdAufgeklappt.has(k); return '<div class="fd-g' + (k === 'freigabe' ? ' fd-frei' : '') + '"><div class="fd-h">' + l + ' <span class="muted">(' + P[k].length + ')</span></div>' + (alle ? P[k] : P[k].slice(0, FD_MAX)).map(p => zeile(p, k)).join('') + (P[k].length > FD_MAX ? '<button class="btn ghost" style="padding:4px 8px;font-size:12.5px" data-fdmehr="' + k + '">' + (alle ? 'Weniger anzeigen' : (P[k].length - FD_MAX) + ' weitere anzeigen') + '</button>' : '') + '</div>'; });
			$('#fuerDich').innerHTML = '<div class="card fd"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">🔔 Für dich' + (offenAnz ? ' <span class="chip fd-neu">' + offenAnz + '</span>' : '') + '</h2>' +
				'<div style="display:flex;gap:6px;flex-wrap:wrap">' + (teile.length ? '<button class="btn ghost" id="fdGesehen" title="Markiert Erwähnungen, neue Aufgaben und Änderungen als gesehen. Freigaben und Rückfragen bleiben, bis sie erledigt sind.">Alles gesehen ✓</button>' : '') + '<a class="btn ghost" href="' + OFFICE + '#/tab/freigaben">Freigaben im KI Office →</a></div></div>' +
				(teile.length ? teile.join('') : '<p class="empty">Nichts Neues für dich. Schreib @Vorname in einen Kommentar, damit jemand es hier sieht.</p>') +
				(off ? '' : '<p class="small muted" style="margin-top:6px">KI Office wird geladen …</p>') + '</div>';
			$('#fuerDich').querySelectorAll('[data-fd]').forEach(b => b.onclick = () => {
				const p = punkte[b.dataset.fd]; if (!p) return;
				if (p.typ === 'notiz') { offeneNotiz = p.notiz.notiz_id; tab = 'notizen'; ls.set('mt-tab', tab); render(); window.scrollTo(0, 0); }
				else if (p.typ === 'aufgabe') aufgabeDialog(p.aufgabe);
				else fdPruefen(p, off || {});
			});
			$('#fuerDich').querySelectorAll('[data-fdmehr]').forEach(b => b.onclick = () => { const k = b.dataset.fdmehr; if (fdAufgeklappt.has(k)) fdAufgeklappt.delete(k); else fdAufgeklappt.add(k); zeigen(off); });
			const g = $('#fdGesehen'); if (g) g.onclick = () => { ls.set('mt-fd-gesehen', new Date().toISOString()); zeigen(off); toast('Als gesehen markiert'); };
		};
		zeigen(null);
		officeLaden().then(j => zeigen(j)).catch(() => zeigen({ runs: [], ereignisse: [], agenten: [], freigaben: [] }));
	}

	// Prüfen-Dialog: Inhalt lesen (Beschreibung, Vorschau-Links, verknüpfte Notizen, Verlauf) und direkt entscheiden.
	function fdPruefen(p, off) {
		const admin = istAdmin(), a = p.aufgabe, r = p.run || {}, f = p.freigabe;
		const reg = id => ((off && off.agenten) || []).find(g => g.agent_id === id) || {};
		const artefakte = r.run_id ? ((off && off.artefakte) || []).filter(x => x.run_id === r.run_id) : [];
		const V = a ? (D.verlauf || []).filter(v => v.aufgabe_id === a.aufgabe_id && v.art !== 'status').slice(-5) : [];
		const quellen = [a && a.beschreibung, ...V.map(v => v.text), r.auftrag, r.zusammenfassung, f && f.inhalt_vorschau, p.frage, ...artefakte.map(x => (x.ablageort || '') + ' ' + (x.zusammenfassung || ''))].filter(Boolean).join('\n');
		const links = [...new Set((quellen.match(/https?:\/\/[^\s<>()"'\]]+/g) || []).map(u => u.replace(/[.,;:!?]+$/, '')))].slice(0, 6);
		const titel = new Set();
		for (const m of quellen.matchAll(/\[\[([^\]]+)\]\]/g)) titel.add(m[1].trim().toLowerCase());
		for (const m of quellen.matchAll(/Notiz [„"]([^“”"]+)[“”"]/g)) titel.add(m[1].trim().toLowerCase());
		const notizen = (D.notizen || []).filter(n => titel.has(String(n.titel).trim().toLowerCase())).slice(0, 3);
		const art = { test: 'Aufgabe zum Prüfen', agent: 'Aufgabe von einem Agenten', bericht: 'Bericht eines Agenten (zur Kenntnis)', run: 'Agenten-Ergebnis zum Abnehmen', formal: 'Freigabe im KI Office', frage: 'Rückfrage eines Agenten' }[p.typ] || '';
		let inhalt = '';
		if (a) inhalt += '<div class="md">' + md(a.beschreibung || '_(keine Beschreibung)_') + '</div>';
		if (p.typ === 'run') inhalt += '<p class="small muted" style="margin:0">Auftrag</p><div class="md">' + md(r.auftrag || '') + '</div><p class="small muted" style="margin:10px 0 0">Zusammenfassung des Agenten</p><div class="md">' + md(r.zusammenfassung || '_(keine)_') + '</div>' +
			(artefakte.length ? '<p class="small muted" style="margin:10px 0 0">Ergebnisse</p>' + artefakte.map(x => '<div class="small">📄 <b>' + esc(x.titel) + '</b> [' + esc(x.art) + ']' + (x.ablageort ? ' · ' + esc(x.ablageort) : '') + '</div>').join('') : '');
		if (p.typ === 'formal') inhalt += '<div class="md">' + md(f.inhalt_vorschau || r.auftrag || '') + '</div>';
		if (p.typ === 'frage') inhalt += '<div class="note"><b>Frage:</b> ' + esc(p.frage || '–') + '</div><p class="small muted" style="margin:10px 0 0">Ursprünglicher Auftrag</p><div class="md">' + md(r.auftrag || '') + '</div>';

			const k = ($('#fd_k') ? $('#fd_k').value : '').trim();

		};
		const fn = $('#fd_nein'); if (fn) fn.onclick = () => {
			if (!pflicht()) return;

			else if (p.typ === 'formal') fertig('Abgelehnt', k => officeApi('freigabe_entscheiden', { freigabe_id: f.freigabe_id, entscheidung: 'abgelehnt', begruendung: k }));
		};
	}

			'<div class="card" style="margin-top:14px"><h2>Offene Aufgaben</h2>' + (offen.length ? offen.map(taskRow).join('') : '<p class="empty">Keine offenen Aufgaben.</p>') + '</div>' +
			'<div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><h2 style="margin:0">Akte</h2><button class="btn sec" id="akedit">' + (akte ? 'Akte bearbeiten' : 'Akte anlegen') + '</button></div>' +
				(akte ? '<div class="md" style="margin-top:10px">' + md(akte.inhalt) + '</div><p class="small muted">Zuletzt geändert von ' + esc(mitglied(akte.geaendert_von || akte.autor).name) + ', ' + fmtDT(akte.geaendert) + '</p>' : '<p class="empty">Noch keine Akte. Hier stehen Rolle, Stärken, Einrichtung und Regeln für ' + esc(p.name) + '.</p>') + '</div>' +
			'<div class="card" style="margin-top:14px"><h2>Letzte Berichte und Aktivitäten</h2>' + (V.length ? V.slice(0, 15).map(v => '<div class="vl ' + esc(v.art) + '">' + av(id) + '<div class="vt"><span class="small muted">' + fmtDT(v.erstellt) + ' · <a href="#/aufgabe/' + esc(v.aufgabe_id) + '">' + esc(titelVon(v.aufgabe_id)) + '</a></span>' + (v.art === 'status' ? '<div>' + esc(v.text) + '</div>' : '<div class="md">' + md(v.text) + '</div>') + '</div></div>').join('') : '<p class="empty">Noch keine Aktivität.</p>') + '</div>' +
			(geeignet.length ? '<div class="card" style="margin-top:14px"><h2>Für Agenten geeignet, noch bei Menschen</h2><p class="small muted">Diese Aufgaben könnten Agenten übernehmen. Zum Übergeben öffnen und „Zuständig“ ändern.</p>' + geeignet.sort(sortAufgaben).map(taskRow).join('') + '</div>' : '');
		bindTasks(); bindWikiLinks($('#main'));
		$('#zurueck').onclick = ev => { ev.preventDefault(); agentAkte = null; setzeHash('#/tab/team'); vTeam(); };
		$('#aklink').onclick = () => kopiereLink('#/agent/' + id, 'Akte ' + p.name);
		$('#akedit').onclick = () => akte ? notizDialog(akte) : notizDialog(null, akteTitel(p));
		$('#akneu').onclick = () => { aufgabeDialog(null); $('#a_v').value = id; $('#a_ki').checked = true; };
	}
	function profilDialog() {
		const i = D.mitglieder.find(p => p.mitglied_id === D.ich.mitglied_id) || D.ich;
		$('#dlgInner').innerHTML = '<h2>Meine Daten</h2><form id="mf"><div class="f"><label for="m_e">E-Mail-Adresse</label><input id="m_e" type="email" required value="' + esc(i.email) + '"></div>' +
			'<div class="f"><label for="m_t">Handynummer</label><input id="m_t" type="tel" placeholder="+49 170 1234567" value="' + esc(i.telefon) + '"></div>' +
			'<label class="check"><input type="checkbox" id="m_w"' + (i.whatsapp_ok ? ' checked' : '') + '><span>Per WhatsApp benachrichtigen, wenn mir jemand eine Aufgabe zuweist.</span></label>' +
			'<div class="dlgbtns" style="margin-top:14px"><button type="button" class="btn sec" id="m_c">Abbrechen</button><button class="btn" type="submit">Speichern</button></div></form>';
		const dlg = openDlg(false);
		$('#m_c').onclick = () => dlg.close();
		$('#mf').onsubmit = async ev => {
			ev.preventDefault(); const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
			try { await api('profil', { email: $('#m_e').value, telefon: $('#m_t').value, whatsapp_ok: $('#m_w').checked }); dlg.close(); toast('Gespeichert'); await laden(true); }
			catch (e) { toast(e.message); btn.disabled = false; }
		};
	}
	function mitgliedDialog(p, alsAgent) {
		const neu = !p;
		p = p || (alsAgent ? { name: '', funktion: '', rolle: 'agent', typ: 'agent', status: 'aktiv' } : { name: '', funktion: '', rolle: 'team', status: 'eingeladen' });
		const selbst = p.mitglied_id === D.ich.mitglied_id, agent = p.typ === 'agent';
		$('#dlgInner').innerHTML = '<h2>' + (neu ? (agent ? 'Neuer KI-Agent' : 'Neues Teammitglied') : esc(p.name) + ' verwalten') + '</h2><form id="tf">' +
			'<div class="f2"><div class="f"><label for="t_n">Name</label><input id="t_n" required maxlength="60" value="' + esc(p.name) + '"' + (agent ? ' placeholder="z. B. Kurts Claude Code"' : '') + '></div>' +
			'<div class="f"><label for="t_f">' + (agent ? 'Wofür / bei wem' : 'Aufgabe im Team') + '</label><input id="t_f" maxlength="60" value="' + esc(p.funktion) + '" placeholder="' + (agent ? 'z. B. KI-Agent (Claude Code bei Kurt)' : 'z. B. Vertrieb') + '"></div>' +
			(p.typ === 'agent' ? '<div class="f"><label>Rolle</label><input disabled value="KI-Agent"></div>' : '<div class="f"><label for="t_r">Rolle</label><select id="t_r"' + (selbst ? ' disabled' : '') + '>' + opt(Object.keys(ROLLEN), p.rolle, v => ROLLEN[v]) + '</select></div>') +
			(!neu && !selbst ? '<div class="f"><label for="t_s">Zugang</label><select id="t_s">' + opt(['aktiv', 'eingeladen', 'gesperrt'], p.status, v => ({ aktiv: 'aktiv', eingeladen: 'eingeladen (noch nicht angemeldet)', gesperrt: 'gesperrt' }[v])) + '</select></div>' : '') + '</div>' +
			(agent ? '<p class="small muted">Ein KI-Agent arbeitet mit einem Agenten-Code über die Werkzeuge <code>agenten/team.py</code> und <code>office.py</code>. Er darf Aufgaben und Notizen lesen, kommentieren und anlegen und eine Aufgabe höchstens auf „Wird getestet“ setzen. „Erledigt“ setzt immer ein Mensch. Was er schreibt, steht unter seinem Namen.</p>'
				: '<p class="small muted">Rollen: Admin verwaltet das Team. Dozent / Technik sieht Teilnehmer mit Namen und pflegt Systeme. Vertrieb und Team sehen Kursdaten nur zusammengefasst. Alle können Aufgaben und Social-Beiträge anlegen.</p>') +
			(!neu ? '<label class="check" style="margin-bottom:10px"><input type="checkbox" id="t_l"><span>' + (agent ? 'Neuen Agenten-Code erzeugen (der alte Code funktioniert dann nicht mehr)' : 'Neuen Zugangslink erzeugen (der alte Link funktioniert dann nicht mehr)') + '</span></label>'
				: '<p class="small muted">' + (agent ? 'Nach dem Speichern kopierst du unter „Team“ den Agenten-Code und schickst ihn über das Register „Tresor“. Den Schlüssel sagst du am Telefon. Der Code kommt beim Empfänger in die Umgebungsvariable TEAM_PORTAL_TOKEN, nie in eine Datei oder einen Chat.' : 'Nach dem Speichern kopierst du unter „Team“ den persönlichen Link und schickst ihn der Person.') + '</p>') +
			'<div class="dlgbtns"><button type="button" class="btn sec" id="t_c">Abbrechen</button><button class="btn" type="submit">Speichern</button></div></form>';
		const dlg = openDlg(false);
		$('#t_c').onclick = () => dlg.close();
		$('#tf').onsubmit = async ev => {
			ev.preventDefault(); const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
			try {
				await api('mitglied_speichern', { mitglied_id: p.mitglied_id, name: $('#t_n').value, funktion: $('#t_f').value, rolle: selbst ? 'admin' : ($('#t_r') ? $('#t_r').value : p.rolle),
					status: $('#t_s') ? $('#t_s').value : undefined, neuer_link: !!($('#t_l') && $('#t_l').checked), typ: neu && agent ? 'agent' : undefined });
				dlg.close(); toast(neu && agent ? 'KI-Agent angelegt. Agenten-Code jetzt unter „Team“ kopieren.' : 'Gespeichert'); await laden(true);
			} catch (e) { toast(e.message); btn.disabled = false; }
		};
	}

	// Daten alle 2 Minuten im Hintergrund auffrischen, wenn kein Dialog offen ist
	setInterval(() => {
		// Nicht neu aufbauen, solange jemand tippt oder im eingebetteten KI Office arbeitet (Fokus im iframe): render() würde das iframe neu laden
		// und einen dort offenen Dialog (z. B. „Auftrag an Agent“) schließen.
		const a = document.activeElement, tippt = a && /^(INPUT|SELECT|TEXTAREA|IFRAME)$/.test(a.tagName);
    // Nie während einer Diktat-Aufnahme oder solange ihr Text erstellt wird (diktatLaeuft).
		// Im Tresor nie neu aufbauen: Das würde Eingabe, Schlüssel und Ausgabe löschen (die Seite braucht keine Daten).
    if (D && !D.setup && tab !== 'tresor' && !$('#dlg').open && !tippt && !diktatLaeuft() && document.visibilityState === 'visible') { const y = window.scrollY; laden(true).then(() => window.scrollTo(0, y)); }
	}, 120000);
	// Pfad-Links (Notizen, Aufgaben, Vorschläge): file:///C:/Ordner/Datei, \\Server\Freigabe oder C:\Ordner → Windows-Pfad in die Zwischenablage
	document.addEventListener('click', ev => {
		const a = ev.target.closest && ev.target.closest('a.pfad'); if (!a) return;
		ev.preventDefault();
		let pfad = a.dataset.pfad || '';
		if (/^file:\/\/\//i.test(pfad)) { try { pfad = decodeURI(pfad.slice(8)); } catch (e) { pfad = pfad.slice(8); } if (/^[A-Za-z]:/.test(pfad)) pfad = pfad.replace(/\//g, '\\'); else pfad = '/' + pfad; }
		const fertig = () => toast('Pfad kopiert. Im Explorer mit Strg+L in die Adresszeile wechseln und mit Strg+V einfügen.', 'mitte');
		(navigator.clipboard ? navigator.clipboard.writeText(pfad).then(fertig) : Promise.reject()).catch(() => { window.prompt('Pfad kopieren (Strg+C):', pfad); });
	});
	leseHash();
	laden();
})();
</script>
</body></html>
