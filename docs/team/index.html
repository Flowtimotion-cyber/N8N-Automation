<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Team-Portal · Momentum KI Akademie</title>
<style>
:root{--ink:#14123A;--mut:#62607E;--line:#DFDDEC;--bg:#F6F6FB;--card:#fff;--acc:#7B3FE4;--acc2:#5B6EE6;--teal:#1FA9B0;--red:#D9452F;--orange:#E98A15;--green:#1F9D6B;--soft:#EEEDF6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1920px;margin:0 auto;padding:0 clamp(16px,2.5vw,40px)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:14px;padding:12px 0}
.logo{height:34px;display:block}
.htitle{font-weight:700;font-size:15px;color:var(--mut);border-left:1px solid var(--line);padding-left:14px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut)}
.who b{color:var(--ink)}
.bar{height:3px;background:linear-gradient(90deg,#9B4DF0,#5B6EE6 55%,#22B3B0)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:9px 14px 11px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
main{padding:30px 0 60px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.4px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 18px}
.muted{color:var(--mut)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 10px 30px rgba(20,18,58,.05);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi b{display:block;font-size:28px;line-height:1.1}
.kpi span{color:var(--mut);font-size:13px}
.kpi.warn b{color:var(--red)}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer;background:var(--acc);color:#fff;text-decoration:none}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--acc);padding:6px 8px}
.btn.wa{background:#1FA855}
.btn.danger{background:#fff;color:var(--red);border:1px solid #F1C7C0}
.btn:disabled{opacity:.5;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tools select,.tools input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-width:0}
.tools .grow{flex:1 1 180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--soft);color:var(--ink)}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:start;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.task:first-child{border-top:0}
.task:hover{background:#FAFAFE}
.task .t{font-weight:600}
.task.done .t{text-decoration:line-through;color:var(--mut)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12.5px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--soft);font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.p1{background:#FCE3DE;color:#B0321F}.p2{background:#FDEBD3;color:#A35D06}.p3{background:var(--soft);color:var(--mut)}
.st-Offen{background:#E9E7F7}.st-Geplant{background:#DDE6FB}.st-In-Arbeit{background:#FFF1C7}.st-Wartet{background:#F4E5FA}.st-Wird-getestet{background:#D9F2EC}.st-Erledigt{background:#E2F3E8;color:var(--green)}
.late{color:var(--red);font-weight:700}
.cpost{border-top:1px solid var(--line);padding:12px 0}.cpost.erl{opacity:.7}.cpost.versteckt{opacity:.45}.crow textarea{width:100%;box-sizing:border-box;margin:6px 0;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px}.crow .act{display:flex;gap:6px;flex-wrap:wrap}
.av.ki{background:#1F2937;font-size:15px}
.verlauf{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}.verlauf h3{font-size:14px;margin:0 0 8px}.vl{display:flex;gap:8px;align-items:flex-start;margin:0 0 8px}.vl .vt{flex:1;min-width:0;font-size:13.5px}.vl .vt .md p{margin:2px 0}.vl.status .vt{color:var(--mut);font-size:12.5px}.vl.bericht .vt{background:#F4F1FD;border-radius:10px;padding:6px 10px}.chip.ki{background:#1F2937;color:#fff}
.av{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.av.c1{background:#7B3FE4}.av.c2{background:#1FA9B0}.av.c3{background:#E98A15}.av.c4{background:#5B6EE6}.av.c5{background:#D9452F}.av.c6{background:#1F9D6B}
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#EFEEF7;border-radius:14px;padding:10px;min-height:120px}
.col h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:flex;justify-content:space-between;margin:2px 4px 10px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.bcard .t{font-weight:600;font-size:14px}
.empty{color:var(--mut);padding:18px 4px;text-align:center}
.offFrame{width:100%;border:0;display:block;height:720px;background:var(--bg)}
.bars .row{display:grid;grid-template-columns:minmax(110px,42%) 1fr auto;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.bars .bt{height:10px;background:var(--soft);border-radius:6px;overflow:hidden}
.bars .bt i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bars .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto}
.prog{width:80px;height:7px;background:var(--soft);border-radius:5px;overflow:hidden;margin-bottom:3px}
.prog i{display:block;height:100%;background:var(--acc)}
.post{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer;align-items:start}
.post:first-child{border-top:0}
.date{background:var(--soft);border-radius:12px;text-align:center;padding:6px 4px;line-height:1.15}
.date b{display:block;font-size:20px}
.date span{font-size:12px;color:var(--mut);text-transform:uppercase}
.sys{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;cursor:default}
.sys.edit{cursor:pointer}
.sys .top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.d-läuft{background:var(--green)}.d-im-Bau{background:var(--orange)}.d-geplant{background:#A9A6C9}.d-pausiert{background:var(--red)}
.member{display:flex;gap:12px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.member .act{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.note{background:#F3EEFD;border:1px solid #E1D5FA;border-radius:12px;padding:12px 14px;font-size:14px}
.note.warn{background:#FFF6E5;border-color:#F6DDAA}
dialog{border:0;border-radius:18px;padding:0;max-height:calc(100vh - 24px);overflow:auto;width:min(620px,calc(100vw - 24px));box-shadow:0 30px 80px rgba(20,18,58,.3)}
dialog::backdrop{background:rgba(20,18,58,.45)}
.dlg{padding:20px 22px}
.dlg h2{margin-bottom:14px}
.f{display:grid;gap:4px;margin-bottom:12px}
.f label{font-size:13px;font-weight:600;color:var(--mut)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%}
.f textarea{min-height:90px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.dlgbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:6px}
.dlgbtns .left{margin-right:auto}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px}
.zt{display:grid;grid-template-columns:96px 1fr auto;gap:10px;padding:10px 4px;border-top:1px solid var(--line);align-items:start}
.zt:first-child{border-top:0}
.zt.click{cursor:pointer}.zt.click:hover{background:#FAFAFE}
.zk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto}

.zk b.plus{color:var(--green)}

.zk .zbar i{display:block;height:100%;background:var(--acc)}

.tst{display:grid;grid-template-columns:minmax(120px,170px) 1fr minmax(120px,150px) 150px;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.tst:last-child{border-bottom:0}

.sib{position:relative;height:14px;background:var(--soft);border-radius:7px}

.sib em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.sil{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:5px}
.kto{font-weight:700;font-size:18px}.kto.plus{color:var(--green)}.kto.minus{color:var(--red)}
.kbar{position:relative;height:8px;background:var(--soft);border-radius:4px;margin-top:5px}
.kbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.kbar em{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--mut)}
.spark{display:flex;align-items:flex-end;gap:4px;height:44px;position:relative}
.spark span{flex:1;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.spark span.ue{background:var(--green)}.spark span.leer{background:var(--soft)}
.spark hr{position:absolute;left:0;right:0;margin:0;border:0;border-top:1px dashed var(--ink);opacity:.5}
.sparkl{display:flex;gap:4px;font-size:10px;color:var(--mut)}.sparkl span{flex:1;text-align:center}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:0 0 6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media(max-width:760px){.tst{grid-template-columns:1fr 1fr;gap:10px}.tst .nm{grid-column:1/-1}.tst .sibw{grid-column:1/-1}}
.mstat span{font-size:12.5px;color:var(--mut)}
.wkhead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 2px;padding:6px 4px;border-bottom:2px solid var(--soft);font-size:13px;font-weight:700;color:var(--mut)}
.neuproj{display:flex;gap:6px;margin-top:6px}
.neuproj[hidden]{display:none}
.neuproj input{flex:1}
@media (max-width:640px){.hrow{flex-wrap:wrap}.zk{width:100%;order:3;margin-left:0}.zk + .who{margin-left:auto}.zk button{flex:1}}
.zs-offen{background:#E9E7F7}.zs-eingereicht{background:#FFF1C7}.zs-freigegeben{background:#E2F3E8;color:var(--green)}.zs-abgelehnt{background:#FCE3DE;color:#B0321F}
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weeknav b{min-width:190px;text-align:center}
.sum{font-size:22px;font-weight:700}
.md{line-height:1.55;overflow-wrap:anywhere}.md h2{font-size:20px;margin:14px 0 6px}.md h3{font-size:17px;margin:12px 0 6px}.md h4{font-size:15px;margin:10px 0 4px}
.md p{margin:0 0 8px}.md ul,.md ol{margin:0 0 8px;padding-left:22px}.md ul.tasklist{list-style:none;padding-left:4px}.md blockquote{margin:0 0 8px;padding:6px 12px;border-left:3px solid var(--acc);background:#F6F3FE;border-radius:0 8px 8px 0}
.md code,.hilfe code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.92em}.md mark,.hilfe mark{background:#FFF0A8;padding:0 2px}.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}.md a.wl{text-decoration:underline dotted}
.ed .edhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.edmode button{padding:5px 10px;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:#FAFAFE}
.toolbar .tb{border:1px solid transparent;background:none;border-radius:7px;padding:4px 9px;cursor:pointer;font-size:14px;min-width:32px}.toolbar .tb:hover{background:#fff;border-color:var(--line)}
.toolbar select.tb{border-color:var(--line);background:#fff;width:auto!important;padding:4px 6px}
.edbody{display:grid;gap:10px}.edbody textarea{border-radius:0 0 10px 10px!important;min-height:160px;resize:none;font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

.hilfebox{border:1px solid var(--line);border-top:0;background:#FFFDF5;padding:10px 12px;font-size:13.5px}.hilfe table{width:auto}.hilfe td{padding:3px 10px 3px 0;border:0}

dialog.breit{overflow:visible;margin-top:3vh;margin-bottom:auto}dialog.breit .dlg{max-height:calc(100vh - 24px);overflow:auto}dialog.voll .dlg{height:94vh;max-height:94vh}

.linkbtn{float:right;font-size:14px;margin:-4px 0 0 4px}.vollbild{float:right;font-size:20px;line-height:1;padding:2px 8px;margin:-6px -8px 0 8px}
.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.pstats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px;text-align:center}.pstats b{display:block;font-size:20px}.pstats span{font-size:12px;color:var(--mut)}
.notes{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}.nlist{padding:12px;max-height:75vh;overflow:auto}
.nitem{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer}.nitem:hover{background:#FAFAFE}.nitem.on{background:#F1ECFD}.nitem b{display:block}

.md mark,.hilfe mark{color:inherit}.md .hg,.hilfe .hg{padding:0 3px;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

.plinks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}

.lkrow{display:grid;grid-template-columns:minmax(110px,32%) 1fr auto;gap:6px;margin-bottom:6px}

#kiBox .kh b{flex:1}#kiBox .kh small{display:block;font-weight:400;color:var(--mut);font-size:12px}
#kiBox .kx{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--mut);padding:4px 6px}
#kiLog{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.km{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.45;word-wrap:break-word}
.km p{margin:0 0 6px}.km p:last-child{margin:0}.km ul,.km ol{margin:4px 0;padding-left:20px}
.km.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.km.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.km.f{align-self:flex-start;background:#FDECEA;color:#8A2A1C}
.km.w{color:var(--mut);font-style:italic}
.kvor{display:flex;flex-wrap:wrap;gap:6px}.kvor button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}.kvor button:hover{border-color:var(--acc);color:var(--acc)}
#kiForm{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#kiIn{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:9px 11px;font:inherit;font-size:14.5px;max-height:120px}
#kiForm .btn{align-self:flex-end}
@media(max-width:600px){#kiBox{right:8px;bottom:8px;width:calc(100vw - 16px);height:calc(100vh - 16px)}#kiBtn{right:12px;bottom:12px;padding:12px 14px}}
.center{max-width:520px;margin:8vh auto;padding:0 16px}
.loading{padding:60px 0;text-align:center;color:var(--mut)}
@media(max-width:640px){
  .htitle{display:none}.who span.r{display:none}
  .f2{grid-template-columns:1fr}
  .task{grid-template-columns:auto 1fr}.task .right{grid-column:2}
  h1{font-size:22px}
}
/* Vertrieb (Pipeline aus Twenty) */
.vboard{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.vcol{background:#EFEEF7;border-radius:14px;padding:8px;min-height:140px;transition:background .15s}
.vcol.drop{background:#E3DCF8;outline:2px dashed var(--acc);outline-offset:-2px}
.vcol h3{font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--ink);margin:2px 4px 2px;display:flex;justify-content:space-between;gap:6px}
.vcol h3 span{color:var(--mut);font-weight:600}
.vcol .vsum{font-size:12px;color:var(--mut);margin:0 4px 8px}
.vcol .vstrich{height:3px;border-radius:3px;margin:0 4px 8px}
.vcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:8px;cursor:pointer;font-size:13px}
.vcard:hover{border-color:var(--acc)}
.vcard.zieht{opacity:.45}
.vcard .t{font-weight:650;font-size:13.5px;line-height:1.3;word-break:break-word}
.vcard .k{color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcard .m{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:6px}
.chip.fu{background:#FFF4E5;color:#9A5B00}.chip.fu.weg{background:#FDECEA;color:var(--red)}.chip.ig{background:#FCE7F3;color:#9D174D}.chip.eur{background:#E9F7F0;color:#146C47}
.vmehr{width:100%;border:1px dashed var(--line);background:none;border-radius:10px;padding:6px;color:var(--mut);cursor:pointer;font-size:12.5px}
.vtab td,.vtab th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px;vertical-align:top}
.vtab tr.klick{cursor:pointer}.vtab tr.klick:hover td{background:#FAF9FE}
.vnotiz{border-top:1px solid var(--line);padding:10px 0}.vnotiz .kopf{font-size:12.5px;color:var(--mut);margin-bottom:4px}
.vbald{border:1px dashed #C9C2EE;background:#F7F5FE;border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--mut);margin:10px 0}
.vtreffer{border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:200px;overflow:auto}
.vtreffer button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:7px 10px;cursor:pointer}
.vtreffer button:hover{background:var(--soft)}
.vkontakt{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.dash{margin-bottom:16px}
.dash .dhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.dash .dtabs{display:flex;gap:6px;flex-wrap:wrap}
.dash .dtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;color:var(--mut);cursor:pointer}
.dash .dtabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.dgrid .card{margin-bottom:0}
.dmini{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.dmini .kpi b{font-size:24px}
.cchart{width:100%;height:auto;display:block;overflow:visible}
.cchart .bar{fill:var(--acc)}
.cchart .bar.alt{fill:var(--teal)}
.cchart g:hover .bar{opacity:.75}
.cchart text{font-size:11.5px;fill:var(--mut)}
.cchart .val{fill:var(--ink);font-weight:600}
.cchart .grid{stroke:var(--line);stroke-width:1}
.funnel .row{display:grid;grid-template-columns:minmax(120px,38%) 1fr auto;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.funnel .bt{height:16px;background:var(--soft);border-radius:6px;overflow:hidden}
.funnel .bt i{display:block;height:100%;background:linear-gradient(90deg,#9B4DF0,#5B6EE6);border-radius:6px}
.funnel .q{color:var(--mut);font-size:12px;margin-left:4px}
.dhint{font-size:12.5px;color:var(--mut);margin:6px 0 0}
</style></head>
<body>
<div id="app"><div class="loading">Lade Team-Portal …</div></div>
<dialog id="dlg"><div class="dlg" id="dlgInner"></div></dialog>
<div id="toast"></div>
<script>
(function () {
  'use strict';
  const API = 'https://n8n.hm-storage.de/webhook/team-api-v2';
  const PORTAL = 'https://flowtimotion-cyber.github.io/N8N-Automation/team/';
  const projOpts = cur => { const l = projektNamen(); return cur && !l.includes(cur) ? l.concat([cur]) : l; };
  const STATUS = ['Offen', 'Geplant', 'In Arbeit', 'Wartet', 'Wird getestet', 'Erledigt'];
  const BOARD = ['Offen', 'Geplant', 'In Arbeit', 'Wartet', 'Wird getestet'];
  const LABELS = ['', '🔥 Hohe Prio', '🐸 Eat the Frog', '💬 Zu besprechen', '🛑 Blockiert', 'wartet auf..', '🗂️ Zu klären', 'Übergabe an Kunden'];
  const PROFILE = [['Instagram', 'https://www.instagram.com/momentumkiakademie/', '@momentumkiakademie']];
  const KANAELE = ['LinkedIn', 'Instagram', 'Facebook', 'YouTube', 'TikTok', 'Newsletter', 'Webseite / Blog', 'Sonstiges'];
  const SSTATUS = ['Idee', 'In Arbeit', 'Zur Freigabe', 'Geplant', 'Veröffentlicht'];
  const SYSSTATUS = ['läuft', 'im Bau', 'geplant', 'pausiert'];
  const ROLLEN = { admin: 'Admin', dozent: 'Dozent / Technik', vertrieb: 'Vertrieb', team: 'Team' };
  const ROLLE_TXT = r => r === 'agent' ? 'KI-Agent' : (ROLLEN[r] || '');
  const TABS = [['start', 'Übersicht'], ['aufgaben', 'Aufgaben'], ['projekte', 'Projekte'], ['zeit', 'Arbeitszeit'], ['notizen', 'Notizen'], ['social', 'Social Media'], ['vertrieb', 'Vertrieb'], ['kurs', 'Kurs & Teilnehmer'], ['systeme', 'Systeme'], ['web', 'Webseite'], ['vorschlaege', 'Vorschläge'], ['office', 'KI Office'], ['team', 'Team']];

  // ---------- Speicher (nur Komfort, darf fehlen) ----------
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  let TOKEN = null;
  const m = /[#&?]z=([a-f0-9]{20,64})/i.exec(location.hash + '&' + location.search);
  if (m) { TOKEN = m[1].toLowerCase(); ls.set('mt-token', TOKEN); history.replaceState(null, '', location.pathname + (/^#\//.test(location.hash) ? location.hash : '')); }
  else TOKEN = ls.get('mt-token');

  let D = null;            // Daten vom Server
  let tab = ls.get('mt-tab') || 'start';
  const F = Object.assign({ person: 'ich', projekt: '', status: 'offen', q: '', ansicht: 'liste', kanal: '' }, JSON.parse(ls.get('mt-filter') || '{}'));

  // ---------- Helfer ----------
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2600); };
  const heute = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const dDate = s => s ? new Date(s + 'T00:00:00') : null;
  const fmtD = s => { if (!s) return ''; const d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? dDate(s) : new Date(s); return isNaN(d) ? '' : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }); };
  const fmtDT = s => { if (!s) return '–'; const d = new Date(s); return isNaN(d) ? '–' : d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };
  const ueberfaellig = a => a.deadline && a.status !== 'Erledigt' && dDate(a.deadline) < heute();
  const mitglied = id => (D.mitglieder || []).find(x => x.mitglied_id === id) || (/^kurs:/.test(String(id || '')) ? { name: String(id).slice(5) + ' (Kurs)', mitglied_id: id } : { name: '–', mitglied_id: id });
  const farbe = id => 'c' + (1 + (Math.abs([...String(id)].reduce((s, c) => s + c.charCodeAt(0), 0)) % 6));
  const istKI = id => mitglied(id).typ === 'agent';
  const av = id => { const p = mitglied(id); return istKI(id) ? '<span class="av ki" title="' + esc(p.name) + ' (KI-Agent)">🤖</span>' : '<span class="av ' + farbe(id) + '" title="' + esc(p.name) + '">' + esc((p.name || '?').slice(0, 1).toUpperCase()) + '</span>'; };
  const istAdmin = () => D && D.ich && D.ich.rolle === 'admin';
  const istDozent = () => D && D.ich && (D.ich.rolle === 'admin' || D.ich.rolle === 'dozent');
  const opt = (arr, sel, lab) => arr.map(v => '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(lab ? lab(v) : (v || '–')) + '</option>').join('');
  const personOpts = sel => (D.mitglieder || []).filter(p => p.status !== 'gesperrt').map(p => '<option value="' + esc(p.mitglied_id) + '"' + (p.mitglied_id === sel ? ' selected' : '') + '>' + esc(p.name) + (p.typ === 'agent' ? ' 🤖 (KI-Agent)' : '') + '</option>').join('');
  const saveF = () => ls.set('mt-filter', JSON.stringify(F));
  const waNummer = t => String(t || '').replace(/[^\d]/g, '');

  async function api(aktion, daten) {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ token: TOKEN, aktion, daten: daten || {} }) });
    let j = null; try { j = await r.json(); } catch (e) {}
    if (!r.ok || !j || j.ok === false) { const err = new Error((j && j.fehler) || 'Das hat nicht geklappt. Bitte versuch es gleich noch einmal.'); err.status = r.status; throw err; }
    return j;
  }

  // ---------- Adressen (jede Seite, Notiz, Aufgabe, jedes Projekt hat eine eigene URL) ----------
  let ziel = null;
  function leseHash() {
    const mm = /^#\/monat\/(\d{4})-(\d{2})$/.exec(location.hash || '');
    if (mm) { const j = heute(); tab = 'zeit'; zAns = 'monat'; zPerson = null; moOff = Math.min(0, (Number(mm[1]) - j.getFullYear()) * 12 + Number(mm[2]) - 1 - j.getMonth()); return; }
    const m = /^#\/(tab|notiz|aufgabe|projekt|agent)\/([\w-]+)$/.exec(location.hash || '');
    if (!m) return;
    agentAkte = null;
    if (m[1] === 'tab') tab = m[2];
    else if (m[1] === 'agent') { tab = 'team'; agentAkte = m[2]; }
    else if (m[1] === 'notiz') { tab = 'notizen'; offeneNotiz = m[2]; }
    else if (m[1] === 'aufgabe') { tab = 'aufgaben'; ziel = { art: 'aufgabe', id: m[2] }; }
    else if (m[1] === 'projekt') { tab = 'projekte'; ziel = { art: 'projekt', id: m[2] }; }
  }
  let agentAkte = null;
  let letzterHash = location.hash;
  function setzeHash(h, ersetzen) {
    letzterHash = h;
    if (location.hash === h) return;
    try { history[ersetzen ? 'replaceState' : 'pushState'](null, '', location.pathname + h); } catch (e) {}
  }
  const linkVon = h => PORTAL + h;
  async function kopiereLink(h, was) {
    const url = linkVon(h);
    try { await navigator.clipboard.writeText(url); toast('Link ' + (was ? 'zu „' + was + '“ ' : '') + 'kopiert'); }
    catch (e) { window.prompt('Link kopieren:', url); }
  }
  const nachHash = () => { if (!D || D.setup || location.hash === letzterHash) return; letzterHash = location.hash; leseHash(); if ($('#dlg').open) $('#dlg').close(); render(); };
  window.addEventListener('hashchange', nachHash);
  window.addEventListener('popstate', nachHash);

  async function laden(still) {
    if (!TOKEN) return ohneZugang();
    try {
      D = await api('laden');
      if (D.setup) return einrichten();
      render();
    } catch (e) {
      if (e.status === 401) { ls.del('mt-token'); return ohneZugang(e.message); }
      if (!still) $('#app').innerHTML = '<div class="center card"><h2>Keine Verbindung</h2><p class="muted">' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">Erneut versuchen</button></div>';
      else toast(e.message);
    }
  }

  function ohneZugang(msg) {
    $('#app').innerHTML = '<div class="center"><img class="logo" src="../logo_h96.png" srcset="../logo_h48.png 1x, ../logo_h96.png 2x, ../logo_h144.png 3x" alt="Momentum KI Akademie" style="height:48px;margin-bottom:18px"><div class="card"><h2>Team-Portal</h2>' +
      '<p>' + esc(msg || 'Diese Seite ist nur für das Momentum-Team.') + '</p><p class="muted">Öffne den persönlichen Link, den du von Timo bekommen hast. Danach merkt sich dein Browser die Anmeldung.</p>' +
      '<form id="codef" style="margin-top:14px"><div class="f"><label for="code">Oder den Zugangscode hier einfügen</label><input id="code" autocomplete="off" placeholder="32 Zeichen aus deinem Link"></div><button class="btn" type="submit">Anmelden</button></form></div></div>';
    $('#codef').onsubmit = ev => {
      ev.preventDefault();
      const c = /([a-f0-9]{20,64})/i.exec($('#code').value || '');
      if (!c) return toast('Das sieht nicht nach einem gültigen Code aus.');
      TOKEN = c[1].toLowerCase(); ls.set('mt-token', TOKEN); laden();
    };
  }

  function einrichten() {
    const i = D.ich;
    $('#app').innerHTML = '<div class="center"><img class="logo" src="../logo_h96.png" srcset="../logo_h48.png 1x, ../logo_h96.png 2x, ../logo_h144.png 3x" alt="Momentum KI Akademie" style="height:48px;margin-bottom:18px"><div class="card">' +
      '<h2>Willkommen, ' + esc(i.name) + '!</h2><p class="muted">Bevor es losgeht: Trag einmal deine Kontaktdaten ein. Sie sind nur für das Momentum-Team sichtbar.</p>' +
      '<form id="setup"><div class="f"><label for="s_mail">E-Mail-Adresse</label><input id="s_mail" type="email" required autocomplete="email" value="' + esc(i.email) + '"></div>' +
      '<div class="f"><label for="s_tel">Handynummer (für WhatsApp)</label><input id="s_tel" type="tel" autocomplete="tel" placeholder="+49 170 1234567" value="' + esc(i.telefon) + '"></div>' +
      '<label class="check"><input type="checkbox" id="s_wa"' + (i.whatsapp_ok ? ' checked' : '') + '><span>Ich möchte per WhatsApp benachrichtigt werden, wenn mir jemand eine Aufgabe zuweist. Abbestellen geht jederzeit hier im Portal unter „Team“.</span></label>' +
      '<p class="small muted">Gespeichert werden Name, E-Mail, Telefonnummer und deine Aufgaben, damit das Team zusammenarbeiten kann. Teilnehmer-Daten aus dem Kurs siehst du je nach Rolle nur zusammengefasst.</p>' +
      '<button class="btn" type="submit">Speichern und loslegen</button></form></div></div>';
    $('#setup').onsubmit = async ev => {
      ev.preventDefault();
      const b = ev.submitter || ev.target.querySelector('button'); b.disabled = true;
      try { await api('profil', { email: $('#s_mail').value, telefon: $('#s_tel').value, whatsapp_ok: $('#s_wa').checked }); await laden(); }
      catch (e) { toast(e.message); b.disabled = false; }
    };
  }

  // ---------- Gerüst ----------
  function render() {
    const i = D.ich;
    $('#app').innerHTML = '<header><div class="wrap"><div class="hrow"><img class="logo" src="../logo_h96.png" srcset="../logo_h48.png 1x, ../logo_h96.png 2x, ../logo_h144.png 3x" alt="Momentum KI Akademie"><span class="htitle">Team-Portal</span>' + zkKopf() +
      '<div class="who">' + av(i.mitglied_id) + '<span><b>' + esc(i.name) + '</b> <span class="r">· ' + esc(ROLLEN[i.rolle] || i.rolle) + '</span></span></div></div>' +
      '<nav class="tabs" role="tablist">' + TABS.filter(([k]) => k !== 'vertrieb' || darfVertrieb()).map(([k, l]) => '<button role="tab" data-tab="' + k + '" class="' + (k === tab ? 'on' : '') + '">' + l + '</button>').join('') + '</nav></div><div class="bar"></div></header>' +
      '<main class="wrap" id="main"></main>';
    document.querySelectorAll('[data-zk]').forEach(b => b.onclick = () => { tab = 'zeit'; zAns = 'monat'; moOff = 0; zPerson = D.ich.mitglied_id; agentAkte = null; ls.set('mt-tab', tab); setzeHash('#/tab/zeit'); render(); window.scrollTo(0, 0); });
    document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; agentAkte = null; ls.set('mt-tab', tab); setzeHash('#/tab/' + tab); render(); window.scrollTo(0, 0); });
    const V = { vertrieb: vVertrieb, start: vStart, aufgaben: vAufgaben, projekte: vProjekte, notizen: vNotizen, zeit: vZeit, social: vSocial, kurs: vKurs, systeme: vSysteme, web: vWeb, vorschlaege: vVorschlaege, office: vOffice, team: vTeam };
    if (!V[tab] || (tab === 'vertrieb' && !darfVertrieb())) tab = 'start';
    if (tab !== 'notizen' && !agentAkte && !ziel && !$('#dlg').open) setzeHash('#/tab/' + tab, true);
    V[tab]();
    kiAufbauen();
    if (ziel) {
      const z = ziel; ziel = null;
      if (z.art === 'aufgabe') { const a = D.aufgaben.find(x => x.aufgabe_id === z.id); if (a) aufgabeDialog(a); else toast('Diese Aufgabe gibt es nicht mehr.'); }
      if (z.art === 'projekt') { const p = (D.projekte || []).find(x => x.projekt_id === z.id); if (p) projektDialog(p); else toast('Dieses Projekt gibt es nicht mehr.'); }
    }
  }


  // ---------- Vorschläge (Änderungswünsche am Portal) ----------
  const VSTATUS = ['neu', 'geplant', 'in Arbeit', 'umgesetzt', 'abgelehnt'];
  const VBEREICHE = ['Übersicht', 'Aufgaben', 'Projekte', 'Arbeitszeit', 'Notizen', 'Social Media', 'Kurs & Teilnehmer', 'Systeme', 'Webseite', 'Team', 'Assistent', 'Sonstiges'];
  let vFilter = ls.get('mt-vfilter') || 'offen';
  const vChip = st => '<span class="chip vs-' + esc(String(st).replace(/\s/g, '-')) + '">' + esc(st) + '</span>';
  function vVorschlaege() {
    const ich = D.ich.mitglied_id, admin = istAdmin();
    const alleV = (D.vorschlaege || []).slice();
    const offen = v => ['neu', 'geplant', 'in Arbeit'].includes(v.status);
    const L = alleV.filter(v => vFilter === 'alle' ? true : vFilter === 'offen' ? offen(v) : v.status === vFilter)
      .sort((a, b) => (b.stimmen || []).length - (a.stimmen || []).length || String(b.erstellt).localeCompare(String(a.erstellt)));
    const n = st => alleV.filter(v => v.status === st).length;
    $('#main').innerHTML = '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><div><h1>Vorschläge</h1><p class="sub">Was soll am Portal besser werden? Jeder kann Ideen einbringen und mit „Finde ich gut“ unterstützen. Timo entscheidet und gibt Rückmeldung.</p></div><button class="btn" id="neuv">+ Vorschlag</button></div>' +
      '<div class="kpis">' + kpi(alleV.filter(offen).length, 'offen') + kpi(n('neu'), 'neu') + kpi(n('geplant') + n('in Arbeit'), 'geplant oder in Arbeit') + kpi(n('umgesetzt'), 'umgesetzt') + '</div>' +
      '<div class="card"><div class="tools"><div class="seg">' + [['offen', 'Offen'], ['alle', 'Alle'], ['umgesetzt', 'Umgesetzt'], ['abgelehnt', 'Abgelehnt']].map(([k, l]) => '<button data-vf="' + k + '" class="' + (vFilter === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>' +
      (L.length ? L.map(v => {
        const st = Array.isArray(v.stimmen) ? v.stimmen : [], meine = st.includes(ich);
        const a = v.aufgabe_id ? (D.aufgaben || []).find(x => x.aufgabe_id === v.aufgabe_id) : null;

    const W = []; for (let i = 0; i < n; i++) { const s = new Date(start); s.setDate(s.getDate() + 7 * i); W.push({ s, label: 'KW ' + kwNr(s), wert: 0 }); }
    for (const x of liste) { const v = datumVon(x); if (!v) continue; const d = new Date(v); if (isNaN(d)) continue; const i = Math.floor((wochenStart(d) - start) / (7 * 864e5)); if (i >= 0 && i < n) W[i].wert++; }

    const jedes = Math.ceil(daten.length / 12), werteZeigen = daten.length <= 14;
    const bw = B / daten.length, w = Math.max(6, Math.min(36, bw - 8));
    const y = v => H - unten - (v / max) * (H - unten - oben);
    let s = '<svg class="cchart" viewBox="0 0 ' + B + ' ' + H + '" role="img"><line class="grid" x1="0" x2="' + B + '" y1="' + (H - unten) + '" y2="' + (H - unten) + '"/>';
    daten.forEach((d, i) => {

        (d.wert && (werteZeigen || d.wert === max) ? '<text class="val" x="' + (x + w / 2) + '" y="' + (H - unten - h - 4) + '" text-anchor="middle">' + d.wert + '</text>' : '') +

  // ---------- Arbeitszeit ----------
  let wkOff = 0, moOff = 0, zPerson = null;

  const darfTeamStunden = () => istAdmin() || !!(D && D.ich && D.ich.stunden_sicht);
  const isoWoche = ds => { const t = new Date(ds + 'T12:00:00Z'); const wd = (t.getUTCDay() + 6) % 7; t.setUTCDate(t.getUTCDate() - wd + 3); const j = t.getUTCFullYear(); const e = new Date(Date.UTC(j, 0, 4)); const w = 1 + Math.round(((t - e) / 864e5 - 3 + ((e.getUTCDay() + 6) % 7)) / 7); return j + '-W' + String(w).padStart(2, '0'); };
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const montag = off => { const d = heute(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + off * 7); return d; };
  const stdZ = min => (Math.round((Number(min) || 0) / 6) / 10).toLocaleString('de-DE');

  const MONATE = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const monatName = ym => MONATE[Number(ym.slice(5, 7)) - 1] + ' ' + ym.slice(0, 4);
  const ymJetzt = () => ymd(heute()).slice(0, 7);
  const ymPlus = (ym, n) => { const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)) - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const ZST = { offen: 'nicht eingereicht', eingereicht: 'wartet auf Freigabe', freigegeben: 'freigegeben', abgelehnt: 'zurückgegeben' };
  const zChip = st => '<span class="chip zs-' + esc(st) + '">' + esc(ZST[st] || st) + '</span>';
  const hatVertrag = p => Number(p && p.vertrag_std) > 0;

  // Überstundenkonto (gleiche Rechnung wie im Monatsende-Workflow):
  // Alles vor „abrechnung_ab“ + Startguthaben geht aufs Konto. Danach wird je Monat das Vertragssoll ausgezahlt,
  // soweit neu gearbeitete Stunden und Guthaben reichen. Mehr gearbeitet = Konto wächst, weniger = Konto sinkt.
  function zeitkontoRechnen(m, Z, R, bisYm) {
    const ymNext = ym => { let [y, mm] = ym.split('-').map(Number); mm++; if (mm > 12) { mm = 1; y++; } return y + '-' + String(mm).padStart(2, '0'); };
    const sum = arr => arr.reduce((s, z) => s + (Number(z.minuten) || 0), 0);
    const soll = Math.round((Number(m.vertrag_std) || 0) * 60);
    const ab = /^\d{4}-\d{2}-\d{2}$/.test(String(m.abrechnung_ab || '')) ? m.abrechnung_ab : '2026-10-05';
    const meine = (Z || []).filter(z => z.mitglied_id === m.mitglied_id && /^\d{4}-\d{2}-\d{2}$/.test(String(z.datum || '')));
    const vorher = sum(meine.filter(z => z.datum < ab));
    const start = (Number(m.startguthaben_min) || 0) + vorher;
    let konto = start;
    const monate = [];
    for (let ym = ab.slice(0, 7); ym <= bisYm; ym = ymNext(ym)) {
      const E = meine.filter(z => z.datum >= ab && z.datum.slice(0, 7) === ym);
      const W = sum(E);
      const r = (R || []).find(x => x.mitglied_id === m.mitglied_id && x.monat === ym);
      const vor = konto;
      let aus, nach;
      if (r) { aus = Number(r.ausgezahlt_min) || 0; nach = Number(r.konto_nachher_min) || 0; }
      else { aus = soll ? Math.min(soll, W + vor) : W; nach = vor + W - aus; }
      monate.push({ monat: ym, soll: r ? Number(r.soll_min) || soll : soll, gearbeitet: W, ausgezahlt: aus, konto_vorher: vor, konto_nachher: nach,
        abgeschlossen: !!r, abschluss: r || null, eintraege: E.length, offen: E.filter(z => z.status !== 'freigegeben').length });
      konto = nach;
    }
    return { soll, ab, start, vorher, monate };
  }
  // Stand heute: Monatszähler und Konto (Überstunden des laufenden Monats zählen sofort mit, ein Minus erst am Monatsende)
  function kontoStand(mid) {
    const p = mitglied(mid), ym = ymJetzt();
    const r = zeitkontoRechnen(p, D.zeiten, D.abrechnung, ym);
    const akt = r.monate.find(x => x.monat === ym) || { gearbeitet: 0, konto_vorher: r.start };
    return { r, akt, konto: akt.konto_vorher + Math.max(0, akt.gearbeitet - r.soll) };
  }
  function zkKopf() {
    if (!D || !D.ich || D.ich.rolle === 'agent') return '';
    const p = mitglied(D.ich.mitglied_id); if (!hatVertrag(p)) return '';
    const k = kontoStand(p.mitglied_id), s = k.r.soll, w = k.akt.gearbeitet;
    return '<div class="zk"><button type="button" data-zk title="Meine Stunden in diesem Monat"><small>' + MONATE[heute().getMonth()] + '</small><b>' + stdZ(w) + ' von ' + stdZ(s) + ' Std</b><span class="zbar"><i class="' + (w >= s ? 'voll' : '') + '" style="width:' + Math.min(100, Math.round(w / s * 100)) + '%"></i></span></button>' +
      '<button type="button" data-zk title="Noch nicht abgerechnetes Stundenguthaben"><small>Überstundenkonto</small><b class="' + (k.konto > 0 ? 'plus' : '') + '">' + stdPM(k.konto) + '</b></button></div>';
  }

  }

  function vZeit() {
    if (zAns === 'team' && !darfTeamStunden()) zAns = 'woche';
    const kopf = '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><div><h1>Arbeitszeit</h1><p class="sub">Zeiten eintragen, nach Wochen oder Monaten ansehen und zur Freigabe an Timo schicken.</p></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="seg"><button data-zans="woche" class="' + (zAns === 'woche' ? 'on' : '') + '">Woche</button><button data-zans="monat" class="' + (zAns === 'monat' ? 'on' : '') + '">Monat</button>' + (darfTeamStunden() ? '<button data-zans="team" class="' + (zAns === 'team' ? 'on' : '') + '">Team</button>' : '') + '</div><button class="btn" id="neuz">+ Zeit eintragen</button></div></div>' + (zAns === 'woche' || (zAns === 'monat' && !hatVertrag(mitglied(D.ich.mitglied_id))) ? vertragKarte() : '');
    if (zAns === 'team') vTeamStunden(kopf); else if (zAns === 'monat') vMonat(kopf); else vWoche(kopf);
    $('#neuz').onclick = () => zeitDialog(null);
    document.querySelectorAll('[data-zans]').forEach(b => b.onclick = () => { zAns = b.dataset.zans; ls.set('mt-zans', zAns); vZeit(); });
    document.querySelectorAll('[data-z]').forEach(e => e.onclick = () => zeitDialog((D.zeiten || []).find(z => z.zeit_id === e.dataset.z)));
    document.querySelectorAll('[data-vertrag]').forEach(e => e.onclick = ev => { ev.preventDefault(); vertragDialog(e.dataset.vertrag); });
  }

  function vWoche(kopf) {
    const Z = D.zeiten || [];
    const mo = montag(wkOff), so = new Date(mo); so.setDate(so.getDate() + 6);
    const kw = isoWoche(ymd(mo));
    const meine = Z.filter(z => z.mitglied_id === D.ich.mitglied_id && z.kw === kw).sort((a, b) => (a.datum + a.von).localeCompare(b.datum + b.von));
    const summe = minSumme(meine);
    const einreichbar = meine.filter(z => z.status === 'offen' || z.status === 'abgelehnt');
    const zurueck = meine.filter(z => z.status === 'abgelehnt');
    let html = kopf +
      '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px"><div class="weeknav"><button class="btn sec" id="wkp" aria-label="Vorige Woche">‹</button><b>KW ' + kw.slice(-2) + ' · ' + fmtD(ymd(mo)).slice(0, 6) + ' – ' + fmtD(ymd(so)) + '</b><button class="btn sec" id="wkn" aria-label="Nächste Woche"' + (wkOff >= 0 ? ' disabled' : '') + '>›</button>' + (wkOff ? '<button class="btn ghost" id="wkh">Diese Woche</button>' : '') + '</div>' +
      '<div style="text-align:right"><div class="sum">' + std(summe) + '</div><div class="small muted">in dieser Woche</div></div></div>' +
      (zurueck.length ? '<div class="note warn" style="margin-bottom:10px">Timo hat ' + zurueck.length + ' Eintrag/Einträge zurückgegeben. Bitte prüfen, korrigieren und die Woche erneut einreichen.</div>' : '') +
      (meine.length ? meine.map(z => zeitRow(z)).join('') : '<p class="empty">Noch keine Zeiten in dieser Woche.</p>') +
      (einreichbar.length ? '<div class="dlgbtns" style="margin-top:12px"><button class="btn" id="einreichen">Woche zur Freigabe einreichen (' + std(minSumme(einreichbar)) + ')</button></div>' :
        meine.length ? '<p class="small muted" style="margin-top:10px">' + (meine.every(z => z.status === 'freigegeben') ? 'Diese Woche ist freigegeben.' : 'Eingereicht. Timo bekommt freitags eine Erinnerung zur Freigabe.') + '</p>' : '') + '</div>';
    // Meine letzten Wochen als Übersicht, nach Wochen geordnet
    const wochen = {}; Z.filter(z => z.mitglied_id === D.ich.mitglied_id).forEach(z => { (wochen[z.kw] = wochen[z.kw] || []).push(z); });
    const wl = Object.keys(wochen).sort().reverse().slice(0, 10);
    if (wl.length) html += '<div class="card"><h2>Meine Wochen</h2><table><tr><th>Woche</th><th>Stunden</th><th>Status</th></tr>' + wl.map(w => {
      const arr = wochen[w]; const st = arr.every(z => z.status === 'freigegeben') ? 'freigegeben' : arr.some(z => z.status === 'abgelehnt') ? 'abgelehnt' : arr.some(z => z.status === 'eingereicht') ? 'eingereicht' : 'offen';
      const off = Math.round((dDate(arr.map(z => z.datum).sort()[0]) - montag(0)) / 6048e5);
      return '<tr class="click" data-wk="' + off + '" style="cursor:pointer"><td>KW ' + esc(w.slice(-2)) + ' · ' + esc(w.slice(0, 4)) + '</td><td><b>' + std(minSumme(arr)) + '</b></td><td>' + zChip(st) + '</td></tr>';
    }).join('') + '</table></div>';
    if (istAdmin()) {
      const offen = Z.filter(z => z.status === 'eingereicht');
      const g = {}; offen.forEach(z => { const k = z.mitglied_id + '|' + z.kw; (g[k] = g[k] || []).push(z); });
      html += '<div class="card"><h2>Zur Freigabe</h2>' + (Object.keys(g).length ? Object.entries(g).sort().map(([k, arr]) => {
        const [mid, w] = k.split('|');
        return '<div style="border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div>' + av(mid) + ' <b>' + esc(mitglied(mid).name) + '</b> · KW ' + esc(w.slice(-2)) + ' · <b>' + std(minSumme(arr)) + '</b></div>' +
          '<div style="display:flex;gap:6px"><button class="btn danger" data-zp="' + esc(k) + '" data-e="abgelehnt">Zurückgeben</button><button class="btn" data-zp="' + esc(k) + '" data-e="freigegeben">Freigeben</button></div></div>' +
          arr.sort((a, b) => (a.datum + a.von).localeCompare(b.datum + b.von)).map(z => zeitRow(z)).join('') + '</div>';
      }).join('') : '<p class="empty">Nichts offen. Alles freigegeben.</p>') + '</div>';
      const alleWoche = Z.filter(z => z.kw === kw && z.mitglied_id !== D.ich.mitglied_id);
      const proPerson = {}; alleWoche.forEach(z => { proPerson[z.mitglied_id] = (proPerson[z.mitglied_id] || 0) + (Number(z.minuten) || 0); });
      html += '<div class="card"><h2>Team in KW ' + kw.slice(-2) + '</h2>' + (Object.keys(proPerson).length ? '<div class="bars">' + Object.entries(proPerson).sort((a, b) => b[1] - a[1]).map(([id, min]) => '<div class="row"><span class="bl">' + esc(mitglied(id).name) + '</span><span class="bt"><i style="width:' + Math.min(100, Math.round(min / 2400 * 100)) + '%"></i></span><b style="width:auto;white-space:nowrap">' + std(min) + '</b></div>').join('') + '</div>' +
        '<details style="margin-top:10px"><summary>Alle Einträge ansehen</summary>' + alleWoche.sort((a, b) => (a.datum + a.von).localeCompare(b.datum + b.von)).map(z => zeitRow(z, true)).join('') + '</details>' : '<p class="empty">Keine Einträge vom Team in dieser Woche.</p>') + '</div>';
    }
    $('#main').innerHTML = html;
    $('#wkp').onclick = () => { wkOff--; vZeit(); };
    $('#wkn').onclick = () => { if (wkOff < 0) { wkOff++; vZeit(); } };
    const h = $('#wkh'); if (h) h.onclick = () => { wkOff = 0; vZeit(); };
    document.querySelectorAll('[data-wk]').forEach(r => r.onclick = () => { wkOff = Math.min(0, Number(r.dataset.wk) || 0); vZeit(); window.scrollTo(0, 0); });
    const ein = $('#einreichen'); if (ein) ein.onclick = async () => {
      ein.disabled = true;
      try {
        await api('woche_einreichen', { kw });
        (D.zeiten || []).forEach(z => { if (z.mitglied_id === D.ich.mitglied_id && z.kw === kw && (z.status === 'offen' || z.status === 'abgelehnt')) z.status = 'eingereicht'; });
        toast('Eingereicht. Timo wird freitags erinnert.'); render(); laden(true);
      } catch (e) { toast(e.message); ein.disabled = false; }
    };
    document.querySelectorAll('[data-zp]').forEach(b => b.onclick = () => freigabeDialog(b.dataset.zp, b.dataset.e));
  }


  // Team-Übersicht: Soll und Ist je Person, Überstundenkonto, Verlauf der letzten 6 Monate (Admin und freigeschaltete Personen, nur lesen)
  function vTeamStunden(kopf) {
    const admin = istAdmin();
    const T = admin ? { mitglieder: D.mitglieder || [], zeiten: D.zeiten || [], abrechnung: D.abrechnung || [] } : (D.team_stunden || { mitglieder: [], zeiten: [], abrechnung: [] });
    const ym = ymPlus(ymJetzt(), moOff), laufend = moOff === 0;
    const verlauf = []; for (let i = 5; i >= 0; i--) verlauf.push(ymPlus(ym, -i));
    const L = T.mitglieder.filter(m => m.typ !== 'agent' && m.status !== 'gesperrt').map(m => {
      const imMonat = T.zeiten.filter(z => z.mitglied_id === m.mitglied_id && String(z.datum).slice(0, 7) === ym);
      const offen = imMonat.filter(z => z.status !== 'freigegeben').length;
      if (!hatVertrag(m)) return { m, vertrag: false, ist: minSumme(imMonat), offen, spark: verlauf.map(v => ({ v, ist: minSumme(T.zeiten.filter(z => z.mitglied_id === m.mitglied_id && String(z.datum).slice(0, 7) === v)), soll: 0 })) };
      const rr = zeitkontoRechnen(m, T.zeiten, T.abrechnung, ym);
      const mo = rr.monate.find(x => x.monat === ym);
      const ist = mo ? mo.gearbeitet : minSumme(imMonat);
      const konto = mo ? (laufend && !mo.abgeschlossen ? mo.konto_vorher + Math.max(0, mo.gearbeitet - rr.soll) : mo.konto_nachher) : rr.start;
      const spark = verlauf.map(v => { const x = rr.monate.find(y => y.monat === v); return { v, ist: x ? x.gearbeitet : minSumme(T.zeiten.filter(z => z.mitglied_id === m.mitglied_id && String(z.datum).slice(0, 7) === v)), soll: x ? x.soll : 0 }; });
      return { m, vertrag: true, soll: rr.soll, ist, konto, offen, abgeschlossen: !!(mo && mo.abgeschlossen), vorAb: !mo, spark };
    }).sort((a, b) => (b.vertrag - a.vertrag) || a.m.name.localeCompare(b.m.name));
    const mitV = L.filter(x => x.vertrag);
    const sSoll = mitV.reduce((s, x) => s + x.soll, 0), sIst = L.reduce((s, x) => s + x.ist, 0), sKonto = mitV.reduce((s, x) => s + x.konto, 0), sOffen = L.reduce((s, x) => s + x.offen, 0);
    const skala = Math.max(1, ...L.map(x => Math.max(x.ist, x.soll || 0))) * 1.08;
    const kMax = Math.max(60, ...mitV.map(x => Math.abs(x.konto)));
    const sMax = Math.max(60, ...L.flatMap(x => x.spark.map(y => Math.max(y.ist, y.soll))));
    const MK = MONATE.map(n => n.slice(0, 3));
    const zeile = x => {
      const m = x.m, pct = v => Math.round(v / skala * 1000) / 10;
      const balken = x.vertrag
        ? '<div class="sib" title="Ist ' + std(x.ist) + ' von Soll ' + std(x.soll) + '"><i style="width:' + pct(Math.min(x.ist, x.soll)) + '%"></i>' + (x.ist > x.soll ? '<i class="ue" style="left:' + pct(x.soll) + '%;width:' + pct(x.ist - x.soll) + '%;border-radius:0 7px 7px 0"></i>' : '') + '<em style="left:calc(' + pct(x.soll) + '% - 1px)"></em></div>' +
          '<div class="sil"><span><b style="color:var(--ink)">' + stdZ(x.ist) + '</b> von ' + stdZ(x.soll) + ' Std' + (x.vorAb ? ' · vor Abrechnungsbeginn' : '') + '</span><span>' + (x.ist >= x.soll ? '<b style="color:var(--green)">' + stdPM(x.ist - x.soll) + '</b>' : 'noch ' + std(x.soll - x.ist)) + '</span></div>'
        : '<div class="sib"><i style="width:' + pct(x.ist) + '%;background:var(--mut);opacity:.45"></i></div><div class="sil"><span><b style="color:var(--ink)">' + std(x.ist) + '</b> gearbeitet</span><span>kein Vertrag eingetragen</span></div>';
      const kw = x.vertrag ? Math.round(Math.abs(x.konto) / kMax * 50 * 10) / 10 : 0;
      const kto = x.vertrag
        ? '<div class="kto ' + (x.konto > 0 ? 'plus' : x.konto < 0 ? 'minus' : '') + '">' + stdPM(x.konto) + '</div><div class="kbar"><em></em><i style="' + (x.konto >= 0 ? 'left:50%;background:var(--green)' : 'right:50%;background:var(--red)') + ';width:' + kw + '%"></i></div><div class="small muted" style="margin-top:4px">Überstundenkonto' + (laufend ? ' heute' : ' Monatsende') + '</div>'
        : '<div class="kto muted">–</div><div class="small muted">kein Konto</div>';
      const spark = '<div class="spark" title="Ist je Monat, gestrichelt: Soll">' + x.spark.map(y => '<span class="' + (!y.ist ? 'leer' : y.soll && y.ist > y.soll ? 'ue' : '') + '" style="height:' + Math.max(4, Math.round(y.ist / sMax * 100)) + '%" title="' + monatName(y.v) + ': ' + std(y.ist) + (y.soll ? ' von ' + std(y.soll) : '') + '"></span>').join('') +
        (x.vertrag ? '<hr style="bottom:' + Math.round(x.soll / sMax * 100) + '%">' : '') + '</div><div class="sparkl">' + x.spark.map(y => '<span>' + MK[Number(y.v.slice(5)) - 1] + '</span>').join('') + '</div>';
      return '<div class="tst' + (admin ? ' click" data-tp="' + esc(m.mitglied_id) + '"' : '"') + '><div class="nm">' + av(m.mitglied_id) + ' <b style="display:inline">' + esc(m.name) + '</b><span style="display:block">' + (x.vertrag ? stdZ(x.soll) + ' Std/Monat laut Vertrag' : 'ohne Vertragsstunden') +
        (x.offen ? ' · <span style="color:var(--orange)">' + x.offen + ' nicht freigegeben</span>' : x.abgeschlossen ? ' · abgeschlossen' : '') + '</span></div><div class="sibw">' + balken + '</div><div>' + kto + '</div><div>' + spark + '</div></div>';
    };
    let html = kopf + '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px"><div class="weeknav"><button class="btn sec" id="mop" aria-label="Voriger Monat">‹</button><b>Team · ' + monatName(ym) + '</b><button class="btn sec" id="mon" aria-label="Nächster Monat"' + (moOff >= 0 ? ' disabled' : '') + '>›</button>' + (moOff ? '<button class="btn ghost" id="moh">Dieser Monat</button>' : '') + '</div>' +
      (admin ? '' : '<span class="small muted">Nur Ansicht. Freigaben macht Timo.</span>') + '</div>' +
      '<div class="mstat"><div><b>' + stdZ(sIst) + ' Std</b><span>Ist im Team' + (sSoll ? ' · Soll ' + stdZ(sSoll) + ' Std' : '') + '</span></div>' +
      '<div><b style="color:' + (sKonto > 0 ? 'var(--green)' : sKonto < 0 ? 'var(--red)' : 'var(--ink)') + '">' + stdPM(sKonto) + '</b><span>Überstundenkonten zusammen</span></div>' +
      '<div><b style="color:' + (sOffen ? 'var(--orange)' : 'var(--ink)') + '">' + sOffen + '</b><span>Einträge noch nicht freigegeben</span></div></div>' +
      '<div class="leg"><span><i style="background:var(--acc)"></i>Ist bis Soll</span><span><i style="background:var(--green)"></i>Über Soll</span><span><i style="background:var(--ink);width:2px"></i>Soll laut Vertrag</span><span>Rechts: Ist der letzten 6 Monate, gestrichelt das Soll</span></div>' +
      (L.length ? L.map(zeile).join('') : '<p class="empty">Keine Personen gefunden.</p>') +
      (laufend ? '<p class="small muted" style="margin-top:10px">Im laufenden Monat zählen Überstunden sofort aufs Konto. Fehlende Stunden werden erst am Monatsende abgezogen.</p>' : '') + '</div>';
    $('#main').innerHTML = html;
    $('#mop').onclick = () => { moOff--; vZeit(); };
    $('#mon').onclick = () => { if (moOff < 0) { moOff++; vZeit(); } };
    const h = $('#moh'); if (h) h.onclick = () => { moOff = 0; vZeit(); };
    document.querySelectorAll('[data-tp]').forEach(r => r.onclick = () => { zPerson = r.dataset.tp; zAns = 'monat'; ls.set('mt-zans', zAns); vZeit(); window.scrollTo(0, 0); });
  }

  // Monatsübersicht und Monatsnachweis
  function vMonat(kopf) {
    const admin = istAdmin();
    if (!zPerson || !admin) zPerson = D.ich.mitglied_id;
    const p = mitglied(zPerson);
    const ym = ymPlus(ymJetzt(), moOff), laufend = moOff === 0;
    const E = (D.zeiten || []).filter(z => z.mitglied_id === zPerson && String(z.datum).slice(0, 7) === ym).sort((a, b) => (a.datum + a.von).localeCompare(b.datum + b.von));
    const W = minSumme(E);
    const rr = zeitkontoRechnen(p, D.zeiten, D.abrechnung, ym);
    const mo = rr.monate.find(x => x.monat === ym);
    const vorAb = E.filter(z => z.datum < rr.ab);
    const wochen = []; E.forEach(z => { let w = wochen.find(x => x.kw === z.kw); if (!w) wochen.push(w = { kw: z.kw, E: [] }); w.E.push(z); });
    const menschen = (D.mitglieder || []).filter(m => m.typ !== 'agent' && m.status !== 'gesperrt');
    let html = kopf + '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px"><div class="weeknav"><button class="btn sec" id="mop" aria-label="Voriger Monat">‹</button><b>' + monatName(ym) + '</b><button class="btn sec" id="mon" aria-label="Nächster Monat"' + (moOff >= 0 ? ' disabled' : '') + '>›</button>' + (moOff ? '<button class="btn ghost" id="moh">Dieser Monat</button>' : '') + '</div>' +
      (admin ? '<select id="zpers" aria-label="Person" style="border:1px solid var(--line);border-radius:10px;padding:8px 10px">' + menschen.map(m => '<option value="' + esc(m.mitglied_id) + '"' + (m.mitglied_id === zPerson ? ' selected' : '') + '>' + esc(m.name) + '</option>').join('') + '</select>' : '') + '</div>';
    if (hatVertrag(p) && mo) {
      const diff = mo.gearbeitet - mo.ausgezahlt;
      html += '<div class="mstat"><div><b>' + stdZ(mo.gearbeitet) + ' von ' + stdZ(mo.soll) + ' Std</b><span>gearbeitet' + (vorAb.length ? ' ab ' + fmtD(rr.ab) + ' · dazu ' + std(minSumme(vorAb)) + ' davor, die schon aufs Konto zählen' : '') + '</span></div>' +
        '<div><b>' + std(mo.ausgezahlt) + '</b><span>' + (mo.abgeschlossen ? 'ausgezahlt' : laufend ? 'Auszahlung, Stand heute' : 'auszuzahlen') + '</span></div>' +
        '<div><b>' + stdPM(diff) + '</b><span>' + (diff >= 0 ? 'aufs Überstundenkonto' : 'vom Überstundenkonto') + '</span></div>' +
        '<div><b>' + stdPM(mo.konto_vorher) + ' → ' + stdPM(mo.konto_nachher) + '</b><span>Überstundenkonto Monatsanfang → Monatsende</span></div></div>' +
        (mo.gearbeitet + mo.konto_vorher < mo.soll && !laufend ? '<div class="note warn" style="margin-bottom:10px">Gearbeitete Stunden und Guthaben reichen nicht für ' + std(mo.soll) + '. Ausgezahlt werden ' + std(mo.ausgezahlt) + '.</div>' : '');
    } else if (hatVertrag(p) && !mo) {
      html += '<div class="mstat"><div><b>' + std(W) + '</b><span>gearbeitet · vor Abrechnungsbeginn (' + fmtD(rr.ab) + '), geht komplett aufs Überstundenkonto</span></div></div>';
    } else {
      html += '<div class="mstat"><div><b>' + std(W) + '</b><span>gearbeitet in ' + monatName(ym) + '</span></div></div>' + (p.mitglied_id === D.ich.mitglied_id || admin ? '' : '');
    }
    const offen = E.filter(z => z.status !== 'freigegeben').length;
    html += (mo && mo.abgeschlossen ? '<div class="note" style="margin-bottom:10px">Monat abgeschlossen am ' + fmtD(String(mo.abschluss.erstellt || '').slice(0, 10)) + '. Der Monatsnachweis ist fertig für das Lohnbüro.</div>' :
      offen && !laufend ? '<div class="note warn" style="margin-bottom:10px">' + offen + ' Eintrag/Einträge noch nicht von Timo freigegeben. Der Monatsnachweis ist bis dahin vorläufig.</div>' : '') +
      '<div class="dlgbtns" style="justify-content:flex-start;margin:0 0 6px"><button class="btn sec" id="mpdf">Monatsnachweis als PDF</button>' +
      (admin && hatVertrag(p) && !laufend && mo && !mo.abgeschlossen ? '<button class="btn" id="mabs"' + (offen ? ' disabled title="Erst alle Einträge freigeben"' : '') + '>Monat abschließen</button>' : '') +
      (admin && mo && mo.abgeschlossen ? '<button class="btn danger" id="mauf">Abschluss aufheben</button>' : '') + '</div>';
    html += wochen.length ? wochen.map(w => '<div class="wkhead"><span>KW ' + esc(w.kw.slice(-2)) + '</span><span>' + std(minSumme(w.E)) + '</span></div>' + w.E.map(z => zeitRow(z)).join('')).join('') +
      '<div class="wkhead" style="border-bottom:0;color:var(--ink);font-size:15px"><span>Summe ' + monatName(ym) + '</span><span>' + std(W) + '</span></div>' : '<p class="empty">Keine Einträge in diesem Monat.</p>';
    html += '</div>';
    $('#main').innerHTML = html;
    $('#mop').onclick = () => { moOff--; vZeit(); };
    $('#mon').onclick = () => { if (moOff < 0) { moOff++; vZeit(); } };
    const h = $('#moh'); if (h) h.onclick = () => { moOff = 0; vZeit(); };
    const sp = $('#zpers'); if (sp) sp.onchange = () => { zPerson = sp.value; vZeit(); };
    $('#mpdf').onclick = async () => { const b = $('#mpdf'); b.disabled = true; try { await monatsPdf(zPerson, ym); } catch (e) { toast(e.message); } b.disabled = false; };
    const ab = $('#mabs'); if (ab) ab.onclick = async () => {
      ab.disabled = true;
      try { await api('monat_abschliessen', { mitglied_id: zPerson, monat: ym }); toast('Monat abgeschlossen'); await laden(true); } catch (e) { toast(e.message); ab.disabled = false; }
    };
    const au = $('#mauf'); if (au) au.onclick = async () => {

  const OFFICE = '../office/';
  // Das eingebettete Office meldet seine Höhe (gleiche Herkunft; andere Absender werden ignoriert)
  window.addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.typ !== 'ko-hoehe') return; document.querySelectorAll('iframe.offFrame').forEach(f => { if (f.contentWindow === e.source) f.style.height = Math.min(Math.max(Number(e.data.hoehe) || 0, 320), 4000) + 'px'; }); });
  const OFFICE_API = 'https://n8n.hm-storage.de/webhook/office-api';
  function vOffice() {
    const agenten = (D.mitglieder || []).filter(p => p.typ === 'agent');
    $('#main').innerHTML = '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><div><h1>KI Office</h1><p class="sub">Gemeinsame Übersicht über Projekte, Aufgaben, Agenten und ihre tatsächlich ausgeführte Arbeit. Dieselben Projekte und Aufgaben wie hier im Portal, dazu Agentenläufe, Freigaben und das virtuelle Büro.</p></div><a class="btn" href="' + OFFICE + '#/tab/projekte">KI Office öffnen →</a></div>' +
      '<div class="kpis" id="offKpis"><div class="kpi"><b>…</b><span>laufende Agentenaufträge</span></div><div class="kpi"><b>…</b><span>offene Freigaben</span></div><div class="kpi"><b>…</b><span>fehlgeschlagen / veraltet</span></div><div class="kpi"><b>…</b><span>Ergebnisse ohne Abnahme</span></div></div>' +
      '<div class="card" style="padding:0;overflow:hidden"><iframe class="offFrame" src="' + OFFICE + '?einbetten=1#/tab/buero" title="KI Office (eingebettet)" loading="lazy"></iframe></div>' +
      '<div class="grid">' +
      '<a class="card" href="' + OFFICE + '#/tab/agenten" style="text-decoration:none;color:inherit;margin:0"><h2>🤖 Agenten-Register</h2><p class="small muted">Rolle, Fähigkeiten, erlaubte Werkzeuge, Modell und jede Ausführung mit lesbarer Zeitleiste: Schritte, Werkzeugaufrufe, Quellen, Ergebnisse, Fehler, Freigaben.</p><div class="meta">' + agenten.map(p => '<span class="chip ki">' + esc(p.name) + '</span>').join('') + '</div></a>' +
      '<a class="card" href="' + OFFICE + '#/tab/buero" style="text-decoration:none;color:inherit;margin:0"><h2>🏢 Virtuelles Büro</h2><p class="small muted">Räume Akademie, Marketing, Vertrieb, Kundenprojekte, Verwaltung. Klick auf einen Raum filtert Projekte, Klick auf einen Agenten zeigt seine echte Arbeit.</p></a>' +
      '<a class="card" href="' + OFFICE + '#/tab/freigaben" style="text-decoration:none;color:inherit;margin:0"><h2>✅ Freigaben</h2><p class="small muted">E-Mails, Veröffentlichungen, Zahlungen und Löschungen führen Agenten nur mit einer Freigabe aus, die an den exakten Inhalt gebunden ist.</p></a>' +
      '<div class="card" style="margin:0"><h2>Wie es zusammenhängt</h2><p class="small muted">Das Office liest dieselben Daten wie das Portal (team_laden) und ergänzt Runs, Ereignisse, Ergebnisse und Freigaben über den n8n-Workflow „TEAM: Office-API“. Rückfragen und Berichte der Agenten erscheinen auch hier im Aufgabenverlauf. Doku: <code>docs/office/</code> im Repo.</p><p class="small muted" id="offStand"></p></div></div>';
    fetch(OFFICE_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ token: TOKEN, aktion: 'laden', daten: {} }) })
      .then(r => r.json()).then(j => {
        if (!j || j.ok === false) throw new Error((j && j.fehler) || 'Keine Antwort');
        const runs = j.runs || [], frei = (j.freigaben || []).filter(f => f.status === 'offen').length;
        const laufend = runs.filter(r => ['warteschlange', 'in_arbeit', 'wartet_rueckmeldung', 'wartet_freigabe'].includes(r.status)).length;
        const fehler = runs.filter(r => ['fehlgeschlagen', 'unbekannt'].includes(r.status)).length;
        const offen = runs.filter(r => r.status === 'abgeschlossen' && r.abgenommen == null).length;
        const el = $('#offKpis'); if (el) el.innerHTML = kpi(laufend, 'laufende Agentenaufträge') + kpi(frei, 'offene Freigaben', frei > 0) + kpi(fehler, 'fehlgeschlagen / veraltet', fehler > 0) + kpi(offen, 'Ergebnisse ohne Abnahme');
        const st = $('#offStand'); if (st) st.textContent = 'Office-API erreichbar, Stand ' + fmtDT(j.stand) + (j.quelle === 'testadapter' ? ' (TESTADAPTER, synthetische Daten)' : '') + '.';
      }).catch(e => {
        const el = $('#offKpis'); if (el) el.innerHTML = '<div class="note warn" style="grid-column:1/-1">Die Office-API antwortet noch nicht (' + esc(e.message) + '). Der n8n-Workflow „TEAM: Office-API“ muss erst importiert und aktiviert werden, siehe docs/office/SETUP.md im Repo.</div>';
      });
  }

  // ---------- Team ----------
  function vTeam() {
    if (agentAkte && istKI(agentAkte)) return vAgentAkte(agentAkte);
    const admin = istAdmin();
    const L = (D.mitglieder || []).slice().sort((a, b) => (a.status === 'gesperrt') - (b.status === 'gesperrt') || a.name.localeCompare(b.name));
    const offenVon = id => D.aufgaben.filter(a => a.verantwortlich === id && a.status !== 'Erledigt').length;
    $('#main').innerHTML = '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><div><h1>Team</h1><p class="sub">Wer bei Momentum was macht und wie ihr euch erreicht.</p></div>' + (admin ? '<button class="btn" id="neum">+ Mitglied</button>' : '') + '</div>' +
      '<div class="grid">' + L.map(p => '<div class="member">' + av(p.mitglied_id) + '<div style="min-width:0;flex:1"><b>' + esc(p.name) + '</b>' + (p.mitglied_id === D.ich.mitglied_id ? ' <span class="chip">Du</span>' : '') +
        (p.typ === 'agent' ? ' <span class="chip ki">KI-Agent</span>' : '') +
        '<div class="small muted">' + esc(p.funktion || ROLLE_TXT(p.rolle)) + (p.status !== 'aktiv' ? ' · <b style="color:var(--orange)">' + (p.status === 'eingeladen' ? 'noch nicht angemeldet' : esc(p.status)) + '</b>' : '') + '</div>' +
        '<div class="small" style="margin-top:6px;overflow-wrap:anywhere">' + (p.email ? '<a href="mailto:' + esc(p.email) + '">' + esc(p.email) + '</a><br>' : '') + (p.telefon ? '<a href="tel:' + esc(p.telefon) + '">' + esc(p.telefon) + '</a>' + (p.whatsapp_ok ? ' · WhatsApp ✓' : '') : '') + '</div>' +
        '<div class="small muted" style="margin-top:4px">' + offenVon(p.mitglied_id) + ' offene Aufgaben' + (hatVertrag(p) ? ' · Vertrag: ' + std(Math.round(Number(p.vertrag_std) * 60)) + ' pro Monat · Konto: ' + stdPM(kontoStand(p.mitglied_id).konto) : '') + '</div>' +
        '<div class="act">' + (p.typ === 'agent' ? '<button class="btn" style="padding:6px 10px" data-akte="' + esc(p.mitglied_id) + '">Akte öffnen</button>' : '') + (waNummer(p.telefon) && p.mitglied_id !== D.ich.mitglied_id ? '<a class="btn wa" style="padding:6px 10px" target="_blank" rel="noopener" href="https://wa.me/' + waNummer(p.telefon) + '">WhatsApp</a>' : '') +
        (p.mitglied_id === D.ich.mitglied_id ? '<button class="btn sec" style="padding:6px 10px" data-profil>Meine Daten ändern</button>' : '') +
        (p.typ !== 'agent' && (admin || p.mitglied_id === D.ich.mitglied_id) ? '<button class="btn sec" style="padding:6px 10px" data-vertrag="' + esc(p.mitglied_id) + '">Vertrag</button>' : '') +
        (admin ? '<button class="btn sec" style="padding:6px 10px" data-m="' + esc(p.mitglied_id) + '">Verwalten</button>' + (p.token ? '<button class="btn sec" style="padding:6px 10px" data-link="' + esc(p.mitglied_id) + '">' + (p.typ === 'agent' ? 'Agenten-Code kopieren' : 'Link kopieren') + '</button>' : '') : '') + '</div></div></div>').join('') + '</div>' +
      (admin ? '<div class="note" style="margin-top:6px"><b>Nur für dich als Admin:</b> „Link kopieren“ kopiert den persönlichen Zugangslink. Schick ihn nur an die Person selbst. Wird ein Link weitergegeben, erzeugst du unter „Verwalten“ einen neuen. Der alte funktioniert dann nicht mehr.</div>' : '') +
      '<div class="card" style="margin-top:14px"><h2>Abmelden</h2><p class="small muted">Entfernt die Anmeldung aus diesem Browser. Zum erneuten Anmelden brauchst du deinen persönlichen Link.</p><button class="btn sec" id="logout">Auf diesem Gerät abmelden</button></div>';
    const pb = $('[data-profil]'); if (pb) pb.onclick = profilDialog;
    document.querySelectorAll('[data-vertrag]').forEach(e => e.onclick = () => vertragDialog(e.dataset.vertrag));
    document.querySelectorAll('[data-akte]').forEach(b => b.onclick = () => { agentAkte = b.dataset.akte; setzeHash('#/agent/' + agentAkte); vTeam(); window.scrollTo(0, 0); });
    $('#logout').onclick = () => { ls.del('mt-token'); TOKEN = null; ohneZugang('Du bist abgemeldet.'); };
    if (admin) {
      $('#neum').onclick = () => mitgliedDialog(null);
      document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => mitgliedDialog(mitglied(b.dataset.m)));
      document.querySelectorAll('[data-link]').forEach(b => b.onclick = async () => {
        const p = mitglied(b.dataset.link); const url = p.typ === 'agent' ? p.token : PORTAL + '?z=' + p.token;
        try { await navigator.clipboard.writeText(url); toast((p.typ === 'agent' ? 'Agenten-Code für ' : 'Link für ') + p.name + ' kopiert'); }
        catch (e) { $('#dlgInner').innerHTML = '<h2>Link für ' + esc(p.name) + '</h2><div class="f"><input readonly value="' + esc(url) + '" onclick="this.select()"></div><div class="dlgbtns"><button class="btn" onclick="this.closest(\'dialog\').close()">Fertig</button></div>'; $('#dlg').showModal(); }
      });
    }
  }
  // ---------- Agenten-Akte ----------
  const akteTitel = p => 'Agenten-Akte: ' + p.name;
  function vAgentAkte(id) {
    const p = mitglied(id);
    const akte = (D.notizen || []).find(n => n.titel.toLowerCase() === akteTitel(p).toLowerCase());
    const A = D.aufgaben.filter(a => a.verantwortlich === id);
    const offen = A.filter(a => !['Erledigt', 'Wird getestet'].includes(a.status)).sort(sortAufgaben);
    const pruefen = A.filter(a => a.status === 'Wird getestet');
    const fertig = A.filter(a => a.status === 'Erledigt');
    const geeignet = D.aufgaben.filter(a => a.agent_geeignet === true && a.status !== 'Erledigt' && !a.verantwortlich.startsWith('agent-'));
    const V = (D.verlauf || []).filter(v => v.autor === id).sort((a, b) => String(b.erstellt).localeCompare(String(a.erstellt)));
    const zuletzt = V[0] ? fmtDT(V[0].erstellt) : 'noch nie';
    const titelVon = aid => (D.aufgaben.find(a => a.aufgabe_id === aid) || {}).titel || 'gelöschte Aufgabe';
    const kpi = (z, l, c) => '<div class="card" style="padding:14px 16px;flex:1;min-width:140px"><div style="font-size:26px;font-weight:800' + (c ? ';color:' + c : '') + '">' + z + '</div><div class="small muted">' + l + '</div></div>';
    $('#main').innerHTML = '<p class="small"><a href="#/tab/team" id="zurueck">← Zurück zum Team</a></p>' +
      '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:6px">' + av(id).replace('class="av ki"', 'class="av ki" style="width:56px;height:56px;font-size:28px"') +
      '<div style="flex:1;min-width:200px"><h1 style="margin:0">' + esc(p.name) + ' <span class="chip ki" style="vertical-align:middle">KI-Agent</span></h1><p class="sub" style="margin:2px 0 0">' + esc(p.funktion || '') + ' · zuletzt aktiv: ' + esc(zuletzt) + '</p></div>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ghost" id="aklink">🔗 Link kopieren</button><button class="btn" id="akneu">+ Aufgabe für ' + esc(p.name) + '</button></div></div>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0">' + kpi(offen.length, 'offen / in Arbeit') + kpi(pruefen.length, 'wartet auf Prüfung', pruefen.length ? 'var(--orange)' : '') + kpi(fertig.length, 'erledigt') + kpi(V.filter(v => v.art === 'bericht').length, 'Berichte geschrieben') + '</div>' +
      (pruefen.length ? '<div class="card" style="border-color:var(--orange)"><h2>Zur Prüfung</h2><p class="small muted">' + esc(p.name) + ' meldet diese Aufgaben als fertig. Bitte ansehen und auf „Erledigt“ setzen oder mit Kommentar zurückgeben.</p>' + pruefen.map(taskRow).join('') + '</div>' : '') +
      '<div class="card" style="margin-top:14px"><h2>Offene Aufgaben</h2>' + (offen.length ? offen.map(taskRow).join('') : '<p class="empty">Keine offenen Aufgaben.</p>') + '</div>' +
      '<div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><h2 style="margin:0">Akte</h2><button class="btn sec" id="akedit">' + (akte ? 'Akte bearbeiten' : 'Akte anlegen') + '</button></div>' +
        (akte ? '<div class="md" style="margin-top:10px">' + md(akte.inhalt) + '</div><p class="small muted">Zuletzt geändert von ' + esc(mitglied(akte.geaendert_von || akte.autor).name) + ', ' + fmtDT(akte.geaendert) + '</p>' : '<p class="empty">Noch keine Akte. Hier stehen Rolle, Stärken, Einrichtung und Regeln für ' + esc(p.name) + '.</p>') + '</div>' +
      '<div class="card" style="margin-top:14px"><h2>Letzte Berichte und Aktivitäten</h2>' + (V.length ? V.slice(0, 15).map(v => '<div class="vl ' + esc(v.art) + '">' + av(id) + '<div class="vt"><span class="small muted">' + fmtDT(v.erstellt) + ' · <a href="#/aufgabe/' + esc(v.aufgabe_id) + '">' + esc(titelVon(v.aufgabe_id)) + '</a></span>' + (v.art === 'status' ? '<div>' + esc(v.text) + '</div>' : '<div class="md">' + md(v.text) + '</div>') + '</div></div>').join('') : '<p class="empty">Noch keine Aktivität.</p>') + '</div>' +
      (geeignet.length ? '<div class="card" style="margin-top:14px"><h2>Für Agenten geeignet, noch bei Menschen</h2><p class="small muted">Diese Aufgaben könnten Agenten übernehmen. Zum Übergeben öffnen und „Zuständig“ ändern.</p>' + geeignet.sort(sortAufgaben).map(taskRow).join('') + '</div>' : '');
    bindTasks(); bindWikiLinks($('#main'));
    $('#zurueck').onclick = ev => { ev.preventDefault(); agentAkte = null; setzeHash('#/tab/team'); vTeam(); };
    $('#aklink').onclick = () => kopiereLink('#/agent/' + id, 'Akte ' + p.name);
    $('#akedit').onclick = () => akte ? notizDialog(akte) : notizDialog(null, akteTitel(p));
    $('#akneu').onclick = () => { aufgabeDialog(null); $('#a_v').value = id; $('#a_ki').checked = true; };
  }
  function profilDialog() {
    const i = D.mitglieder.find(p => p.mitglied_id === D.ich.mitglied_id) || D.ich;
    $('#dlgInner').innerHTML = '<h2>Meine Daten</h2><form id="mf"><div class="f"><label for="m_e">E-Mail-Adresse</label><input id="m_e" type="email" required value="' + esc(i.email) + '"></div>' +
      '<div class="f"><label for="m_t">Handynummer</label><input id="m_t" type="tel" placeholder="+49 170 1234567" value="' + esc(i.telefon) + '"></div>' +
      '<label class="check"><input type="checkbox" id="m_w"' + (i.whatsapp_ok ? ' checked' : '') + '><span>Per WhatsApp benachrichtigen, wenn mir jemand eine Aufgabe zuweist.</span></label>' +
      '<div class="dlgbtns" style="margin-top:14px"><button type="button" class="btn sec" id="m_c">Abbrechen</button><button class="btn" type="submit">Speichern</button></div></form>';
    const dlg = openDlg(false);
    $('#m_c').onclick = () => dlg.close();
    $('#mf').onsubmit = async ev => {
      ev.preventDefault(); const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
      try { await api('profil', { email: $('#m_e').value, telefon: $('#m_t').value, whatsapp_ok: $('#m_w').checked }); dlg.close(); toast('Gespeichert'); await laden(true); }
      catch (e) { toast(e.message); btn.disabled = false; }
    };
  }
  function mitgliedDialog(p) {
    const neu = !p;
    p = p || { name: '', funktion: '', rolle: 'team', status: 'eingeladen' };
    const selbst = p.mitglied_id === D.ich.mitglied_id;
    $('#dlgInner').innerHTML = '<h2>' + (neu ? 'Neues Teammitglied' : esc(p.name) + ' verwalten') + '</h2><form id="tf">' +
      '<div class="f2"><div class="f"><label for="t_n">Name</label><input id="t_n" required maxlength="60" value="' + esc(p.name) + '"></div>' +
      '<div class="f"><label for="t_f">Aufgabe im Team</label><input id="t_f" maxlength="60" value="' + esc(p.funktion) + '" placeholder="z. B. Vertrieb"></div>' +
      (p.typ === 'agent' ? '<div class="f"><label>Rolle</label><input disabled value="KI-Agent"></div>' : '<div class="f"><label for="t_r">Rolle</label><select id="t_r"' + (selbst ? ' disabled' : '') + '>' + opt(Object.keys(ROLLEN), p.rolle, v => ROLLEN[v]) + '</select></div>') +
      (!neu && !selbst ? '<div class="f"><label for="t_s">Zugang</label><select id="t_s">' + opt(['aktiv', 'eingeladen', 'gesperrt'], p.status, v => ({ aktiv: 'aktiv', eingeladen: 'eingeladen (noch nicht angemeldet)', gesperrt: 'gesperrt' }[v])) + '</select></div>' : '') + '</div>' +
      '<p class="small muted">Rollen: Admin verwaltet das Team. Dozent / Technik sieht Teilnehmer mit Namen und pflegt Systeme. Vertrieb und Team sehen Kursdaten nur zusammengefasst. Alle können Aufgaben und Social-Beiträge anlegen.</p>' +
      (!neu ? '<label class="check" style="margin-bottom:10px"><input type="checkbox" id="t_l"><span>Neuen Zugangslink erzeugen (der alte Link funktioniert dann nicht mehr)</span></label>' : '<p class="small muted">Nach dem Speichern kopierst du unter „Team“ den persönlichen Link und schickst ihn der Person.</p>') +
      '<div class="dlgbtns"><button type="button" class="btn sec" id="t_c">Abbrechen</button><button class="btn" type="submit">Speichern</button></div></form>';
    const dlg = openDlg(false);
    $('#t_c').onclick = () => dlg.close();
    $('#tf').onsubmit = async ev => {
      ev.preventDefault(); const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
      try {
        await api('mitglied_speichern', { mitglied_id: p.mitglied_id, name: $('#t_n').value, funktion: $('#t_f').value, rolle: selbst ? 'admin' : ($('#t_r') ? $('#t_r').value : p.rolle),
          status: $('#t_s') ? $('#t_s').value : undefined, neuer_link: !!($('#t_l') && $('#t_l').checked) });
        dlg.close(); toast('Gespeichert'); await laden(true);
      } catch (e) { toast(e.message); btn.disabled = false; }
    };
  }

  // Daten alle 2 Minuten im Hintergrund auffrischen, wenn kein Dialog offen ist
  setInterval(() => {
    const a = document.activeElement, tippt = a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
    if (D && !D.setup && !$('#dlg').open && !tippt && document.visibilityState === 'visible') { const y = window.scrollY; laden(true).then(() => window.scrollTo(0, y)); }
  }, 120000);
  leseHash();
  laden();
})();
</script>
</body></html>
