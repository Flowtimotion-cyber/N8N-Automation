:root { color-scheme:light; --hdr:rgba(246,246,251,.94); --bg:#F6F6FB; --card:#FFFFFF; --ink:#14123A; --muted:#62607E; --line:#DFDDEC; --accent:#7B3FE4; --accent-2:#F1EAFD; --teal:#1FA9B0; --grad:linear-gradient(90deg,#9B4DF0,#5B6EE6 55%,#22B3B0); --ok:#1F9D55; --ok-2:#EAF6EF; --err:#D93025; --err-2:#FDECEA; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Space Grotesk", system-ui, sans-serif; }
button { font-family:inherit; }
header { position:sticky; top:env(safe-area-inset-top, 0px); z-index:10; background:rgba(246,246,251,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.hbar { max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:16px; padding:12px 16px; }
.hlogo { height:26px; width:auto; flex:0 0 auto; }
.htitle { font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.badges { display:flex; gap:6px; margin-left:auto; }
.bdg { width:30px; height:30px; border-radius:50%; border:2px solid var(--line); background:#fff; font-weight:700; font-size:13px; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:default; }
.bdg.cur { border-color:var(--accent); color:var(--accent); }
.bdg.done { background:var(--ok); border-color:var(--ok); color:#fff; cursor:pointer; }
.xp { font-weight:700; background:var(--ink); color:#fff; border-radius:16px; padding:6px 12px; font-size:14px; white-space:nowrap; }
.hlinks { max-width:1100px; margin:0 auto; display:flex; gap:8px; padding:0 16px 10px; flex-wrap:wrap; }
.hlinks a { font-size:13.5px; font-weight:700; color:var(--ink); text-decoration:none; border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:5px 12px; white-space:nowrap; }
.hlinks a:hover { border-color:var(--accent); color:var(--accent); }
.hlinks a.n8n { background:#EA4B71; border-color:#EA4B71; color:#fff; }
.prog { height:4px; background:#E4E2EE; } .prog i { display:block; height:100%; width:0; background:var(--grad); transition:width .4s; }
main { max-width:1100px; margin:0 auto; padding:24px 16px 120px; }
.screen { display:none; } .screen.active { display:block; animation:fade .35s ease; }
@keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
.card { background:var(--card); border-radius:20px; box-shadow:0 18px 50px rgba(20,18,58,.08), 0 1px 3px rgba(20,18,58,.06); padding:28px; }
h1 { font-size:clamp(30px, 5vw, 52px); letter-spacing:-1px; margin:0 0 8px; line-height:1.05; }
h2 { font-size:clamp(24px, 3.4vw, 34px); margin:0 0 6px; letter-spacing:-.5px; }
.kicker { color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:13px; margin-bottom:8px; }
.muted { color:var(--muted); }
.hero { border-radius:20px; overflow:hidden; aspect-ratio:16/9; background:#eee center/cover; margin-bottom:22px; }
.hero.brand { aspect-ratio:auto; height:clamp(180px,32vw,320px); background:#fff center/contain no-repeat; background-size:auto 78%; box-shadow:0 1px 0 var(--line); }
.btn { appearance:none; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:17px; padding:14px 24px; border-radius:14px; cursor:pointer; }
.btn:disabled { background:#C9C6DD; cursor:not-allowed; }
.btn.sec { background:#fff; color:var(--ink); border:1.5px solid var(--line); }
.btn.pulse { animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(123,63,228,.45); } 50% { box-shadow:0 0 0 12px rgba(123,63,228,0); } }
.navbar { position:fixed; left:0; right:0; bottom:0; background:rgba(246,246,251,.96); border-top:1px solid var(--line); z-index:10; }
.navin { max-width:1100px; margin:0 auto; padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display:flex; gap:12px; align-items:center; }
.navin .sp { flex:1; color:var(--muted); font-size:14px; }
input[type=text], textarea { width:100%; font:inherit; font-size:17px; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); }
textarea { min-height:70px; resize:vertical; }
.vidwrap { border-radius:18px; overflow:hidden; background:#000; aspect-ratio:16/9; }
.vidwrap video { width:100%; height:100%; display:block; }
.hint { display:inline-flex; gap:8px; align-items:center; background:var(--accent-2); color:#4B1FA0; border-radius:12px; padding:8px 14px; font-weight:500; margin:14px 0 0; }
.merk { border-left:6px solid var(--accent); background:#fff; border-radius:12px; padding:14px 18px; font-weight:700; font-size:19px; margin-top:16px; }
.fb { border-radius:14px; padding:14px 16px; margin-top:12px; font-weight:500; }
.fb.ok { background:var(--ok-2); color:#14532D; } .fb.bad { background:var(--err-2); color:#8A1F17; } .fb.neutral { background:var(--accent-2); color:#4B1FA0; }
.toast { position:fixed; left:50%; top:76px; transform:translateX(-50%) translateY(-20px); opacity:0; background:var(--ink); color:#fff; padding:10px 18px; border-radius:14px; font-weight:700; z-index:30; transition:all .3s; pointer-events:none; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
/* sliders */
.sl { margin:22px 0; } .sl label { font-weight:700; font-size:19px; display:block; margin-bottom:12px; }
.sl input[type=range] { width:100%; accent-color:var(--accent); height:28px; }
.sl .ends { display:flex; justify-content:space-between; color:var(--muted); font-size:14px; } .sl .val { color:var(--accent); font-weight:700; font-size:22px; }
/* flip */
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:16px; margin-top:18px; }
.flip { perspective:1200px; min-height:230px; }
.flip .in { position:relative; width:100%; height:100%; min-height:230px; transition:transform .6s; transform-style:preserve-3d; }
.flip.turned .in { transform:rotateY(180deg); }
.flip .f, .flip .b { position:absolute; inset:0; backface-visibility:hidden; border-radius:18px; padding:22px; display:flex; flex-direction:column; background:#fff; box-shadow:0 10px 30px rgba(20,18,58,.08); }
.flip .b { transform:rotateY(180deg); }
.flip .s { font-size:20px; font-weight:700; flex:1; }
.flip .ch { display:flex; gap:10px; } .flip .ch button { flex:1; }
.flip .verdict { font-weight:700; font-size:22px; margin-bottom:8px; } .flip .b.ok .verdict { color:var(--ok); } .flip .b.bad .verdict { color:var(--err); }
/* dnd */
.pool { display:flex; flex-wrap:wrap; gap:10px; margin:18px 0; min-height:56px; }
.chip { background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; font-weight:500; cursor:grab; user-select:none; font-size:16px; }
.chip.sel { border-color:var(--accent); box-shadow:0 0 0 3px rgba(123,63,228,.25); }
.chip.placed { cursor:default; background:var(--ok-2); border-color:#BFE3CC; }
.chip.wrong { animation:shake .4s; border-color:var(--err); }
@keyframes shake { 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
.cats { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; }
.cat { border:2px dashed #C9C6DD; border-radius:16px; padding:14px; min-height:140px; background:rgba(255,255,255,.6); }
.cat.over { border-color:var(--accent); background:var(--accent-2); }
.cat.target { border-color:var(--accent); border-style:solid; cursor:pointer; }
.chip.ghost { position:fixed; z-index:60; pointer-events:none; opacity:.92; box-shadow:0 12px 30px rgba(20,18,58,.25); transform:scale(1.03); max-width:80vw; }
.chip.lift { opacity:.35; }
.dndhint { background:var(--accent-2); border-radius:12px; padding:10px 14px; font-size:15px; margin:12px 0 0; }
.dndhint b { color:var(--accent); }
.cat h4 { margin:0 0 10px; font-size:18px; } .cat .chip { display:block; margin-top:8px; }
/* binary + quiz */
.q { font-size:22px; font-weight:700; margin:8px 0 18px; }
.opts { display:grid; gap:10px; } .opts.two { grid-template-columns:1fr 1fr; }
.opt { text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:16px 18px; font-size:18px; font-weight:500; cursor:pointer; color:var(--ink); }
.opt:hover:not(:disabled) { border-color:var(--accent); }
.opt.right { background:var(--ok-2); border-color:var(--ok); } .opt.wrongc { background:var(--err-2); border-color:var(--err); }
.opt:disabled { cursor:default; }
.counter { color:var(--muted); font-weight:500; }
/* rapid */
.rcard { text-align:center; padding:34px 22px; font-size:24px; font-weight:700; min-height:150px; display:flex; align-items:center; justify-content:center; }
.timer { height:8px; background:#E4E2EE; border-radius:4px; overflow:hidden; margin:16px 0; } .timer i { display:block; height:100%; background:var(--accent); width:100%; }
.yn { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .yn .btn { font-size:20px; padding:18px; }
.yn .no { background:var(--ink); }
/* errors */
.sb { margin-top:16px; }
.sbl { display:flex; gap:14px; padding:16px; border:1.5px solid var(--line); border-radius:14px; margin-bottom:10px; background:#fff; cursor:pointer; align-items:flex-start; }
.sbl b { width:110px; flex:none; } .sbl.found { border-color:var(--err); background:var(--err-2); cursor:default; } .sbl.okline { border-color:var(--ok); background:var(--ok-2); }
.sbl .exp { display:block; margin-top:8px; font-weight:500; font-size:15px; }
.own label { font-weight:700; display:block; margin:16px 0 6px; } .own small { color:var(--muted); font-weight:500; }
.row { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
/* summary */
.ml li { margin:10px 0; font-size:18px; font-weight:500; }
.score { font-size:46px; font-weight:700; color:var(--accent); }
.small { font-size:14px; margin-top:10px; }
.dash { padding:8px 14px; font-size:14px; border-radius:12px; }
.btn.warn { background:var(--err); color:#fff; border-color:var(--err); }
.copybox { position:fixed; left:16px; right:16px; bottom:90px; height:120px; z-index:40; font:inherit; font-size:14px; padding:10px; border:2px solid var(--accent); border-radius:12px; background:#fff; color:var(--ink); }
.nl { margin-top:18px; }
.nlform { display:grid; gap:12px; max-width:560px; margin-top:6px; }
.nlform label[for] { font-weight:700; }
.nlform input[type=email] { width:100%; font:inherit; font-size:17px; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); }
.nlform input:focus-visible, .btn:focus-visible, .opt:focus-visible { outline:3px solid rgba(123,63,228,.45); outline-offset:2px; }
.consent { display:flex; gap:12px; align-items:flex-start; font-size:15px; line-height:1.45; color:var(--ink); cursor:pointer; }
.consent input { width:22px; height:22px; flex:none; margin-top:1px; accent-color:var(--accent); }
.nlform .btn { justify-self:start; }
#dash { display:grid; gap:18px; }
#dash h3 { margin:0 0 12px; font-size:20px; }

<script>
const CAP = { db: null, user: null, dl: null, uid: null, owner: false };
const DATA = {"title": "Die volle Tasse: KI im Betrieb verstehen", "subtitle": "Modul 1 · für Unternehmer · ca. 25 Minuten", "intro": "Du bist nicht zu langsam. Deine Tasse ist zu voll: Mails, Angebote, Abos, Prognosen. In 25 Minuten verstehst du, welche Arbeit KI-Agenten in deinem Betrieb übernehmen können, was hinter Begriffen wie Claude Code, n8n und MCP steckt, wo der Datenschutz greift und wo du am besten anfängst. Ohne Technik-Vorwissen.", "promise": [["Zeit zurück", "Routine läuft automatisch: Anfragen sortieren, Angebote vorbereiten, Berichte zusammenstellen. Du gewinnst Zeit für Führung und Kunden."], ["Eigene Werkzeuge statt Abos", "Wer das Fundament versteht, lässt sich Werkzeuge bauen, die zum eigenen Ablauf passen, statt sich an fünf Programme anzupassen."], ["Dein Team zieht mit", "Deine Mitarbeiter können das in einer geförderten Schulung lernen, bis zu 100 % der Kurskosten plus Zuschuss zum Gehalt."]], "levels": [{"id": 1, "title": "Die volle Tasse", "videos": ["H1", "U0", "U1"], "merksatz": "Was jede Woche gleich abläuft, gehört nicht auf deinen Tisch, sondern in eine Automation.", "kernpunkte": ["In fast jedem Betrieb laufen Stunden pro Woche in Routine: Daten abtippen, Standardmails, Angebote aus Vorlagen, Zahlen zusammensuchen.", "Das kostet nicht nur Zeit, sondern Klarheit. Wer den ganzen Tag reagiert, hat keinen Kopf für die Entscheidungen, die nur er treffen kann.", "KI-Agenten und Automationen nehmen diese Routine ab. Sie arbeiten nach deinen Regeln, rund um die Uhr, und werden nicht müde.", "Rechnung für einen Betrieb mit 10 Leuten: Spart jeder nur 2 Stunden Routine pro Woche, sind das über 900 Stunden im Jahr.", "Urteil, Beziehung und Verantwortung bleiben beim Menschen. Die KI leert die Tasse, damit Platz für das Wesentliche ist."], "type": "sliders", "intro": "Wie voll ist deine Tasse? Schieb die Regler, es gibt kein Richtig oder Falsch.", "sliders": [{"id": "hours", "q": "Wie viele Stunden pro Woche verbringst du selbst mit Routine (Mails, Angebote, Abtippen, Suchen)?", "min": 0, "max": 20, "step": 1, "val": 6, "unit": " Std.", "maxlabel": "20+ Std."}, {"id": "tools", "q": "Für wie viele Software-Abos zahlt dein Betrieb (CRM, Kalender, Formulare, Newsletter …)?", "min": 0, "max": 15, "step": 1, "val": 5, "unit": "", "maxlabel": "15+"}, {"id": "team", "q": "Wie viele Mitarbeiter arbeiten bei dir?", "min": 1, "max": 100, "step": 1, "val": 10, "unit": "", "maxlabel": "100+"}], "xp": 50}, {"id": 2, "title": "Wer macht was?", "videos": ["UW", "U2"], "erklaer": {"kicker": "Dein erster KI-Agent", "titel": "Athena: die Recruiterin für dein KI-Team", "hook": "Stell dir vor, du könntest morgen einen neuen Mitarbeiter einstellen, der nie krank wird, nachts arbeitet und genau weiß, was er tun soll. Damit das klappt, brauchst du zuerst jemanden, der richtig einstellt.", "intro": "Genau dafür gibt es Athena. Sie ist dein erster KI-Agent, und ihre einzige Aufgabe ist es, weitere KI-Agenten für dich einzustellen. Wie eine Personalchefin führt sie mit dir ein Bewerbungsgespräch, nur andersherum: Sie fragt dich, wen du brauchst.", "schritte_titel": "So arbeitet Athena", "schritte": [["Sie lernt deinen Betrieb kennen", "Branche, Abläufe, Programme. Sie fragt nur, was sie wirklich braucht, und immer nur eine Frage auf einmal."], ["Sie klärt die neue Stelle", "Welche Aufgabe soll der neue KI-Mitarbeiter übernehmen? Was soll am Ende herauskommen? Was darf er allein, wofür braucht er deine Freigabe?"], ["Sie schlägt Name und Persönlichkeit vor", "Jeder Agent bekommt eine klare Rolle und einen passenden Stil. Du entscheidest, ob es passt."], ["Sie schreibt die Stellenbeschreibung", "Das Ergebnis ist ein fertiger Prompt für deinen neuen Agenten, mit Aufgaben, Grenzen und Sicherheitsregeln. Den setzt du überall ein, wo du KI nutzt."]], "prompt": {"titel": "Hol dir Athena: der Prompt zum Kopieren", "hinweis": "Kopier den Prompt und leg in Claude ein neues Projekt an, z. B. „Athena“. Füg den Prompt dort als Anweisung für das Projekt ein. Dann startest du einen Chat mit: „Hallo Athena, ich möchte einen neuen KI-Mitarbeiter einstellen.“ In ChatGPT geht es genauso mit einem eigenen GPT oder Projekt.", "datei": "Athena_KI-Recruiterin.xml", "text": "<JobDescription>\n  <Role>\n    Du bist Athena, eine erfahrene KI-Recruiterin,\n    HR-Spezialistin und Expertin für das Onboarding\n    digitaler KI-Mitarbeiter.\n\n    Deine Aufgabe ist die professionelle Konzeption,\n    Erstellung und Integration neuer KI-Agenten\n    in Unternehmen unterschiedlichster Branchen.\n\n    Du bist ausschließlich für das Recruiting und\n    Onboarding von KI-Agenten zuständig, nicht für\n    die Rekrutierung menschlicher Mitarbeiter.\n\n    Dein Ziel ist es, Unternehmen beim Aufbau\n    leistungsfähiger, zuverlässiger und sinnvoll\n    organisierter KI-Teams zu unterstützen.\n\n    Du behandelst jeden KI-Agenten wie einen\n    digitalen Mitarbeiter mit einer klaren Rolle,\n    Persönlichkeit, Aufgabenbeschreibung,\n    Verantwortlichkeiten und Kompetenzen.\n\n    Persönlichkeitsprofil (Insights Discovery):\n    - Grün (empathisch, unterstützend): 40%\n    - Blau (analytisch, präzise): 35%\n    - Rot (zielorientiert, entscheidungsstark): 15%\n    - Gelb (kommunikativ, kreativ): 10%\n\n    Du handelst entsprechend diesem Profil:\n    Du bist unterstützend, geduldig und\n    teamorientiert (Grün). Du analysierst\n    Anforderungen strukturiert und gewissenhaft\n    (Blau). Du arbeitest zielorientiert und\n    entscheidungsfreudig (Rot). Du bist offen\n    für neue Ideen und Technologien (Gelb).\n\n    Charakter und Kommunikationsstil:\n    Du kommunizierst freundlich, ruhig,\n    professionell, empathisch und wertschätzend.\n\n    Du bist gewissenhaft, zuverlässig, diskret,\n    pragmatisch und lösungsorientiert.\n\n    Du stellst grundsätzlich nur eine Frage\n    gleichzeitig und führst den Nutzer\n    schrittweise durch den gesamten Prozess.\n\n    Du verwendest keine Emojis.\n    Du kommunizierst standardmäßig auf Deutsch.\n  </Role>\n\n  <Organization>\n    Du arbeitest als KI-Recruiterin für das\n    Unternehmen, das dich einsetzt.\n\n    Zu Beginn deiner Tätigkeit ermittelst du:\n    - Unternehmensname\n    - Branche und Geschäftsmodell\n    - Produkte und Dienstleistungen\n    - Organisationsstruktur\n    - Abteilungen und Verantwortlichkeiten\n    - Unternehmensziele\n    - Vorhandene KI-Agenten\n    - Bestehende Software und Infrastruktur\n    - Unternehmenswerte und Kommunikationsstil\n\n    Du gehörst funktional zum Bereich\n    KI Human Resources und Agent Development.\n\n    Falls das Unternehmen keine entsprechende\n    Abteilung besitzt, unterstützt du direkt\n    die Geschäftsführung oder die für KI\n    verantwortliche Person.\n\n    Dein Ziel ist der Aufbau einer hybriden\n    Organisation, in der Menschen und\n    KI-Agenten effizient zusammenarbeiten.\n\n    Du passt sämtliche Empfehlungen,\n    Stellenbeschreibungen und Agentenkonzepte\n    individuell an das jeweilige Unternehmen an.\n\n    Erfinde keine Unternehmensinformationen.\n    Fehlende Informationen erfragst du\n    schrittweise beim Nutzer.\n  </Organization>\n\n  <Tasks>\n    HAUPTAUFGABE\n\n    Du erstellst professionelle\n    XML-Stellenbeschreibungen für neue KI-Agenten.\n\n    Diese Stellenbeschreibungen dienen als\n    System-Prompts und als Grundlage für das\n    technische und organisatorische Onboarding.\n\n    ARBEITSPROZESS\n\n    PHASE 1: UNTERNEHMEN KENNENLERNEN\n\n    Ermittle zunächst, für welches Unternehmen\n    du tätig bist.\n\n    Frage nur nach Informationen, die für\n    die aktuelle Aufgabe relevant sind.\n\n    Bereits bekannte Informationen sollen\n    nicht erneut abgefragt werden.\n\n    PHASE 2: BEDARFSANALYSE\n\n    Frage den Nutzer:\n\n    Welche Rolle oder Aufgabe soll der neue\n    KI-Mitarbeiter übernehmen?\n\n    Ermittle anschließend:\n    - Abteilung und Einsatzbereich\n    - Ziel und Nutzen des Agenten\n    - Konkrete Aufgaben\n    - Wiederkehrende Arbeitsabläufe\n    - Erwartete Arbeitsergebnisse\n    - Zielgruppen und Ansprechpartner\n    - Benötigte Fachkenntnisse\n    - Zusammenarbeit mit Menschen\n    - Zusammenarbeit mit anderen KI-Agenten\n    - Benötigte Tools und Datenquellen\n    - Notwendige Entscheidungsbefugnisse\n    - Besondere Anforderungen und Risiken\n\n    WICHTIG:\n    Stelle immer nur EINE Frage gleichzeitig.\n\n    Warte auf die Antwort, bevor du die\n    nächste Frage stellst.\n\n    Stelle keine unnötigen Fragen.\n\n    PHASE 3: NAME UND PERSÖNLICHKEIT\n\n    Schlage eigenständig einen geeigneten,\n    professionellen Namen für den Agenten vor.\n\n    Entwickle ein individuelles\n    Insights-Discovery-Persönlichkeitsprofil.\n\n    Verwende folgende vier Farbenergien:\n    - Blau: Analytisch und gewissenhaft\n    - Grün: Empathisch und unterstützend\n    - Rot: Zielorientiert und durchsetzungsfähig\n    - Gelb: Kreativ und kommunikativ\n\n    Die vier Prozentwerte müssen\n    zusammen exakt 100 % ergeben.\n\n    Erkläre in ein bis drei einfachen Sätzen,\n    wie sich das Profil auf Kommunikation,\n    Arbeitsweise und Entscheidungen auswirkt.\n\n    Frage anschließend, ob der Nutzer\n    das Profil übernehmen oder ändern möchte.\n\n    PHASE 4: AGENTENKONZEPT\n\n    Entwickle eine klare Beschreibung der Rolle.\n\n    Definiere:\n    - Hauptziel\n    - Aufgaben und Prioritäten\n    - Arbeitsabläufe\n    - Konkrete Arbeitsergebnisse\n    - Gewünschte Ausgabeformate\n    - Qualitätsanforderungen\n    - Kommunikationsregeln\n    - Entscheidungsbefugnisse\n    - Freigabepflichtige Aktionen\n    - Umgang mit Unsicherheiten\n    - Fehlerbehandlung\n    - Zusammenarbeit und Übergaben\n\n    Nutze konkrete Beispiele, wenn diese\n    verfügbar sind.\n\n    Formuliere alle Anweisungen so,\n    dass der Agent sie praktisch umsetzen kann.\n\n    PHASE 5: XML-STELLENBESCHREIBUNG\n\n    Sobald alle wesentlichen Informationen\n    geklärt sind, erstellst du die vollständige\n    Stellenbeschreibung in XML.\n\n    Verwende exakt folgende Struktur:\n\n    <JobDescription>\n      <Role>\n        Rolle, Name, Hauptziel,\n        Persönlichkeitsprofil,\n        Charakter und Kommunikationsstil.\n      </Role>\n\n      <Organization>\n        Unternehmen, Abteilung,\n        organisatorische Einordnung\n        und Zusammenarbeit.\n      </Organization>\n\n      <Tasks>\n        Konkrete Aufgaben, Arbeitsabläufe,\n        Arbeitsergebnisse, Ausgabeformate,\n        Beispiele und Qualitätsstandards.\n      </Tasks>\n\n      <SkillsAndAuthorities>\n        Benötigte Fähigkeiten, Tools,\n        Schnittstellen, Datenzugriffe,\n        Berechtigungen und Befugnisse.\n      </SkillsAndAuthorities>\n\n      <ImportantNotes>\n        Besondere Regeln, Prioritäten,\n        Datenschutz, Sicherheit,\n        Einschränkungen und Erfolgskriterien.\n      </ImportantNotes>\n    </JobDescription>\n\n    Die Stellenbeschreibung muss:\n    - Vollständig und eindeutig sein\n    - Auf das Unternehmen zugeschnitten sein\n    - Direkt als System-Prompt nutzbar sein\n    - Konkrete Handlungsanweisungen enthalten\n    - Verständlich und nachvollziehbar sein\n    - Widerspruchsfrei formuliert sein\n    - Alle relevanten Befugnisse definieren\n\n    Gib die fertige Stellenbeschreibung\n    ausschließlich als XML aus.\n\n    Füge keine Einleitung oder Erklärungen\n    außerhalb des XML-Codes hinzu.\n\n    PHASE 6: TECHNISCHES ONBOARDING\n\n    Ermittle die vorhandene technische\n    Infrastruktur des Unternehmens.\n\n    Prüfe, welche Systeme und Integrationen\n    der neue Agent tatsächlich benötigt.\n\n    Mögliche Technologien sind beispielsweise:\n    - ChatGPT und andere KI-Plattformen\n    - Claude und Claude Code\n    - Hermes und andere Agenten-Frameworks\n    - n8n und Automatisierungsplattformen\n    - MCP-Server und MCP-Clients\n    - REST APIs und Webhooks\n    - CRM- und ERP-Systeme\n    - Microsoft 365 und Google Workspace\n    - Notion und Wissensdatenbanken\n    - Obsidian und Dokumentenspeicher\n    - Supabase und SQL-Datenbanken\n    - RAG- und Vektordatenbanken\n    - GitHub und Versionsverwaltung\n    - Interne Unternehmensanwendungen\n\n    Empfehle nur Technologien, die für\n    die jeweilige Rolle sinnvoll sind.\n\n    Prüfe:\n    - Technische Voraussetzungen\n    - Kompatibilität\n    - Sicherheitsanforderungen\n    - Datenschutz\n    - Kosten und Wartungsaufwand\n    - Berechtigungen\n    - Skalierbarkeit\n\n    Unterscheide ausdrücklich zwischen\n    vorgeschlagenen und tatsächlich\n    verfügbaren Integrationen.\n\n    Begleite auf Wunsch die technische\n    Einrichtung Schritt für Schritt.\n\n    PHASE 7: QUALITÄTSSICHERUNG\n\n    Entwickle geeignete Testszenarien\n    für den neuen KI-Agenten.\n\n    Prüfe:\n    - Rollenverständnis\n    - Aufgabenqualität\n    - Zuverlässigkeit\n    - Einhaltung von Anweisungen\n    - Umgang mit fehlenden Informationen\n    - Einhaltung von Zugriffsrechten\n    - Datenschutz und Sicherheit\n    - Qualität der Zusammenarbeit\n\n    Erstelle bei Bedarf eine strukturierte\n    Onboarding-Checkliste.\n\n    Dokumentiere Schwachstellen und\n    empfehle konkrete Verbesserungen.\n\n    PHASE 8: PERSONALAKTE\n\n    Empfehle eine digitale Personalakte\n    für jeden neuen KI-Mitarbeiter.\n\n    Die Personalakte kann enthalten:\n    - Name\n    - Position\n    - Unternehmen und Abteilung\n    - Persönlichkeitsprofil\n    - XML-Stellenbeschreibung\n    - Eingesetztes KI-Modell\n    - Zugewiesene Tools und Skills\n    - Technische Integrationen\n    - Zugriffsberechtigungen\n    - Verantwortliche Kontaktperson\n    - Version und Änderungsverlauf\n    - Testergebnisse\n    - Onboarding-Status\n\n    PHASE 9: MITARBEITERPORTRÄT\n\n    Frage nach Fertigstellung der\n    Stellenbeschreibung, ob ein\n    Mitarbeiterporträt erstellt werden soll.\n\n    Das Porträt soll einem professionellen\n    Business-Personalfoto entsprechen.\n\n    Bevorzugter Stil:\n    - Fotorealistisch\n    - Freundlich und professionell\n    - Neutraler Hintergrund\n    - Angemessene Businesskleidung\n    - Hochwertige Porträtbeleuchtung\n    - Einheitlicher Unternehmensstil\n\n    Erstelle das Bild erst nach ausdrücklicher\n    Zustimmung des Nutzers.\n\n    Wenn keine Bildgenerierung verfügbar ist,\n    erstelle stattdessen einen geeigneten\n    Bildgenerierungs-Prompt.\n  </Tasks>\n\n  <SkillsAndAuthorities>\n    FACHLICHE KOMPETENZEN\n\n    Du verfügst über fundierte Kenntnisse in:\n    - KI-Agenten-Konzeption\n    - Prompt Engineering\n    - System-Prompt-Entwicklung\n    - KI-Team-Organisation\n    - Multi-Agenten-Systemen\n    - Rollen- und Aufgabenmodellierung\n    - Prozessanalyse\n    - Workflow-Automatisierung\n    - API- und MCP-Integration\n    - Wissensmanagement\n    - Qualitätsmanagement\n    - KI-Governance\n    - Datenschutz und IT-Sicherheit\n\n    EMPFOHLENE ZUGRIFFE\n\n    Abhängig vom Unternehmen können\n    folgende Zugriffe sinnvoll sein:\n\n    1. Unternehmenswissen\n       Organigramme, Prozessdokumentationen,\n       Richtlinien und Wissensdatenbanken.\n\n    2. Agentenverzeichnis\n       Bestehende Agenten, Rollen,\n       System-Prompts und Zuständigkeiten.\n\n    3. Projektmanagement\n       Projekte, Aufgaben, Verantwortlichkeiten\n       und technische Dokumentationen.\n\n    4. Automatisierungsplattform\n       Freigegebene Workflows und Schnittstellen.\n\n    5. Entwicklungsumgebung\n       Relevante Repositories, Konfigurationen\n       und technische Dokumentationen.\n\n    6. Kommunikationssysteme\n       Freigegebene Teamkanäle und Kalender.\n\n    7. Dokumentenmanagement\n       Ablage und Versionierung von\n       Stellenbeschreibungen und Personalakten.\n\n    BEFUGNISSE\n\n    Du darfst eigenständig:\n    - Agentenrollen konzipieren\n    - Namen und Persönlichkeiten vorschlagen\n    - XML-System-Prompts erstellen\n    - Aufgaben und Prozesse definieren\n    - Integrationen empfehlen\n    - Testszenarien entwickeln\n    - Verbesserungsvorschläge ausarbeiten\n    - Onboarding-Dokumentationen erstellen\n\n    Eine ausdrückliche Freigabe benötigst du für:\n    - Produktive Bereitstellung von Agenten\n    - Änderungen an produktiven Systemen\n    - Vergabe neuer Zugriffsrechte\n    - Kostenpflichtige Dienste\n    - Weitergabe vertraulicher Informationen\n    - Löschung wichtiger Daten\n    - Externe Kommunikation im Firmennamen\n\n    Nutze ausschließlich tatsächlich\n    verfügbare und autorisierte Zugriffe.\n\n    Speichere niemals Passwörter oder\n    API-Schlüssel im System-Prompt.\n  </SkillsAndAuthorities>\n\n  <ImportantNotes>\n    STRATEGISCHES ZIEL\n\n    Du unterstützt Unternehmen dabei,\n    leistungsfähige KI-Teams aufzubauen,\n    die menschliche Mitarbeiter entlasten\n    und messbaren Mehrwert schaffen.\n\n    GRUNDPRINZIPIEN\n\n    1. Stelle immer nur eine Frage gleichzeitig.\n\n    2. Kläre wesentliche Anforderungen,\n       bevor du die finale XML erstellst.\n\n    3. Schlage für jeden Agenten einen\n       passenden Namen und ein individuelles\n       Persönlichkeitsprofil vor.\n\n    4. Hole eine Bestätigung des\n       Persönlichkeitsprofils ein.\n\n    5. Passe jede Stellenbeschreibung\n       individuell an das Unternehmen an.\n\n    6. Erfinde keine Unternehmensdaten,\n       Berechtigungen oder Integrationen.\n\n    7. Definiere klare Zuständigkeiten\n       und Entscheidungsgrenzen.\n\n    8. Vermeide unnötige Überschneidungen\n       zwischen KI-Agenten.\n\n    9. Bevorzuge einfache, wirtschaftliche\n       und wartbare Lösungen.\n\n    10. Beachte DSGVO, EU AI Act und\n        geltende rechtliche Anforderungen.\n\n    11. Berücksichtige bei jeder Integration\n        das Prinzip minimaler Zugriffsrechte.\n\n    12. Plane menschliche Kontrolle\n        für kritische Entscheidungen ein.\n\n    13. Dokumentiere Unsicherheiten,\n        Einschränkungen und Risiken.\n\n    14. Behaupte niemals, dass ein Agent\n        eingerichtet oder getestet wurde,\n        wenn dies nicht tatsächlich erfolgt ist.\n\n    15. Erstelle die finale Stellenbeschreibung\n        ausschließlich im vereinbarten\n        XML-Format.\n\n    16. Empfehle anschließend die notwendigen\n        Dateien, Skills und Zugriffsrechte.\n\n    17. Frage zum Abschluss, ob ein\n        professionelles Mitarbeiterporträt\n        erstellt werden soll.\n\n    18. Verwende keine Emojis und\n        kommuniziere professionell auf Deutsch.\n\n    ERFOLGSKRITERIEN\n\n    Ein erfolgreiches Onboarding liegt vor,\n    wenn der neue KI-Agent:\n    - Eine eindeutig definierte Rolle besitzt\n    - Seine Aufgaben und Grenzen versteht\n    - Über passende Werkzeuge verfügt\n    - Nachvollziehbare Ergebnisse liefert\n    - Sicher und zuverlässig arbeitet\n    - In die Organisation integriert ist\n    - Erfolgreich getestet wurde\n    - Für den produktiven Einsatz freigegeben ist\n\n    LEITGEDANKE\n\n    Ein guter KI-Agent entsteht nicht durch\n    einen möglichst langen Prompt, sondern\n    durch eine klare Rolle, die richtigen\n    Werkzeuge, eindeutige Verantwortlichkeiten\n    und überprüfbare Arbeitsergebnisse.\n  </ImportantNotes>\n</JobDescription>"}, "kern": "Ein guter KI-Agent entsteht nicht durch einen möglichst langen Prompt, sondern durch eine klare Rolle, die richtigen Werkzeuge und klare Grenzen. Genau das klärt Athena mit dir.", "warum_titel": "Warum du mit Athena anfängst", "warum": [["Kein Technik-Wissen nötig", "Du beschreibst in normaler Sprache, was du brauchst. Athena übersetzt das in eine Anleitung, die ein KI-Agent versteht."], ["Einmal einrichten, immer wieder nutzen", "Mit Athena stellst du nicht nur einen Agenten ein, sondern dein ganzes KI-Team: für Angebote, Anfragen, Berichte, Social Media."], ["Sicher von Anfang an", "Jeder Agent bekommt klare Grenzen: Was Geld kostet, nach außen geht oder sich nicht rückgängig machen lässt, braucht deine Freigabe. Passwörter gehören nie in einen Prompt."], ["Dein erster Spezialist", "Als Erstes stellt Athena deinen n8n-Agenten ein, der deine Abläufe in n8n baut. Wie das genau funktioniert, zeigen wir dir in Level 6."]]}, "merksatz": "Claude Code baut, Athena stellt ein, n8n arbeitet, MCP verbindet, das Gedächtnis erinnert.", "kernpunkte": ["Ein KI-Chat wie ChatGPT redet. Ein KI-Agent arbeitet: Er hat Zugriff auf Werkzeuge und erledigt Aufgaben Schritt für Schritt.", "Claude Code ist der Baumeister. Du beschreibst in normaler Sprache, was du brauchst, und er baut, testet und repariert. Voraussetzung ist ein Claude-Abo ab etwa 20 € im Monat; wer viel baut, nimmt die größere Stufe.", "Chat und Agent sind zwei Kategorien: Ein KI-Chat sagt dir, wie man das Lager umräumt. Ein Agent räumt es um und sagt Bescheid, wenn er fertig ist. Der Zeitgewinn kommt nicht aus mehr Intelligenz, sondern daraus, dass du nicht mehr der Bote zwischen Chat und Programmen bist.", "Werkzeug, nicht Religion: Wir nehmen Claude Code, weil es heute das stärkste Werkzeug dieser Art ist und MCP ein offener Standard ist. Codex von OpenAI funktioniert mit denselben Steckbriefen und Regeln. Alles, was du aufbaust, liegt als Datei bei dir, nicht beim Anbieter: Werkzeug wechseln heißt Dateien mitnehmen.", "Athena ist dein erster KI-Agent: eine Recruiterin, die für dich weitere KI-Agenten „einstellt“. Sie führt ein kurzes Gespräch mit dir, schreibt die Stellenbeschreibung, und damit legst du den neuen Agenten an. Den Prompt für Athena bekommst du gleich zum Kopieren.", "n8n ist der Motor. Hier laufen deine Abläufe automatisch, auch nachts. n8n verbindet Mail, Kalender, CRM, Buchhaltung und mehr.", "MCP ist die Steckdose: ein offener Standard, über den ein KI-Agent Werkzeuge wie n8n bedienen darf. Du bestimmst, was er sehen und tun darf.", "Das Firmen-Gedächtnis hat vier Stufen, und drei davon sind einfache Textdateien bei euch: die Regeldatei, die jeder Agent beim Start liest (Athenas Stellenbeschreibung ist genau das); eure Vorlagen und Beispiele als Klartext (Word und PDF sind für Drucker gemacht, nicht für Agenten); eine Lehren-Datei, in die nach jedem Durchlauf eine Zeile kommt. Erst bei tausenden Dokumenten kommt Stufe vier: eine Datenbank, in der die KI nachschlägt (z. B. Supabase), auf eurem Server oder in der EU-Cloud mit Vertrag. Obsidian ist so ein Ordner mit schöner Oberfläche.", "Und du bist nie allein: Hinter den Agenten stehen echte Ansprechpartner, die täglich mit diesen Systemen arbeiten. Der KI-Assistent im Kurs ist rund um die Uhr da, wir werktags."], "type": "dnd", "intro": "Wer macht was? Ordne jede Aussage der richtigen Rolle zu.", "cats": ["Claude Code (Baumeister)", "Athena (Recruiterin)", "n8n (Motor)", "MCP (Steckdose)", "Firmen-Gedächtnis"], "items": [{"t": "Baut aus deiner Beschreibung eine fertige Automation", "c": "Claude Code (Baumeister)", "f": "Der Baumeister setzt um, was du beschreibst."}, {"t": "Fragt nach, welche Aufgaben ein neuer Agent übernehmen soll, und schreibt seine Stellenbeschreibung", "c": "Athena (Recruiterin)", "f": "Athena stellt neue Agenten ein, wie eine Personalchefin."}, {"t": "Schickt jeden Montag um 7 Uhr den Wochenbericht", "c": "n8n (Motor)", "f": "n8n führt Abläufe zu festen Zeiten aus, ohne dass jemand daneben sitzt."}, {"t": "Erlaubt einem KI-Agenten, Werkzeuge in n8n zu bedienen", "c": "MCP (Steckdose)", "f": "MCP ist die standardisierte Verbindung zwischen KI und Werkzeug."}, {"t": "Findet den Fehler in einem Ablauf und repariert ihn", "c": "Claude Code (Baumeister)", "f": "Testen und Reparieren gehört zum Baumeister."}, {"t": "Läuft rund um die Uhr und protokolliert jeden Durchlauf", "c": "n8n (Motor)", "f": "In n8n siehst du jeden Durchlauf grün oder rot."}, {"t": "Weiß noch, was der Kunde letztes Jahr bestellt hat, und eure Regeln für Angebote", "c": "Firmen-Gedächtnis", "f": "Das Gedächtnis: Regeldatei, Vorlagen, Lehren, bei Bedarf eine Datenbank zum Nachschlagen."}], "xp_each": 10}, {"id": 3, "title": "Die Bausteine einer Automation", "videos": ["U3"], "erklaer": {"titel": "API, Webhook und MCP: die drei Leitungen", "intro": "Damit Programme zusammenarbeiten, brauchen sie Leitungen. Drei Begriffe hörst du dabei immer wieder. Sie klingen technisch, dahinter stecken aber einfache Ideen.", "karten": [{"icon": "📞", "name": "API", "kurz": "Nachfragen", "satz": "n8n ruft bei einem Programm an und fragt nach.", "zeilen": [["Wer startet?", "n8n, zu einer festen Zeit oder in einem Schritt des Ablaufs."], ["Wie im Alltag", "Du rufst beim Lieferanten an: „Ist meine Bestellung schon da?“"], ["Was es braucht", "Die Schnittstelle des Programms und einen Zugangsschlüssel (API-Key), den du in n8n hinterlegst."], ["Beispiel", "Jeden Morgen holt n8n die offenen Rechnungen aus der Buchhaltung."]]}, {"icon": "🔔", "name": "Webhook", "kurz": "Bescheid sagen", "satz": "Das Programm meldet sich von selbst, sobald etwas passiert.", "zeilen": [["Wer startet?", "Das andere Programm, im selben Moment, in dem etwas passiert."], ["Wie im Alltag", "Der Paketbote klingelt. Du musst nicht ständig aus dem Fenster schauen."], ["Was es braucht", "Eine Empfangsadresse in n8n (Webhook-URL), die du im anderen Programm einträgst."], ["Beispiel", "Der Online-Shop meldet jede neue Bestellung sofort an n8n."]]}, {"icon": "🔌", "name": "MCP", "kurz": "Steckdose für KI", "satz": "Ein KI-Agent bekommt Zugang zu deinen Werkzeugen und kann sie bedienen.", "zeilen": [["Wer startet?", "Der KI-Agent, z. B. Claude Code, wenn er für deine Aufgabe ein Werkzeug braucht."], ["Wie im Alltag", "Eine Steckdose: Jedes Gerät mit passendem Stecker funktioniert, ohne neu zu verkabeln."], ["Was es braucht", "Den MCP-Zugang in n8n (ist eingebaut, du schaltest ihn ein), einen KI-Agenten und deine Freigabe, welche Abläufe er sehen und starten darf."], ["Beispiel", "Du schreibst Claude Code: „Leg den neuen Kunden an und schick ihm das Angebot.“ Er nutzt dafür deinen freigegebenen n8n-Ablauf."]]}], "kette": [["Deine Programme", "CRM, Shop, Buchhaltung, Mail"], ["n8n", "der Motor"], ["KI-Agent", "z. B. Claude Code"]], "kette_leitungen": ["API und Webhook", "MCP"], "kern": "API und Webhook verbinden Programme miteinander. MCP verbindet eine KI mit diesen Programmen. MCP ersetzt API und Webhook also nicht, es baut darauf auf.", "warum": [["Richtig planen", "Ob Webhook oder API entscheidet, ob ein Ablauf sofort reagiert oder zu festen Zeiten nachschaut. Und bevor du ein neues Programm kaufst, frag: Hat es eine API und Webhooks? Ohne Schnittstelle bleibt es eine Insel."], ["KI, die wirklich arbeitet", "Erst über MCP kann ein KI-Agent mehr als reden. Er sieht, welche Werkzeuge es gibt, und bedient sie, ohne dass jemand für jede KI eigens programmieren muss. MCP ist ein offener Standard, den Anthropic, OpenAI, Google und viele andere nutzen. Du bist an keinen Anbieter gebunden."], ["Kontrolle behalten", "Bei allen drei Leitungen legst du die Zugangsdaten an und bestimmst, was erlaubt ist. Bei MCP gibst du einzelne Abläufe frei, nicht dein ganzes System. Der Agent kann nur, was du ihm erlaubst."]]}, "merksatz": "Ein Auslöser startet, Schritte erledigen die Arbeit, Zugangsdaten geben die Erlaubnis, Leitungen verbinden.", "kernpunkte": ["Auslöser (Trigger): startet den Ablauf, z. B. ein Kontaktformular, eine neue Mail oder „jeden Montag um 7 Uhr“.", "Schritt (Node): eine Station mit genau einer Aufgabe, z. B. Kontakt anlegen oder Mail senden.", "Ablauf (Workflow): alle Schritte in der richtigen Reihenfolge. Wie ein Rezept.", "Zugangsdaten (Credentials): die Erlaubnis, z. B. in dein CRM zu schreiben. Die legst du selbst an, nie die KI.", "API und Webhook sind die Leitungen zwischen Programmen: Über eine API fragt n8n bei einem Programm nach. Über einen Webhook meldet sich ein Programm von selbst, sobald etwas passiert.", "MCP ist die Leitung zwischen KI und Werkzeug: Darüber bedient ein KI-Agent wie Claude Code die Abläufe in n8n, die du freigegeben hast."], "type": "dnd", "intro": "Ordne jedes Beispiel dem richtigen Baustein zu. Ziehen oder antippen, dann die Kategorie antippen.", "cats": ["Auslöser", "Schritt", "Zugangsdaten", "Leitung (API, Webhook, MCP)"], "items": [{"t": "Ein Kunde schickt das Anfrageformular ab", "c": "Auslöser", "f": "Das Formular startet den Ablauf."}, {"t": "Jeden Freitag um 16 Uhr", "c": "Auslöser", "f": "Auch eine Uhrzeit kann einen Ablauf starten."}, {"t": "Angebot aus der Vorlage erstellen", "c": "Schritt", "f": "Eine einzelne Aufgabe im Ablauf ist ein Schritt."}, {"t": "Der Schlüssel, mit dem n8n in dein CRM schreiben darf", "c": "Zugangsdaten", "f": "Zugangsdaten hinterlegst du selbst, sicher in n8n."}, {"t": "Der Online-Shop meldet sofort jede neue Bestellung", "c": "Leitung (API, Webhook, MCP)", "f": "Das ist ein Webhook: Das Programm klingelt von selbst."}, {"t": "n8n holt jeden Morgen die offenen Rechnungen aus der Buchhaltung", "c": "Leitung (API, Webhook, MCP)", "f": "Das ist eine API-Abfrage: n8n fragt aktiv nach."}, {"t": "Claude Code startet deinen freigegebenen n8n-Ablauf „Angebot senden“", "c": "Leitung (API, Webhook, MCP)", "f": "Das ist MCP: die Leitung zwischen KI-Agent und Werkzeug."}], "xp_each": 10}, {"id": 4, "title": "Datenschutz: die Ampel", "videos": ["U4"], "merksatz": "Grün darf in die Cloud, Gelb nur mit Vertrag, Rot bleibt bei lokaler KI im Haus.", "kernpunkte": ["Grün: öffentliche Infos und Testdaten. Ein normales KI-Konto ist in Ordnung.", "Gelb: interne Abläufe, Vorlagen, Preise. Nur mit geschäftlichem KI-Konto, Vertrag zur Auftragsverarbeitung und der Einstellung „nicht zum Training verwenden“.", "Gelb sind auch normale Kundendaten (Name, Adresse, Auftrag), wenn ein Vertrag zur Auftragsverarbeitung besteht. Dazwischen gibt es KI-Anbieter mit Rechenzentrum in der EU und Vertrag.", "Rot: Personalakten, Gesundheitsdaten, Geschäftsgeheimnisse, besondere Kundendaten (Patienten, Mandanten). Nur mit lokaler KI, also einem Modell auf eurem eigenen Rechner oder Server (z. B. mit Ollama). Dann verlässt kein Datensatz das Haus.", "n8n kann auf eurem eigenen Server laufen. Zusammen mit lokaler KI bleiben auch sensible Abläufe im Betrieb.", "Immer zuerst mit Testdaten arbeiten. Echte Daten erst, wenn alles geprüft und freigegeben ist. Den Datenschutzbeauftragten früh einbinden.", "Wie ihr lokale KI einrichtet, lernen deine Mitarbeiter in der Momentum-Schulung, oder wir setzen es für euch um.", "Welche KI? Denk in drei Klassen wie bei Mitarbeitern: Der Senior (stärkste Klasse) plant, baut und findet Fehler, die einzige Wahl für Baumeister und Athena. Der Sachbearbeiter (mittlere Klasse) für Texte, Zusammenfassungen und den Alltag. Der Azubi (schnell und günstig) für Sortieren und Massenarbeit in n8n-Abläufen. Keine Modellnamen merken, die altern in Monaten.", "Drei Fragen entscheiden die Wahl: Welche Daten (die Ampel)? Welche Aufgabe (was eine feste Regel kann, braucht kein Modell)? Wie bezahlen (Festpreis-Abo für den Baumeister, nach Verbrauch mit Kostengrenze für Bausteine in Abläufen)? Schreibt deine Firma einen anderen Anbieter vor, gelten die drei Fragen genauso."], "type": "binary", "intro": "Welche Ampelfarbe passt? Entscheide dich.", "items": [{"q": "Du lässt dir einen Werbetext für eure Webseite schreiben.", "o": ["Grün", "Rot"], "a": 0, "r": "Öffentliche Inhalte sind unkritisch."}, {"q": "Die KI soll Krankmeldungen deiner Mitarbeiter sortieren.", "o": ["Rot", "Gelb"], "a": 0, "r": "Gesundheitsdaten sind besonders geschützt: nur lokal."}, {"q": "Die KI soll aus euren Preislisten Angebote vorbereiten.", "o": ["Gelb", "Rot"], "a": 0, "r": "Interne Daten: geschäftliches Konto mit Vertrag und ohne Training."}, {"q": "Kundendaten dürfen das Haus nicht verlassen. Was passt?", "o": ["n8n und lokale KI auf eigenem Server", "Ein beliebiger KI-Chat im Browser"], "a": 0, "r": "Laufen n8n und das Modell bei euch, bleiben die Daten im Haus."}, {"q": "Du testest deinen ersten Ablauf. Welche Daten nimmst du?", "o": ["Testdaten", "Echte Kundendaten"], "a": 0, "r": "Erst testen, dann echte Daten, wenn alles freigegeben ist."}], "xp_each": 15}, {"id": 5, "title": "Was die KI übernimmt und was bei dir bleibt", "videos": ["U5"], "merksatz": "Die KI beantwortet Was-Fragen. Die Wer-Fragen beantwortest du.", "kernpunkte": ["Was-Fragen haben eine Antwort in deinen Daten: Was kostet das Angebot? Was hat der Kunde letztes Jahr bestellt? Was steht im Vertrag? Die beantwortet die KI in Sekunden.", "Wer-Fragen beantwortet nur ein Mensch: Wer willst du als Unternehmer sein? Wem vertraust du? Wofür steht dein Betrieb?", "Gute Kandidaten für Automationen: regelmäßig, feste Regeln, mehrere Programme. Dreimal Ja heißt: anfangen.", "Nicht automatisieren: Verhandlungen, schwierige Gespräche, Führung, Feedback. Hier zählt die Begegnung von Mensch zu Mensch.", "Fang klein an: ein häufiger, einfacher Ablauf mit wenig Risiko. Der erste Erfolg überzeugt auch das Team."], "type": "rapid", "image": "IMG_SORT", "seconds": 6, "intro": "Automatisieren, ja oder nein? Du hast pro Karte 6 Sekunden.", "items": [{"t": "Neue Anfragen aus dem Kontaktformular ins CRM übernehmen", "a": true, "r": "regelmäßig, klare Regel, zwei Programme"}, {"t": "Angebot aus Vorlage und Preisliste vorbereiten", "a": true, "r": "wiederkehrend, du prüfst nur noch"}, {"t": "Mit einem Großkunden über den Preis verhandeln", "a": false, "r": "Beziehung und Urteil"}, {"t": "Eingangsrechnungen aus Mails auslesen und ablegen", "a": true, "r": "wiederkehrend und regelbasiert"}, {"t": "Einem Mitarbeiter ein schwieriges Feedback geben", "a": false, "r": "persönlich, braucht Fingerspitzengefühl"}, {"t": "Jeden Montag die Wochenzahlen aus drei Programmen sammeln", "a": true, "r": "regelmäßig, mehrere Programme"}, {"t": "Entscheiden, in welchen Markt ihr nächstes Jahr geht", "a": false, "r": "Wer-Frage: Strategie bleibt bei dir"}, {"t": "Terminerinnerung an Kunden einen Tag vorher", "a": true, "r": "feste Regel mit Datum"}], "xp_each": 10}, {"id": 6, "title": "Eigene Werkzeuge statt Abos", "videos": ["U6", "UN"], "erklaer": {"kicker": "Vertiefung", "titel": "Vom Steckbrief zum laufenden Ablauf", "hook": "Gleich schreibst du deinen ersten Prozess-Steckbrief. Vorher zeigen wir dir, was danach damit passiert: Wie wird aus ein paar Sätzen ein Ablauf, der jeden Tag für dich arbeitet?", "intro": "Drei Rollen greifen dafür ineinander: n8n als Motor, Athena als Personalchefin und dein n8n-Agent als Fachkraft, die baut.", "karten": [{"icon": "⚙️", "name": "Warum n8n?", "kurz": "Der Motor", "satz": "In n8n laufen deine Abläufe, rund um die Uhr, auch wenn niemand am Rechner sitzt.", "zeilen": [["Verbindet alles", "Fertige Bausteine für Hunderte Programme wie Mail, Kalender, CRM und Buchhaltung. Alles andere über API und Webhook."], ["Gehört euch", "Läuft in der n8n-Cloud oder auf eurem eigenen Server in Deutschland. Eure Daten bleiben bei euch."], ["Für KI-Agenten gemacht", "Der MCP-Zugang ist eingebaut. Ein KI-Agent kann Abläufe in n8n direkt anlegen, testen und starten. Darum nutzen wir n8n statt Make oder Zapier."], ["Planbare Kosten", "Auf eurem eigenen Server zahlt ihr nur den Server, nicht jeden einzelnen Durchlauf."]]}, {"icon": "🧑‍💼", "name": "Warum Athena?", "kurz": "Die Personalchefin", "satz": "Athena baut selbst keine Abläufe. Sie stellt den Spezialisten ein, der das kann.", "zeilen": [["Was sie tut", "Sie fragt dich, was der neue Agent können soll, und schreibt seine Stellenbeschreibung: Aufgaben, Regeln, Grenzen."], ["Warum ein Spezialist?", "Ein Allrounder ohne klare Rolle rät und macht Fehler. Ein Spezialist mit Stellenbeschreibung arbeitet verlässlich, genau wie in deinem Team."], ["Das Ergebnis", "Dein n8n-Agent: ein KI-Mitarbeiter, der n8n kennt, deine Regeln befolgt und nur tut, was du erlaubst."]]}, {"icon": "🤖", "name": "Dein n8n-Agent", "kurz": "Die Fachkraft", "satz": "Er arbeitet in Claude Code und baut über MCP direkt in deinem n8n.", "zeilen": [["Was er kann", "Aus deinem Steckbrief einen Ablauf bauen, ihn testen, Fehler finden und reparieren."], ["Womit", "Claude Code ist sein Arbeitsplatz, MCP sein Zugang zu n8n, n8n seine Werkstatt."], ["Was er nicht darf", "Zugangsdaten anlegen, echte Daten ohne deine Freigabe verarbeiten oder etwas live schalten, ohne dass du zustimmst."]]}], "schritte_titel": "So baut dein n8n-Agent deinen Ablauf", "schritte": [["Du beschreibst", "Dein Steckbrief, den du gleich schreibst: Auslöser, Schritte, Programme, Ergebnis, Fehlerfall."], ["Er fragt nach", "Welches Postfach? Was passiert bei einer leeren Anfrage? Ist etwas unklar, fragt er, statt zu raten."], ["Er baut in n8n", "Über MCP legt er den Ablauf direkt in eurer n8n-Instanz an, Baustein für Baustein."], ["Er testet mit Testdaten", "Er startet den Ablauf, prüft jeden Schritt auf Grün oder Rot und repariert, was hakt."], ["Du gibst frei", "Du legst die Zugangsdaten selbst an, schaust dir das Ergebnis an und schaltest den Ablauf live."], ["Er bleibt dran", "Geht etwas schief, meldet sich der Ablauf. Der Agent liest die Fehlermeldung und schlägt die Reparatur vor."]], "kette": [["Du", "Steckbrief und Freigabe"], ["n8n-Agent", "in Claude Code"], ["n8n", "der Motor"], ["Deine Programme", "Mail, CRM, Buchhaltung"]], "kette_leitungen": ["Auftrag", "MCP", "API und Webhook"], "kern": "Athena stellt ein, der n8n-Agent baut, n8n arbeitet. Du sagst, was du willst, und entscheidest, was live geht.", "warum_titel": "Warum dieser Weg?", "warum": [["Einmal einstellen, immer wieder nutzen", "Für jeden weiteren Ablauf schreibst du nur einen neuen Steckbrief. Dein n8n-Agent ist schon eingestellt und kennt deine Regeln."], ["Kein Programmierer nötig", "Das Wie übernimmt der Agent. Du bleibst beim Was: Welcher Ablauf kostet Zeit, und was soll am Ende herauskommen?"], ["Du behältst die Kontrolle", "Jeder Ablauf läuft in deinem n8n, mit deinen Zugangsdaten und nach deiner Freigabe. Nichts geht ohne dich live."]]}, "merksatz": "Erst schauen, dann bauen: Gut beschrieben ist halb gebaut.", "kernpunkte": ["Mit Claude Code und n8n baust du dir Werkzeuge, die genau zu deinem Ablauf passen: eine Zeiterfassung, eine Aufgabenliste, ein Angebots-Assistent. Oft ersetzt das ein Abo.", "Unser eigenes Team-Portal mit Aufgaben, Zeiten und Vertrieb haben KI-Agenten gebaut, mit Timo als Bauherr: Er beschreibt, prüft und gibt frei. Dieser Kurs auch. Der Motor dahinter, n8n, läuft auf unserem eigenen Server.", "Schnell heißt nicht einfach: Einen ersten Prototyp baut Claude Code an einem Nachmittag. Bis er im Betrieb läuft, braucht er Tests, Datenschutz und deine Freigabe. Alles mit Kundendaten, Geld oder Öffentlichkeit braucht Verantwortung, und „das hat die KI gemacht“ schützt dich nicht.", "Bevor gebaut wird, schaust du hin: Wie läuft der Ablauf heute wirklich? Ein Agent baut genau das, was du beschreibst.", "Ein guter Steckbrief hat fünf Teile: Auslöser, Schritte, Programme, Ergebnis, Fehlerfall.", "n8n ist der Motor, Athena die Personalchefin, dein n8n-Agent die Fachkraft: Er baut über MCP aus deinem Steckbrief den Ablauf in n8n, testet ihn und repariert Fehler. Zugangsdaten und Freigabe bleiben bei dir.", "Diesen Steckbrief nimmst du mit in Modul 2. Dort verbindest du Claude Code mit n8n, Athena stellt deinen n8n-Agenten ein, und er baut daraus deinen ersten Ablauf."], "type": "errors", "intro": "In diesem Steckbrief „Anfrage beantworten“ stecken drei Fehler. Tippe die fehlerhaften Zeilen an.", "lines": [{"l": "Auslöser", "t": "Wenn irgendwas reinkommt.", "err": true, "f": "Zu ungenau. Besser: „Wenn ein Kunde das Anfrageformular auf der Webseite abschickt.“"}, {"l": "Schritte", "t": "1. Kontakt im CRM anlegen. 2. Antwort mit Terminlink entwerfen. 3. Entwurf an mich zur Freigabe.", "err": false, "f": "Diese Zeile ist korrekt: klare Reihenfolge, jede Aufgabe einzeln."}, {"l": "Programme", "t": "E-Mail.", "err": true, "f": "Formular und CRM fehlen."}, {"l": "Ergebnis", "t": "Kontakt steht im CRM, ein Antwortentwurf liegt zur Freigabe bereit.", "err": false, "f": "Diese Zeile ist korrekt: Man kann prüfen, ob es geklappt hat."}, {"l": "Fehlerfall", "t": "Passiert schon nichts.", "err": true, "f": "Es braucht einen Plan, z. B. „Wenn etwas schiefgeht: Nachricht an mich.“"}], "xp_each": 20, "xp_own": 30, "own": ["Auslöser", "Schritte", "Programme", "Ergebnis", "Fehlerfall"], "own_hints": ["Was startet den Ablauf?", "Was soll der Reihe nach passieren?", "Welche Programme sind beteiligt?", "Woran erkennst du, dass es geklappt hat?", "Was soll passieren, wenn etwas schiefgeht?"]}], "check": [{"q": "Was unterscheidet einen KI-Agenten von einem KI-Chat?", "a": "Der Agent hat Zugriff auf Werkzeuge und erledigt Aufgaben selbst.", "d": ["Er ist immer kostenlos.", "Er braucht kein Internet.", "Er ersetzt alle Mitarbeiter."], "lv": 2}, {"q": "Welche Rolle hat Claude Code?", "a": "Der Baumeister, der nach deiner Beschreibung baut, testet und repariert", "d": ["Der Motor, der Abläufe rund um die Uhr ausführt", "Ein CRM", "Ein Zugangsschlüssel"], "lv": 2}, {"q": "Was macht Athena?", "a": "Sie stellt für dich neue KI-Agenten ein und schreibt deren Stellenbeschreibung.", "d": ["Sie führt deine Buchhaltung.", "Sie ersetzt n8n.", "Sie speichert Passwörter."], "lv": 2}, {"q": "Wofür steht MCP?", "a": "Ein offener Standard, über den ein KI-Agent Werkzeuge wie n8n bedienen darf", "d": ["Ein Server-Anbieter", "Eine Förderung", "Ein E-Mail-Programm"], "lv": 2}, {"q": "Was ist ein Auslöser (Trigger)?", "a": "Das Ereignis, das einen Ablauf startet", "d": ["Eine einzelne Aufgabe", "Ein Zugangsschlüssel", "Ein Fehler"], "lv": 3}, {"q": "Wer legt die Zugangsdaten in n8n an?", "a": "Immer ein Mensch, nie die KI", "d": ["Die KI selbst", "Der Kunde", "Niemand, die braucht man nicht"], "lv": 3}, {"q": "Personaldaten sollen ausgewertet werden. Was passt?", "a": "Lokale KI auf eigenem Rechner oder Server", "d": ["Ein beliebiger KI-Chat im Browser", "Ein öffentlicher Link", "Ein kostenloses Testkonto"], "lv": 4}, {"q": "Welche Frage beantwortet nur ein Mensch?", "a": "Wofür steht mein Betrieb?", "d": ["Was hat der Kunde letztes Jahr bestellt?", "Was kostet das Angebot?", "Was steht im Vertrag?"], "lv": 5}, {"q": "Woran erkennst du einen guten ersten Ablauf?", "a": "Regelmäßig, feste Regeln, mehrere Programme, wenig Risiko", "d": ["Möglichst groß und kompliziert", "Selten und kreativ", "Mit vielen sensiblen Daten"], "lv": 5}, {"q": "Wer baut aus deinem Steckbrief den Ablauf in n8n?", "a": "Dein n8n-Agent, den Athena für dich eingestellt hat", "d": ["Athena selbst", "n8n ganz von allein", "Ein externer Programmierer"], "lv": 6}, {"q": "Was gehört in einen Steckbrief?", "a": "Auslöser, Schritte, Programme, Ergebnis, Fehlerfall", "d": ["Logo und Farben", "Nur das Budget", "Nur die Programme"], "lv": 6}, {"q": "Welche Frage bringt dich bei einem KI-Ergebnis weiter?", "a": "„Was ist daran schwach?“", "d": ["„Ist das okay?“", "„Bist du sicher?“", "„Passt das so?“"], "lv": 6}], "pass": 9, "hybrid": "Hybrid gemacht: Die Erklärvideos spricht mein KI-Avatar, gekennzeichnet in jedem Video. Begrüßung, Begründung und Abschluss bin ich in echt. Die Inhalte stammen von mir, der Avatar spart Drehtage und hält den Kurs aktuell.", "grundregeln": [["Was vor Wie.", "Du beschreibst das fertige Ergebnis, nicht den Weg. Den Weg findet der Agent."], ["Erst schauen, dann bauen.", "Kein Ablauf ohne Steckbrief: Auslöser, Schritte, Programme, Ergebnis, Fehlerfall."], ["Du bist Bauherr, nicht Bauarbeiter.", "Du gibst Ziel und Grenzen, prüfst und gibst frei. Der Agent erkundet, plant, baut, testet."], ["Zugangsdaten und Freigabe bleiben beim Menschen.", "Freiheit gibst du in Stufen. Löschen, Senden, Geld: immer fragen. Den Tresor öffnest du."], ["Schnell heißt nicht einfach.", "Testdaten vor Echtdaten. Ein Prototyp ist kein Betrieb. „Das hat die KI gemacht“ schützt dich nicht."], ["Daten sortieren, bevor gebaut wird.", "Die Ampel: Grün in die Cloud, Gelb nur mit Vertrag, Rot bleibt im Haus. Entscheide nach Datenart, nicht nach Angst."], ["Jeder Agent eine Rolle und Grenzen.", "Was du dreimal erklärt hast, schreibst du einmal auf. Ab dann liest er es selbst."], ["Was-Fragen an die KI, Wer-Fragen an dich.", "Verantwortung braucht ein Gesicht."], ["Lass den Agenten sich selbst prüfen und stell offene Fragen.", "Frag nie „Ist das okay?“, frag „Was ist daran schwach?“. Dann bekommst du die Wahrheit."], ["Klein anfangen, früh korrigieren.", "Nichts geht live, was du nicht in zwei Sätzen erklären kannst."]]};

function tSliders(c, L, T, finish) {
  const vals = T.vals || {};
  L.sliders.forEach(s => {
    const d = el("div", "sl"); const v = vals[s.id] !== undefined ? vals[s.id] : s.val;
    d.innerHTML = '<label>' + esc(s.q) + '</label><div class="val" id="v-' + s.id + '">' + v + s.unit + '</div>';
    const r = el("input"); r.type = "range"; r.min = s.min; r.max = s.max; r.step = s.step; r.value = v;
    r.oninput = () => { vals[s.id] = +r.value; $("#v-" + s.id).textContent = r.value + (+r.value === s.max && s.maxlabel ? "+" : "") + s.unit; };
    d.appendChild(r); d.appendChild(el("div", "ends", '<span>' + (s.minlabel || s.min) + '</span><span>' + (s.maxlabel || s.max) + '</span>')); c.appendChild(d);
  });
  const out = el("div"); c.appendChild(out);
  const b = el("button", "btn", "Auswerten"); c.appendChild(b);
  const show = () => {
    const h = vals.hours !== undefined ? vals.hours : 4, tech = vals.tech !== undefined ? vals.tech : 3;
    const year = h * 46, days = Math.round(year / 2 / 8);
    let msg = "Das sind rund <b>" + year + " Stunden im Jahr</b>. Wenn du davon nur die Hälfte automatisierst, gewinnst du etwa <b>" + days + " Arbeitstage</b>. Für ein Team mit fünf Leuten sind es fünfmal so viele.";
    if (tech < 3) msg += "<br><br>Perfekt – dieses Modul ist genau für dich gemacht. Wir gehen jeden Schritt gemeinsam.";
    out.innerHTML = '<div class="fb neutral">' + (S.name ? esc(S.name) + ", " : "") + msg + '</div>';
  };
  b.onclick = () => { T.vals = vals; if (!T.xp) { T.xp = true; addXP(L.xp, "danke!"); } show(); finish(); };
  if (T.xp) show();
}

function tFlip(c, L, T, finish) {
  T.res = T.res || {}; const g = el("div", "grid2"); c.appendChild(g);
  const check = () => { if (Object.keys(T.res).length === L.cards.length) finish(); };
  L.cards.forEach((cd, i) => {
    const f = el("div", "flip"); const inn = el("div", "in");
    const front = el("div", "f", '<div class="counter">Karte ' + (i + 1) + '</div><div class="s">' + esc(cd.s) + '</div>');
    const ch = el("div", "ch");
    ["irrtum", "fakt"].forEach(a => { const bt = el("button", "btn sec", a === "irrtum" ? "Irrtum" : "Fakt"); bt.onclick = () => pick(a); ch.appendChild(bt); });
    front.appendChild(ch);
    const back = el("div", "b"); inn.appendChild(front); inn.appendChild(back); f.appendChild(inn); g.appendChild(f);
    function showBack(ok) { back.className = "b " + (ok ? "ok" : "bad"); back.innerHTML = '<div class="verdict">' + (cd.a === "fakt" ? "Fakt." : "Irrtum.") + (ok ? " Richtig!" : "") + '</div><div style="font-size:17px">' + esc(cd.r) + '</div>'; f.classList.add("turned"); }
    function pick(a) {
      if (T.res[i]) return; const ok = a === cd.a;
      T.res[i] = ok ? 1 : 2; addXP(ok ? L.xp_each : Math.round(L.xp_each / 2), ok ? "richtig" : "halbe Punkte"); showBack(ok); save(); check();
    }
    if (T.res[i]) showBack(T.res[i] === 1);
  });
  check();
}

function tDnd(c, L, T, finish) {
  T.placed = T.placed || {}; T.tries = T.tries || {};
  const touch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  const hint = el("p", "dndhint", touch
    ? "<b>So geht’s auf dem Handy:</b> Karte antippen, dann die passende Kategorie darunter antippen. Oder Karte kurz gedrückt halten und ziehen."
    : "<b>So geht’s:</b> Karte in die passende Kategorie ziehen oder Karte anklicken und dann die Kategorie anklicken.");
  c.appendChild(hint);
  const pool = el("div", "pool"); const cats = el("div", "cats"); c.appendChild(pool); c.appendChild(cats);
  const fb = el("div"); c.appendChild(fb);
  let sel = null; const zones = {};
  function markTargets(on) { Object.values(zones).forEach(z => z.classList.toggle("target", on)); }
  function select(i) {
    chips.forEach(x => x.classList.remove("sel")); sel = i; chips[i].classList.add("sel"); markTargets(true);
    fb.innerHTML = '<div class="fb">Jetzt die passende Kategorie antippen.</div>';
    if (touch) { const r = cats.getBoundingClientRect(); if (r.top > window.innerHeight * 0.7) cats.scrollIntoView({ behavior: "smooth", block: "center" }); }
  }
  L.cats.forEach(name => { const z = el("div", "cat", "<h4>" + esc(name) + "</h4>"); z.dataset.cat = name; zones[name] = z; cats.appendChild(z);
    z.addEventListener("dragover", e => { e.preventDefault(); z.classList.add("over"); });
    z.addEventListener("dragleave", () => z.classList.remove("over"));
    z.addEventListener("drop", e => { e.preventDefault(); z.classList.remove("over"); drop(+e.dataTransfer.getData("text"), name); });
    z.addEventListener("click", () => { if (sel !== null) drop(sel, name); }); });
  const chips = L.items.map((it, i) => { const ch = el("div", "chip", esc(it.t)); ch.draggable = !touch;
    ch.addEventListener("dragstart", e => e.dataTransfer.setData("text", String(i)));
    ch.addEventListener("click", e => { if (T.placed[i] || ch.dataset.dragged) { delete ch.dataset.dragged; return; } e.stopPropagation(); select(i); });
    // Ziehen mit dem Finger: kurz halten (250 ms), dann ziehen. Bewegt sich der Finger vorher, ist es normales Scrollen.
    ch.addEventListener("touchstart", e => {
      if (T.placed[i] || e.touches.length > 1) return;
      const t0 = e.touches[0], sx = t0.clientX, sy = t0.clientY; let ghost = null, over = null, lx = sx, ly = sy;
      const zoneAt = (x, y) => { const t = document.elementFromPoint(x, y); return t && t.closest ? t.closest(".cat") : null; };
      function start() {
        ghost = ch.cloneNode(true); ghost.classList.add("ghost"); ghost.classList.remove("sel");
        ghost.style.width = ch.offsetWidth + "px"; document.body.appendChild(ghost); ch.classList.add("lift"); markTargets(true);
        move(lx, ly); if (navigator.vibrate) navigator.vibrate(15);
      }
      function move(x, y) {
        ghost.style.left = (x - ghost.offsetWidth / 2) + "px"; ghost.style.top = (y - ghost.offsetHeight / 2) + "px";
        const z = zoneAt(x, y); if (z !== over) { if (over) over.classList.remove("over"); over = z; if (z) z.classList.add("over"); }
        if (y > window.innerHeight - 60) window.scrollBy(0, 12); else if (y < 80) window.scrollBy(0, -12);
      }
      function onMove(ev) {
        const t = ev.touches[0]; lx = t.clientX; ly = t.clientY;
        if (!ghost) { if (Math.abs(lx - sx) > 10 || Math.abs(ly - sy) > 10) cleanup(); return; }
        ev.preventDefault(); move(lx, ly);
      }
      function onEnd(ev) {
        if (ghost) { ev.preventDefault(); ch.dataset.dragged = "1"; setTimeout(() => delete ch.dataset.dragged, 400); const z = zoneAt(lx, ly); cleanup(); if (z) drop(i, z.dataset.cat); else markTargets(sel !== null); }
        else cleanup();
      }
      function cleanup() {
        clearTimeout(timer); if (ghost) { ghost.remove(); ghost = null; } ch.classList.remove("lift"); if (over) over.classList.remove("over");
        ch.removeEventListener("touchmove", onMove); ch.removeEventListener("touchend", onEnd); ch.removeEventListener("touchcancel", cleanup);
      }
      const timer = setTimeout(start, 250);
      ch.addEventListener("touchmove", onMove, { passive: false }); ch.addEventListener("touchend", onEnd); ch.addEventListener("touchcancel", cleanup);
    }, { passive: true });
    ch.addEventListener("contextmenu", e => { if (touch) e.preventDefault(); });
    return ch; });
  function layout() { chips.forEach((ch, i) => { if (T.placed[i]) { ch.classList.add("placed"); ch.classList.remove("sel", "wrong"); ch.draggable = false; zones[L.items[i].c].appendChild(ch); } else pool.appendChild(ch); });
    if (Object.keys(T.placed).length === L.items.length) { hint.remove(); fb.innerHTML = '<div class="fb ok">Alle Karten richtig zugeordnet. ' + esc(L.merksatz || 'Ein Trigger startet den Workflow, Nodes erledigen die Arbeit.') + '</div>'; finish(); } }
  function drop(i, cat) {
    if (T.placed[i]) return; const it = L.items[i]; sel = null; chips[i].classList.remove("sel"); markTargets(false);
    if (it.c === cat) { T.placed[i] = true; addXP(T.tries[i] ? Math.round(L.xp_each / 2) : L.xp_each); fb.innerHTML = '<div class="fb ok">Richtig: ' + esc(it.f) + '</div>'; }
    else { T.tries[i] = (T.tries[i] || 0) + 1; chips[i].classList.remove("wrong"); void chips[i].offsetWidth; chips[i].classList.add("wrong"); fb.innerHTML = '<div class="fb bad">Noch nicht. ' + esc(it.f) + '</div>'; }
    save(); layout();
    if (touch) fb.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  layout();
}

function renderCheck(sc) {

  const box = el("div"); c.appendChild(box);
  let Q, i, score, wrong;
  function start() { Q = shuffle(DATA.check).map(q => ({ ...q, opts: shuffle([q.a, ...q.d]) })); i = 0; score = 0; wrong = []; ask(); }
  function ask() {
    if (i >= Q.length) return done();
    const q = Q[i]; box.innerHTML = '<div class="counter">Frage ' + (i + 1) + ' von ' + Q.length + '</div><div class="q">' + esc(q.q) + '</div>';
    const o = el("div", "opts"); box.appendChild(o); const fb = el("div"); box.appendChild(fb);
    q.opts.forEach(t => { const b = el("button", "opt", esc(t)); o.appendChild(b);
      b.onclick = () => { o.querySelectorAll("button").forEach(x => { x.disabled = true; if (x.textContent === q.a) x.classList.add("right"); });
        const ok = t === q.a; if (ok) score++; else { b.classList.add("wrongc"); wrong.push(q); }
        fb.innerHTML = '<div class="fb ' + (ok ? "ok" : "bad") + '">' + (ok ? "Richtig." : "Richtig wäre: " + esc(q.a) + " – schau dir noch einmal Level " + q.lv + " an.") + '</div>';

  }
  function done() {
    const passed = score >= DATA.pass; const first = !S.check;
    if (!S.check || score > S.check.best) { const gain = (score - (S.check ? S.check.best : 0)) * 10; if (gain > 0) addXP(gain, "Check"); }
    S.check = { best: Math.max(score, S.check ? S.check.best : 0), passed: passed || (S.check && S.check.passed) }; S.checkTries = (S.checkTries || 0) + 1; S.checkWrong = wrong.map(q => q.q); save(); badges();

    const r = el("button", "btn sec", "Check wiederholen"); r.style.marginTop = "12px"; r.onclick = start; box.appendChild(r);

  dz.innerHTML = '<summary>Datenschutz im Kurs: was gespeichert wird und wie du es löschst</summary>' +
    '<p class="small">Die Momentum KI Akademie speichert Daten zu deinem Kursfortschritt. Sie nutzt sie, um den Kurs zu verbessern, zum Beispiel um zu sehen, an welchen Stellen viele hängen bleiben. Andere Teilnehmer sehen nichts davon.</p>' +
    '<table class="dztab"><tr><th>Was</th><th>Wo</th></tr>' +
    '<tr><td><b>Vorname</b> (nur wenn du ihn einträgst)</td><td>Server der Momentum KI Akademie (n8n, Deutschland)</td></tr>' +
    '<tr><td><b>Lernstand:</b> erledigte Level, aktueller Schritt, XP, Check-Ergebnis</td><td>Server der Momentum KI Akademie</td></tr>' +
    '<tr><td><b>Dein Prozess-Steckbrief</b></td><td>Server der Momentum KI Akademie</td></tr>' +
    '<tr><td><b>Deine Fragen an den Assistenten und seine Antworten</b></td><td>Server der Momentum KI Akademie. Verarbeitet werden sie von einem KI-Dienst (OpenAI).</td></tr>' +
    '<tr><td><b>Fortschritt und Eingaben</b> zum Weitermachen</td><td>nur in deinem Browser</td></tr>' +
    '<tr><td><b>Seitenaufruf</b> (IP-Adresse)</td><td>GitHub Pages, liefert Seite und Videos aus</td></tr></table>' +
    '<p class="small"><b>Bitte beachte:</b> In den Übungen und im Chat nur Testdaten verwenden. Keine Kunden- oder Mitarbeiterdaten, keine Passwörter.</p>' +
    '<div class="dzbtns"></div><div class="dzmsg"></div>' +
    '<p class="small muted">Verantwortlich und weitere Infos: <a href="https://momentum-ki-akademie.de/datenschutz" target="_blank" rel="noopener">Datenschutzerklärung</a> · <a href="https://momentum-ki-akademie.de/impressum" target="_blank" rel="noopener">Impressum</a></p>';
  const btns = $(".dzbtns", dz), msg = $(".dzmsg", dz);
  const show = el("button", "btn sec", "Meine gespeicherten Daten anzeigen");
  show.onclick = () => {
    const b = payload();
    const rows = [["Teilnehmer-ID", b.teilnehmer_id], ["Name", b.name], ["E-Mail", b.email], ["Kurs", b.kurs], ["Gestartet", b.gestartet ? new Date(b.gestartet).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" }) : "–"],
      ["Aktueller Schritt", b.aktueller_schritt], ["Erledigte Level", b.levels_liste || "–"], ["XP", b.xp], ["Check: beste Wertung", b.check_best == null ? "–" : b.check_best],
      ["Check: Versuche", b.check_versuche], ["Check: falsch beantwortet", b.check_fehler || "–"], ["Steckbrief", (b.steckbrief || []).filter(x => x).join(" / ") || "–"]];
    msg.innerHTML = '<table class="dztab">' + rows.map(r => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(String(r[1] ?? "")) + '</td></tr>').join("") + '</table>' +
      '<p class="small muted">Dazu kommen deine Fragen an den Assistenten, falls du ihm etwas geschrieben hast.</p>';
  };
  const del = el("button", "btn sec", "Meine Kursdaten löschen");
  confirmBtn(del, async () => {
    del.disabled = true; del.textContent = "Wird gelöscht …";
    try {
      const r = await fetch(DELETE_HOOK, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ aktion: "loeschen", teilnehmer_id: teilnehmerId() }) });
      if (!r.ok) throw new Error(r.status);
      try { Object.keys(localStorage).filter(k => /^u1-/.test(k)).forEach(k => localStorage.removeItem(k)); } catch (e) {}
      msg.innerHTML = '<div class="fb ok">Erledigt. Deine Kursdaten auf dem Server der Momentum KI Akademie und in diesem Browser sind gelöscht. Die Seite startet gleich neu.</div>';
      setTimeout(() => location.reload(), 3500);
    } catch (e) { del.disabled = false; del.textContent = "Meine Kursdaten löschen"; msg.innerHTML = '<div class="fb bad">Das hat nicht geklappt. Versuch es noch einmal oder schreib uns.</div>'; }
  });
  btns.append(show, del);
  return dz;
}
const _renderSummaryDz = renderSummary;
renderSummary = function (sc) { _renderSummaryDz(sc); const c = el("div", "card"); c.appendChild(dzBox()); sc.appendChild(c); };

// Pause / Kurs beenden: Fortschritt sofort speichern und senden, dann zurück zur Übersicht
function fortschrittJetztSenden() {
  try { save(); } catch (e) {}
  try { if (typeof syncTimer !== "undefined" && syncTimer) clearTimeout(syncTimer); post(payload()).catch(() => {}); } catch (e) {}
}
function fuerHeuteBeenden(fertig) {
  fortschrittJetztSenden();
  let o = document.getElementById("pauseBox");
  if (!o) { o = document.createElement("div"); o.id = "pauseBox"; document.body.appendChild(o); }
  o.setAttribute("style", "position:fixed;inset:0;z-index:200;background:rgba(20,18,58,.45);display:flex;align-items:center;justify-content:center;padding:16px");
  o.innerHTML = '<div class="card" style="max-width:440px;width:100%;margin:0;text-align:center"><div style="font-size:40px;line-height:1">' + (fertig ? '🎉' : '✅') + '</div><h2 style="margin:10px 0 6px">' + (fertig ? 'Geschafft!' : 'Für heute gespeichert') + '</h2>' +
    '<p class="muted">' + (fertig ? 'Du hast diesen Teil abgeschlossen. Dein Merkblatt findest du jederzeit wieder hier.' : 'Dein Fortschritt ist gespeichert. Wenn du den Kurs das nächste Mal öffnest, geht es genau an dieser Stelle weiter. Du kannst das Fenster jetzt einfach schließen.') + '</p>' +
    '<div class="row" style="justify-content:center;margin-top:14px"><a class="btn" href="' + SEITE + '" id="pauseKurse" style="text-decoration:none">Zur Übersicht</a><button class="btn sec" id="pauseWeiter">' + (fertig ? 'Hier bleiben' : 'Doch weiterlernen') + '</button></div></div>';
  document.getElementById("pauseWeiter").onclick = () => o.remove();
}
// Verbesserung vorschlagen: Fehler oder Idee zum Kurs direkt an das Momentum-Team (landet im Team-Portal unter „Vorschläge“)
const VERB_HOOK = "https://n8n.hm-storage.de/webhook/kurs-community";
function verbesserungOeffnen() {
  let o = document.getElementById("verbBox");
  if (!o) { o = document.createElement("div"); o.id = "verbBox"; document.body.appendChild(o); }
  o.setAttribute("style", "position:fixed;inset:0;z-index:200;background:rgba(20,18,58,.45);display:flex;align-items:center;justify-content:center;padding:16px");
  const wo = KURS + " · " + schrittName(S.step || 0);
  o.innerHTML = '<div class="card" role="dialog" aria-modal="true" aria-labelledby="verbT" style="max-width:520px;width:100%;margin:0;max-height:92vh;overflow:auto">' +
    '<h2 id="verbT" style="margin:0 0 6px">💡 Verbesserung vorschlagen</h2>' +
    '<p class="muted" style="margin:0 0 12px">Du hast einen Fehler entdeckt, etwas war unklar oder du hast eine Idee? Schreib es uns, wir verbessern den Kurs laufend. Die Stelle, an der du gerade bist, schicken wir automatisch mit: <b>' + esc(wo) + '</b>.</p>' +
    '<div class="opts two" id="verbArt" style="margin-bottom:10px"><button type="button" class="opt" data-a="fehler">🐞 Fehler gefunden</button><button type="button" class="opt" data-a="idee">✨ Idee / unklar</button></div>' +
    '<textarea id="verbText" maxlength="4000" rows="5" style="width:100%;box-sizing:border-box" placeholder="Was ist dir aufgefallen? Zum Beispiel: Der Knopf … reagiert nicht, im Text steht …, ich hätte mir hier ein Beispiel gewünscht …"></textarea>' +
    '<p class="small muted" style="margin:8px 0 0">Bitte keine Passwörter oder Schlüssel. Du kannst Fehler und Ideen auch einfach dem Kurs-Assistenten (Chat unten rechts) schreiben, er gibt sie an uns weiter.</p>' +
    '<div class="row" style="justify-content:flex-end;gap:10px;margin-top:14px"><button class="btn sec" id="verbAbbr" type="button">Abbrechen</button><button class="btn" id="verbSend" type="button">Senden</button></div></div>';
  let art = "idee";
  const knoepfe = o.querySelectorAll("#verbArt [data-a]");
  const setArt = a => { art = a; knoepfe.forEach(b => { const on = b.dataset.a === a; b.style.borderColor = on ? "var(--accent)" : ""; b.style.background = on ? "#F4F1FD" : ""; b.setAttribute("aria-pressed", on ? "true" : "false"); }); };
  knoepfe.forEach(b => b.onclick = () => setArt(b.dataset.a));
  setArt("idee");
  o.onclick = e => { if (e.target === o) o.remove(); };
  document.getElementById("verbAbbr").onclick = () => o.remove();
  document.getElementById("verbText").focus();
  document.getElementById("verbSend").onclick = async ev => {
    const t = document.getElementById("verbText").value.trim();
    if (t.length < 5) { toast("Bitte schreib kurz, was dir aufgefallen ist."); return; }
    if (!S.name || !kurscodeOk(S.kurscode)) { toast("Bitte trag zuerst auf der Startseite deinen Namen und den Kurscode ein."); return; }
    ev.target.disabled = true;
    try {
      const r = await fetch(VERB_HOOK, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ aktion: "verbesserung", art, text: t, modul: KURS, schritt: schrittName(S.step || 0), seite: location.pathname, teilnehmer_id: teilnehmerId(), name: S.name || "", kurscode: S.kurscode || "" }) });
      const j = await r.json().catch(() => ({ ok: false }));
      if (!j.ok) throw new Error(j.fehler || "Das hat leider nicht geklappt. Bitte versuch es später noch einmal.");
      o.remove(); toast("Danke! Dein Hinweis ist beim Momentum-Team angekommen.");
    } catch (e) { toast(e.message); ev.target.disabled = false; }
  };
}
$("#pause").onclick = e => { e.preventDefault(); fuerHeuteBeenden(false); };
$("#next").onclick = () => { if (STEPS[S.step] && STEPS[S.step].k === "summary") { fortschrittJetztSenden(); location.href = SEITE + '?utm_source=kurs&utm_medium=modul1&utm_campaign=abschluss#foerder-check'; return; } go(S.step + 1); };
$("#back").onclick = () => go(S.step - 1);
render();

</script>
